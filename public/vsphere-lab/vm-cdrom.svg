<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="817" viewBox="0 0 1200 817" role="img" aria-label="Recognize installer-media connection settings">
<rect width="100%" height="100%" fill="#f6f0e6"/>
<text x="24" y="35" font-family="Arial,sans-serif" font-size="26" font-weight="bold" fill="#292929">Recognize installer-media connection settings</text>
<text x="24" y="66" font-family="Arial,sans-serif" font-size="17" fill="#66596c">Official VMware/Broadcom reference · source KB 413851 · not our lab</text>
<image x="0" y="86" width="1200" height="563.4980988593156" href="data:image/png;base64,"/>
<circle cx="1116.0" cy="147.98479087452472" r="19" fill="#7040a8" stroke="white" stroke-width="3"/>
<text x="1116.0" y="153.98479087452472" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="white">1</text>
<text x="24" y="692.4980988593156" font-family="Arial,sans-serif" font-size="20" fill="#292929">1. Connected describes the current virtual CD/DVD connection.</text>
<circle cx="456.0" cy="238.14448669201522" r="19" fill="#7040a8" stroke="white" stroke-width="3"/>
<text x="456.0" y="244.14448669201522" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="white">2</text>
<text x="24" y="732.4980988593156" font-family="Arial,sans-serif" font-size="20" fill="#292929">2. Connect At Power On controls boot-time connection.</text>
<circle cx="936.0" cy="345.2091254752852" r="19" fill="#7040a8" stroke="white" stroke-width="3"/>
<text x="936.0" y="351.2091254752852" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="19" fill="white">3</text>
<text x="24" y="772.4980988593156" font-family="Arial,sans-serif" font-size="20" fill="#292929">3. Inspect the actual media backing; this example is unavailable.</text>
</svg>