ormal">Name          Type          Host Connection       DHCP       Subnet Address</text><rect x="285" y="246" width="940" height="40" fill="#fff" stroke="#ddd" rx="0"/><text x="296" y="273" font-family="Consolas, monospace" font-size="16" fill="#242424" font-weight="normal">VMnet2        Host-only     Connected             Disabled   10.50.0.0</text><rect x="285" y="288" width="940" height="40" fill="#e4edf9" stroke="#ddd" rx="0"/><text x="296" y="315" font-family="Consolas, monospace" font-size="16" fill="#242424" font-weight="normal">VMnet3        Host-only     Not connected         Disabled   10.60.0.0</text><rect x="285" y="330" width="940" height="40" fill="#fff" stroke="#ddd" rx="0"/><text x="296" y="357" font-family="Consolas, monospace" font-size="16" fill="#242424" font-weight="normal">VMnet4        Host-only     Not connected         Disabled   10.70.0.0</text><rect x="285" y="372" width="940" height="40" fill="#fff" stroke="#ddd" rx="0"/><text x="296" y="399" font-family="Consolas, monospace" font-size="16" fill="#242424" font-weight="normal">VMnet5        Host-only     Not connected         Disabled   10.80.0.0</text><text x="290" y="424" font-family="Arial, sans-serif" font-size="18" fill="#242424" font-weight="bold">VMnet Information</text><text x="310" y="468" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">○ Bridged      ○ NAT      ● Host-only</text><text x="310" y="510" font-family="Arial, sans-serif" font-size="18" fill="#242424" font-weight="normal">☐ Connect a host virtual adapter to this network</text><text x="310" y="551" font-family="Arial, sans-serif" font-size="18" fill="#242424" font-weight="normal">☐ Use local DHCP service to distribute IP addresses to VMs</text><text x="310" y="606" font-family="Arial, sans-serif" font-size="18" fill="#242424" font-weight="normal">Subnet IP:   10.60.0.0       Subnet mask:   255.255.255.0</text><rect x="1080" y="666" width="145" height="35" fill="#eee" stroke="#aaa" rx="