<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Find the same request in both logs — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><rect x="18" y="79" width="1244" height="642" fill="#161616" stroke="#777" rx="5"/><rect x="18" y="79" width="1244" height="43" fill="#eeeeee" stroke="none" rx="0"/><text x="35" y="108" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">AlmaLinux 9 — PROXY01 console</text><text x="41" y="156" font-family="Arial, sans-serif" font-size="20" fill="#fafafa" font-weight="bold">Find the same request in both logs</text><text x="42" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">$ sudo tail -n 20 /var/log/nginx/dmz-access.log</text><text x="42" y="218" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo tail -n 20 /var/log/nginx/dmz-error.log</text><text x="42" y="661" font-family="Arial, sans-serif" font-size="15" fill="#d9c49d" font-weight="bold">EXPECTED OBSERVATION — compare with your own command output:</text><text x="42" y="690" font-family="Arial, sans-serif" font-size="15" fill="#f4f4f4" font-weight="normal">You find the same labtrace request in the gateway and IIS logs. IIS sees the gateway as its connecting client.</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">You find the same labtrace request in the gateway and IIS logs. IIS sees the gateway as its connecting client.</text></svg>