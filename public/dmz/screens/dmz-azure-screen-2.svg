<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Estimate Azure costs before building — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><text x="32" y="96" font-family="Arial, sans-serif" font-size="27" fill="#242424" font-weight="bold">Estimate Azure costs before building</text><text x="32" y="129" font-family="Arial, sans-serif" font-size="18" fill="#555" font-weight="normal">Planning diagram • no resources deployed</text><rect x="30" y="190" width="282" height="142" fill="#e4e8ed" stroke="#9c9c9c" rx="10"/><text x="45" y="224" font-family="Arial, sans-serif" font-size="16" fill="#242424" font-weight="bold">PUBLIC HTTPS</text><text x="45" y="260" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Visitors</text><path d="M314 260 h26" stroke="#333" stroke-width="3"/><text x="311" y="247" font-family="Arial, sans-serif" font-size="12" fill="#242424" font-weight="normal">443</text><rect x="343" y="190" width="282" height="142" fill="#f0ddc4" stroke="#9c9c9c" rx="10"/><text x="358" y="224" font-family="Arial, sans-serif" font-size="16" fill="#242424" font-weight="bold">MANAGED INGRESS</text><text x="358" y="260" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Application Gateway WAF</text><path d="M627 260 h26" stroke="#333" stroke-width="3"/><text x="624" y="247" font-family="Arial, sans-serif" font-size="12" fill="#242424" font-weight="normal">443</text><rect x="656" y="190" width="282" height="142" fill="#e8dfef" stroke="#9c9c9c" rx="10"/><text x="671" y="224" font-family="Arial, sans-serif" font-size="16" fill="#242424" font-weight="bold">PRIVATE BACKEND</text><text x="671" y="260" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">IIS VM · no public IP</text><path d="M940 260 h26" stroke="#333" stroke-width="3"/><text x="937" y="247" font-family="Arial, sans-serif" font-size="12" fill="#242424" font-weight="normal">Policy</text><rect x="969" y="190" width="282" height="142" fill="#dce8e4" stroke="#9c9c9c" rx="10"/><text x="984" y="224" font-family="Arial, sans-serif" font-size="16" fill="#242424" font-weight="bold">PRIVATE DATA / AD</text><text x="984" y="260" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Only approved paths</text><text x="42" y="376" font-family="Arial, sans-serif" font-size="18" fill="#242424" font-weight="bold">Azure uses VNet/subnet policies and a non-overlapping address plan, not VMware VMnet names.</text><text x="45" y="430" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="bold">Managed gateway/WAF</text><text x="390" y="430" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Estimate fixed and capacity costs</text><text x="45" y="493" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="bold">VM stopped</text><text x="390" y="493" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Disks/IP and other services may still bill</text><text x="45" y="556" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="bold">Budget alert</text><text x="390" y="556" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Notification, not a hard cap</text><text x="45" y="619" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="bold">This lesson</text><text x="390" y="619" font-family="Arial, sans-serif" font-size="17" fill="#242424" font-weight="normal">Plan only · no Create action</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">Your notes include the region, running hours, estimated charges and deletion plan. No Azure resources were created.</text></svg>