<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Install OPNsense on FW01 — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><rect x="18" y="79" width="1244" height="642" fill="#121212" stroke="#777" rx="5"/><rect x="18" y="79" width="1244" height="43" fill="#eeeeee" stroke="none" rx="0"/><text x="35" y="108" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">OPNsense — FW01 VMware console</text><text x="42" y="174" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Interface assignment — example device names only</text><text x="42" y="203" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Match each interface MAC with your own VMware inventory.</text><text x="42" y="232" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal"></text><text x="42" y="261" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enter the WAN interface name: vmx0   [VMnet4 / OUTSIDE]</text><text x="42" y="290" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enter the LAN interface name: vmx1   [VMnet2 / management]</text><text x="42" y="319" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enter the Optional 1 interface name: vmx2   [VMnet3 / DMZ]</text><text x="42" y="348" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enter the Optional 2 interface name: vmx3   [VMnet5 / APP_PRIVATE]</text><text x="42" y="377" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Do you want to proceed? y</text><text x="42" y="406" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal"></text><text x="42" y="435" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Next: configure the four static IPv4 addresses.</text><text x="42" y="690" font-family="Arial, sans-serif" font-size="15" fill="#d9c49d" font-weight="normal">Training recreation: prompts/device names can differ by release.</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">FW01 boots from disk with WAN, LAN, OPT1 and OPT2 mapped to the correct recorded MACs.</text></svg>