<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Install the firewall on FW01 — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><rect x="18" y="79" width="1244" height="642" fill="#121212" stroke="#777" rx="5"/><rect x="18" y="79" width="1244" height="43" fill="#eeeeee" stroke="none" rx="0"/><text x="35" y="108" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">OPNsense — FW01 VMware console</text><text x="42" y="174" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Set interface IP address — LAN management example</text><text x="42" y="203" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Interface: LAN  (verify your MAC inventory)</text><text x="42" y="232" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Configure IPv4 address LAN interface via DHCP? n</text><text x="42" y="261" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enter the new LAN IPv4 address: 10.50.0.1</text><text x="42" y="290" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enter subnet bit count: 24</text><text x="42" y="319" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Upstream gateway: [blank]</text><text x="42" y="348" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Configure IPv6 via DHCP6? n</text><text x="42" y="377" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">New IPv6 address: [blank]</text><text x="42" y="406" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Enable DHCP server on LAN? n</text><text x="42" y="435" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Use HTTP instead of HTTPS for the web interface? n</text><text x="42" y="464" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal"></text><text x="42" y="493" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="17" fill="#f4f4f4" font-weight="normal">Repeat for WAN 10.70.0.1, OPT1 10.60.0.1 and OPT2 10.80.0.1.</text><text x="42" y="690" font-family="Arial, sans-serif" font-size="15" fill="#d9c49d" font-weight="normal">Training recreation: prompts/device names can differ by release.</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">FW01 starts from its virtual disk. Its four network adapters match the MAC addresses in your notes.</text></svg>