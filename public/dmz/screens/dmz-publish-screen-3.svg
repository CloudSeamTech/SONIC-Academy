<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Copy the certificate the visitor needs — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><rect x="18" y="79" width="1244" height="642" fill="#161616" stroke="#777" rx="5"/><rect x="18" y="79" width="1244" height="43" fill="#eeeeee" stroke="none" rx="0"/><text x="35" y="108" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">AlmaLinux 9 — TEST01 Terminal</text><text x="41" y="156" font-family="Arial, sans-serif" font-size="20" fill="#fafafa" font-weight="bold">Copy the certificate the visitor needs</text><text x="42" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">$ mkdir -p ~/dmz-lab</text><text x="42" y="218" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo mkdir -p /mnt/dmz-transfer</text><text x="42" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo vmhgfs-fuse .host:/DMZ-Transfer /mnt/dmz-transfer -o allow_other</text><text x="42" y="264" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">cp /mnt/dmz-transfer/proxy-public.crt ~/dmz-lab/</text><text x="42" y="287" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">openssl x509 -in ~/dmz-lab/proxy-public.crt -noout -fingerprint -sha256</text><text x="42" y="310" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo umount /mnt/dmz-transfer</text><text x="42" y="661" font-family="Arial, sans-serif" font-size="15" fill="#d9c49d" font-weight="bold">EXPECTED OBSERVATION — compare with your own command output:</text><text x="42" y="690" font-family="Arial, sans-serif" font-size="15" fill="#f4f4f4" font-weight="normal">TEST01 has the gateway’s matching public certificate. Shared Folders is now disabled on all practice VMs.</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">TEST01 has the gateway’s matching public certificate. Shared Folders is now disabled on all practice VMs.</text></svg>