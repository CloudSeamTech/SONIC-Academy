<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Start NGINX and keep protections on — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><rect x="18" y="79" width="1244" height="642" fill="#161616" stroke="#777" rx="5"/><rect x="18" y="79" width="1244" height="43" fill="#eeeeee" stroke="none" rx="0"/><text x="35" y="108" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">AlmaLinux 9 — PROXY01 console</text><text x="41" y="156" font-family="Arial, sans-serif" font-size="20" fill="#fafafa" font-weight="bold">Start NGINX and keep protections on</text><text x="42" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">$ sudo setsebool -P httpd_can_network_connect 1</text><text x="42" y="218" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo firewall-cmd --get-active-zones</text><text x="42" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo firewall-cmd --permanent --zone=public --add-rich-rule=&#x27;rule family=&quot;ipv4&quot; source </text><text x="42" y="264" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">address=&quot;10.70.0.10/32&quot; service name=&quot;https&quot; accept&#x27;</text><text x="42" y="287" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo firewall-cmd --reload</text><text x="42" y="310" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo systemctl enable --now nginx</text><text x="42" y="333" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">systemctl is-active nginx</text><text x="42" y="356" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">getenforce</text><text x="42" y="379" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">sudo ss -lntp | grep &#x27;:443&#x27;</text><text x="42" y="661" font-family="Arial, sans-serif" font-size="15" fill="#d9c49d" font-weight="bold">EXPECTED OBSERVATION — compare with your own command output:</text><text x="42" y="690" font-family="Arial, sans-serif" font-size="15" fill="#f4f4f4" font-weight="normal">NGINX is active at 10.60.0.10:443. SELinux and firewalld remain on, with HTTPS allowed only from TEST01.</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">NGINX is active at 10.60.0.10:443. SELinux and firewalld remain on, with HTTPS allowed only from TEST01.</text></svg>