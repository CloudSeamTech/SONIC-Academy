<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820"><title>Install IIS and create a clearly named practice site — illustrated training recreation</title><rect x="0" y="0" width="1280" height="820" fill="#f3f3f3" stroke="none" rx="0"/><rect x="0" y="0" width="1280" height="54" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="34" font-family="Arial, sans-serif" font-size="18" fill="#302a24" font-weight="bold">ILLUSTRATED TRAINING RECREATION • NOT A LIVE CAPTURE</text><rect x="18" y="79" width="1244" height="642" fill="#012456" stroke="#777" rx="5"/><rect x="18" y="79" width="1244" height="43" fill="#eeeeee" stroke="none" rx="0"/><text x="35" y="108" font-family="Arial, sans-serif" font-size="19" fill="#242424" font-weight="normal">Windows PowerShell — Administrator: IIS-DMZ01</text><text x="41" y="156" font-family="Arial, sans-serif" font-size="20" fill="#fafafa" font-weight="bold">Install IIS and create a clearly named practice site</text><text x="42" y="195" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">PS C:\&gt; if ($env:COMPUTERNAME -ne &#x27;IIS-DMZ01&#x27;) { throw &#x27;Wrong VM. Stop here.&#x27; }</text><text x="42" y="218" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">Install-WindowsFeature Web-Server -IncludeManagementTools</text><text x="42" y="241" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">Import-Module WebAdministration</text><text x="42" y="264" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">New-Item -ItemType Directory -Path C:\inetpub\dmz-lab -Force</text><text x="42" y="287" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">&#x27;&lt;h1&gt;CloudSeam DMZ lab&lt;/h1&gt;&lt;p&gt;Private IIS backend: IIS-DMZ01&lt;/p&gt;&#x27; | Set-Content C:\inetpub\dmz-</text><text x="42" y="310" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">lab\index.html</text><text x="42" y="333" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">Stop-Website &#x27;Default Web Site&#x27;</text><text x="42" y="356" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">New-Website -Name &#x27;DMZ-Lab&#x27; -PhysicalPath C:\inetpub\dmz-lab -IPAddress 127.0.0.1 -Port 8080</text><text x="42" y="379" font-family="Consolas, DejaVu Sans Mono, monospace" font-size="16" fill="#f4f4f4" font-weight="normal">(Invoke-WebRequest http://127.0.0.1:8080 -UseBasicParsing).StatusCode</text><text x="42" y="661" font-family="Arial, sans-serif" font-size="15" fill="#d9c49d" font-weight="bold">EXPECTED OBSERVATION — compare with your own command output:</text><text x="42" y="690" font-family="Arial, sans-serif" font-size="15" fill="#f4f4f4" font-weight="normal">The local health request returns the CloudSeam training page from the DMZ-Lab site.</text><rect x="0" y="744" width="1280" height="76" fill="#eadcc5" stroke="none" rx="0"/><text x="24" y="769" font-family="Arial, sans-serif" font-size="15" fill="#40372a" font-weight="bold">COMPARE YOUR OWN RESULT — example state shown for teaching</text><text x="24" y="794" font-family="Arial, sans-serif" font-size="14" fill="#242424" font-weight="normal">The local health request returns the CloudSeam training page from the DMZ-Lab site.</text></svg>