# Training config for PROXY01 only. Original values are documented in /dmz.
# Self-signed certificates are pinned in this isolated lab; use managed PKI in production.
log_format dmz_lab '$remote_addr [$time_local] "$request" status=$status '
                   'upstream=$upstream_addr upstream_status=$upstream_status '
                   'request_time=$request_time';
server {
    listen 10.60.0.10:443 ssl;
    server_name app-dmz.cloudseam.tech;
    ssl_certificate /etc/pki/tls/certs/dmz-front.crt;
    ssl_certificate_key /etc/pki/tls/private/dmz-front.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/dmz-access.log dmz_lab;
    error_log /var/log/nginx/dmz-error.log warn;
    location / {
        proxy_pass https://10.80.0.40:443;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/tls/certs/iis-backend.pem;
        proxy_ssl_server_name on;
        proxy_ssl_name iis-backend.cloudseam.tech;
        proxy_set_header Host iis-backend.cloudseam.tech;
        # Replace a visitor-supplied forwarding header rather than trusting it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }
}
