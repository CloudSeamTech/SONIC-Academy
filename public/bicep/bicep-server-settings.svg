<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#bb92e5"/></marker></defs><rect width="1200" height="535" rx="10" fill="#241735"/><text x="28" y="38" fill="#e8d8ff" font-family="sans-serif" font-size="23">Read the VM Settings Before You Build</text><text x="28" y="68" fill="#c8bdcc" font-family="sans-serif" font-size="16">main.bicep · lines 65–76; full file below · authored teaching illustration</text><text x="24" y="117" fill="#b5a3c7" font-family="monospace" font-size="16">65</text><text x="65" y="117" fill="#fff6e7" font-family="monospace" font-size="16">  location: location</text><text x="24" y="147" fill="#b5a3c7" font-family="monospace" font-size="16">66</text><text x="65" y="147" fill="#fff6e7" font-family="monospace" font-size="16">  identity: { type: 'SystemAssigned' }</text><text x="24" y="177" fill="#b5a3c7" font-family="monospace" font-size="16">67</text><text x="65" y="177" fill="#fff6e7" font-family="monospace" font-size="16">  properties: {</text><text x="24" y="207" fill="#b5a3c7" font-family="monospace" font-size="16">68</text><text x="65" y="207" fill="#fff6e7" font-family="monospace" font-size="16">    hardwareProfile: { vmSize: 'Standard_B2s' }</text><text x="24" y="237" fill="#b5a3c7" font-family="monospace" font-size="16">69</text><text x="65" y="237" fill="#fff6e7" font-family="monospace" font-size="16">    osProfile: {</text><text x="24" y="267" fill="#b5a3c7" font-family="monospace" font-size="16">70</text><text x="65" y="267" fill="#fff6e7" font-family="monospace" font-size="16">      computerName: '${prefix}-vm-${i + 1}'</text><text x="24" y="297" fill="#b5a3c7" font-family="monospace" font-size="16">71</text><text x="65" y="297" fill="#fff6e7" font-family="monospace" font-size="16">      adminUsername: adminUsername</text><text x="24" y="327" fill="#b5a3c7" font-family="monospace" font-size="16">72</text><text x="65" y="327" fill="#fff6e7" font-family="monospace" font-size="16">      linuxConfiguration: {</text><text x="24" y="357" fill="#b5a3c7" font-family="monospace" font-size="16">73</text><text x="65" y="357" fill="#fff6e7" font-family="monospace" font-size="16">        disablePasswordAuthentication: true</text><text x="24" y="387" fill="#b5a3c7" font-family="monospace" font-size="16">74</text><text x="65" y="387" fill="#fff6e7" font-family="monospace" font-size="16">        ssh: {</text><text x="24" y="417" fill="#b5a3c7" font-family="monospace" font-size="16">75</text><text x="65" y="417" fill="#fff6e7" font-family="monospace" font-size="16">          publicKeys: [</text><text x="24" y="447" fill="#b5a3c7" font-family="monospace" font-size="16">76</text><text x="65" y="447" fill="#fff6e7" font-family="monospace" font-size="16">            {</text><path d="M820 130 L785 130 L785 155 L324 155" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">SystemAssigned</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">Azure manages this VM identity’s</text><text x="838" y="188" fill="#302634" font-family="sans-serif" font-size="15">lifecycle; RBAC permissions require</text><text x="838" y="206" fill="#302634" font-family="sans-serif" font-size="15">separate approved assignments.</text><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">imageReference</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">Publisher, offer, SKU and version identify</text><text x="838" y="313" fill="#302634" font-family="sans-serif" font-size="15">the OS image; verify availability in the</text><text x="838" y="331" fill="#302634" font-family="sans-serif" font-size="15">chosen region.</text><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">managedDisk</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">The OS disk remains a billable resource</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">after deployment; stopping a VM does not</text><text x="838" y="456" fill="#302634" font-family="sans-serif" font-size="15">remove disks.</text></svg>