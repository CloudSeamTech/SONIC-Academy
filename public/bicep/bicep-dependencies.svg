<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#bb92e5"/></marker></defs><rect width="1200" height="480" rx="10" fill="#241735"/><text x="28" y="38" fill="#e8d8ff" font-family="sans-serif" font-size="23">Understand What Depends on What</text><text x="28" y="68" fill="#c8bdcc" font-family="sans-serif" font-size="16">main.bicep · lines 31–40; full file below · authored teaching illustration</text><text x="24" y="117" fill="#b5a3c7" font-family="monospace" font-size="16">31</text><text x="65" y="117" fill="#fff6e7" font-family="monospace" font-size="16">        name: 'apps'</text><text x="24" y="147" fill="#b5a3c7" font-family="monospace" font-size="16">32</text><text x="65" y="147" fill="#fff6e7" font-family="monospace" font-size="16">        properties: {</text><text x="24" y="177" fill="#b5a3c7" font-family="monospace" font-size="16">33</text><text x="65" y="177" fill="#fff6e7" font-family="monospace" font-size="16">          addressPrefix: '10.42.1.0/24'</text><text x="24" y="207" fill="#b5a3c7" font-family="monospace" font-size="16">34</text><text x="65" y="207" fill="#fff6e7" font-family="monospace" font-size="16">          networkSecurityGroup: { id: nsg.id }</text><text x="24" y="237" fill="#b5a3c7" font-family="monospace" font-size="16">35</text><text x="65" y="237" fill="#fff6e7" font-family="monospace" font-size="16">        }</text><text x="24" y="267" fill="#b5a3c7" font-family="monospace" font-size="16">36</text><text x="65" y="267" fill="#fff6e7" font-family="monospace" font-size="16">      }</text><text x="24" y="297" fill="#b5a3c7" font-family="monospace" font-size="16">37</text><text x="65" y="297" fill="#fff6e7" font-family="monospace" font-size="16">    ]</text><text x="24" y="327" fill="#b5a3c7" font-family="monospace" font-size="16">38</text><text x="65" y="327" fill="#fff6e7" font-family="monospace" font-size="16">  }</text><text x="24" y="357" fill="#b5a3c7" font-family="monospace" font-size="16">39</text><text x="65" y="357" fill="#fff6e7" font-family="monospace" font-size="16">}</text><text x="24" y="387" fill="#b5a3c7" font-family="monospace" font-size="16">40</text><text x="65" y="387" fill="#fff6e7" font-family="monospace" font-size="16">output subnetId string = vnet.properties.subnets[0].id</text><path d="M820 130 L785 130 L785 215 L459 215" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">nsg.id</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">A symbolic reference that expresses an</text><text x="838" y="188" fill="#302634" font-family="sans-serif" font-size="15">implicit dependency.</text><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">dependsOn</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">An explicit resource dependency when a</text><text x="838" y="313" fill="#302634" font-family="sans-serif" font-size="15">real ordering relationship cannot be</text><text x="838" y="331" fill="#302634" font-family="sans-serif" font-size="15">expressed naturally.</text><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">existing</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">References an already present resource; it</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">does not create that resource or check its</text><text x="838" y="456" fill="#302634" font-family="sans-serif" font-size="15">live existence during local compilation.</text></svg>