<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="535" viewBox="0 0 1200 535"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#bb92e5"/></marker></defs><rect width="1200" height="535" rx="10" fill="#241735"/><text x="28" y="38" fill="#e8d8ff" font-family="sans-serif" font-size="23">Build a VNet, Subnet and NSG</text><text x="28" y="68" fill="#c8bdcc" font-family="sans-serif" font-size="16">main.bicep · lines 1–12; full file below · authored teaching illustration</text><text x="24" y="117" fill="#b5a3c7" font-family="monospace" font-size="16">01</text><text x="65" y="117" fill="#fff6e7" font-family="monospace" font-size="16">param location string = resourceGroup().location</text><text x="24" y="147" fill="#b5a3c7" font-family="monospace" font-size="16">02</text><text x="65" y="147" fill="#fff6e7" font-family="monospace" font-size="16">param prefix string = 'cs-dev'</text><text x="24" y="177" fill="#b5a3c7" font-family="monospace" font-size="16">03</text><text x="65" y="177" fill="#fff6e7" font-family="monospace" font-size="16">resource nsg 'Microsoft.Network/networkSecurityGroups@2024-05-01' = {</text><text x="24" y="207" fill="#b5a3c7" font-family="monospace" font-size="16">04</text><text x="65" y="207" fill="#fff6e7" font-family="monospace" font-size="16">  name: '${prefix}-nsg'</text><text x="24" y="237" fill="#b5a3c7" font-family="monospace" font-size="16">05</text><text x="65" y="237" fill="#fff6e7" font-family="monospace" font-size="16">  location: location</text><text x="24" y="267" fill="#b5a3c7" font-family="monospace" font-size="16">06</text><text x="65" y="267" fill="#fff6e7" font-family="monospace" font-size="16">  properties: {</text><text x="24" y="297" fill="#b5a3c7" font-family="monospace" font-size="16">07</text><text x="65" y="297" fill="#fff6e7" font-family="monospace" font-size="16">    securityRules: [</text><text x="24" y="327" fill="#b5a3c7" font-family="monospace" font-size="16">08</text><text x="65" y="327" fill="#fff6e7" font-family="monospace" font-size="16">      {</text><text x="24" y="357" fill="#b5a3c7" font-family="monospace" font-size="16">09</text><text x="65" y="357" fill="#fff6e7" font-family="monospace" font-size="16">        name: 'DenyInboundByDefault'</text><text x="24" y="387" fill="#b5a3c7" font-family="monospace" font-size="16">10</text><text x="65" y="387" fill="#fff6e7" font-family="monospace" font-size="16">        properties: {</text><text x="24" y="417" fill="#b5a3c7" font-family="monospace" font-size="16">11</text><text x="65" y="417" fill="#fff6e7" font-family="monospace" font-size="16">          priority: 4096</text><text x="24" y="447" fill="#b5a3c7" font-family="monospace" font-size="16">12</text><text x="65" y="447" fill="#fff6e7" font-family="monospace" font-size="16">          direction: 'Inbound'</text><path d="M820 130 L785 130 L785 125 L343 125" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">source / destination</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">Who sends the traffic and where it goes.</text><path d="M820 255 L785 255 L785 425 L199 425" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">priority</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">Lower numbers are evaluated before higher</text><text x="838" y="313" fill="#302634" font-family="sans-serif" font-size="15">numbers for matching NSG rules.</text><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">NSG vs Entra group</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">Network packet rules versus identity</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">membership; do not interchange their</text><text x="838" y="456" fill="#302634" font-family="sans-serif" font-size="15">resource types.</text></svg>