orageV2'</text><text x="24" y="327" fill="#b5a3c7" font-family="monospace" font-size="16">08</text><text x="65" y="327" fill="#fff6e7" font-family="monospace" font-size="16">  properties: {</text><text x="24" y="357" fill="#b5a3c7" font-family="monospace" font-size="16">09</text><text x="65" y="357" fill="#fff6e7" font-family="monospace" font-size="16">    supportsHttpsTrafficOnly: true</text><text x="24" y="387" fill="#b5a3c7" font-family="monospace" font-size="16">10</text><text x="65" y="387" fill="#fff6e7" font-family="monospace" font-size="16">    minimumTlsVersion: 'TLS1_2'</text><text x="24" y="417" fill="#b5a3c7" font-family="monospace" font-size="16">11</text><text x="65" y="417" fill="#fff6e7" font-family="monospace" font-size="16">    allowBlobPublicAccess: false</text><text x="24" y="447" fill="#b5a3c7" font-family="monospace" font-size="16">12</text><text x="65" y="447" fill="#fff6e7" font-family="monospace" font-size="16">  }</text><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">validate</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">Ask ARM to validate this template at the</text><text x="838" y="188" fill="#302634" font-family="sans-serif" font-size="15">selected scope; provider checks depend on</text><text x="838" y="206" fill="#302634" font-family="sans-serif" font-size="15">permissions and CLI version.</text><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">what-if</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">Preview proposed changes; unresolved</text><text x="838" y="313" fill="#302634" font-family="sans-serif" font-size="15">expressions and provider behavior can</text><text x="838" y="331" fill="#302634" font-family="sans-serif" font-size="15">limit accuracy.</text><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">create</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">An actual deployment command, deliberately</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">separate from this practice checker.</text></svg>