<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#bb92e5"/></marker></defs><rect width="1200" height="480" rx="10" fill="#241735"/><text x="28" y="38" fill="#e8d8ff" font-family="sans-serif" font-size="23">Split a Network into a Module</text><text x="28" y="68" fill="#c8bdcc" font-family="sans-serif" font-size="16">main.bicep · complete example · authored teaching illustration</text><text x="24" y="117" fill="#b5a3c7" font-family="monospace" font-size="16">01</text><text x="65" y="117" fill="#fff6e7" font-family="monospace" font-size="16">param environment string = 'dev'</text><text x="24" y="147" fill="#b5a3c7" font-family="monospace" font-size="16">02</text><text x="65" y="147" fill="#fff6e7" font-family="monospace" font-size="16">module network './network.bicep' = {</text><text x="24" y="177" fill="#b5a3c7" font-family="monospace" font-size="16">03</text><text x="65" y="177" fill="#fff6e7" font-family="monospace" font-size="16">  name: 'network-${environment}'</text><text x="24" y="207" fill="#b5a3c7" font-family="monospace" font-size="16">04</text><text x="65" y="207" fill="#fff6e7" font-family="monospace" font-size="16">  params: { prefix: 'cs-${environment}' }</text><text x="24" y="237" fill="#b5a3c7" font-family="monospace" font-size="16">05</text><text x="65" y="237" fill="#fff6e7" font-family="monospace" font-size="16">}</text><text x="24" y="267" fill="#b5a3c7" font-family="monospace" font-size="16">06</text><text x="65" y="267" fill="#fff6e7" font-family="monospace" font-size="16">output appSubnetId string = network.outputs.subnetId</text><path d="M820 130 L785 130 L750 147" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">./network.bicep</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">A relative path beside main.bicep.</text><path d="M820 255 L785 255 L750 207" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">params</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">Values the parent passes to the child’s</text><text x="838" y="313" fill="#302634" font-family="sans-serif" font-size="15">declared parameters.</text><path d="M820 380 L785 380 L750 267" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">network.outputs.subnetId</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">The module’s declared output, not a</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">free-form field name.</text></svg>