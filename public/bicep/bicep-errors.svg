<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#bb92e5"/></marker></defs><rect width="1200" height="480" rx="10" fill="#241735"/><text x="28" y="38" fill="#e8d8ff" font-family="sans-serif" font-size="23">Fix One Error at a Time</text><text x="28" y="68" fill="#c8bdcc" font-family="sans-serif" font-size="16">main.bicep · complete example · authored teaching illustration</text><text x="24" y="117" fill="#b5a3c7" font-family="monospace" font-size="16">01</text><text x="65" y="117" fill="#fff6e7" font-family="monospace" font-size="16">param greeting string = 'Hello, CloudSeam'</text><text x="24" y="147" fill="#b5a3c7" font-family="monospace" font-size="16">02</text><text x="65" y="147" fill="#fff6e7" font-family="monospace" font-size="16">output message string = greeting</text><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">Diagnostic</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">A compiler message with a severity and</text><text x="838" y="188" fill="#302634" font-family="sans-serif" font-size="15">source location.</text><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">Error</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">Prevents a valid template from being</text><text x="838" y="313" fill="#302634" font-family="sans-serif" font-size="15">emitted.</text><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">Warning</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">A concern to review; it may not prevent</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">compilation.</text></svg>