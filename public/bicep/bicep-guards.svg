<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#bb92e5"/></marker></defs><rect width="1200" height="480" rx="10" fill="#241735"/><text x="28" y="38" fill="#e8d8ff" font-family="sans-serif" font-size="23">Add Guardrails Before Resources</text><text x="28" y="68" fill="#c8bdcc" font-family="sans-serif" font-size="16">main.bicep · complete example · authored teaching illustration</text><text x="24" y="117" fill="#b5a3c7" font-family="monospace" font-size="16">01</text><text x="65" y="117" fill="#fff6e7" font-family="monospace" font-size="16">@minValue(1)</text><text x="24" y="147" fill="#b5a3c7" font-family="monospace" font-size="16">02</text><text x="65" y="147" fill="#fff6e7" font-family="monospace" font-size="16">@maxValue(3)</text><text x="24" y="177" fill="#b5a3c7" font-family="monospace" font-size="16">03</text><text x="65" y="177" fill="#fff6e7" font-family="monospace" font-size="16">param serverCount int = 2</text><text x="24" y="207" fill="#b5a3c7" font-family="monospace" font-size="16">04</text><text x="65" y="207" fill="#fff6e7" font-family="monospace" font-size="16">@allowed(['dev', 'test'])</text><text x="24" y="237" fill="#b5a3c7" font-family="monospace" font-size="16">05</text><text x="65" y="237" fill="#fff6e7" font-family="monospace" font-size="16">param environment string = 'dev'</text><text x="24" y="267" fill="#b5a3c7" font-family="monospace" font-size="16">06</text><text x="65" y="267" fill="#fff6e7" font-family="monospace" font-size="16">@secure()</text><text x="24" y="297" fill="#b5a3c7" font-family="monospace" font-size="16">07</text><text x="65" y="297" fill="#fff6e7" font-family="monospace" font-size="16">param adminPassword string</text><text x="24" y="327" fill="#b5a3c7" font-family="monospace" font-size="16">08</text><text x="65" y="327" fill="#fff6e7" font-family="monospace" font-size="16">output count int = serverCount</text><path d="M820 130 L785 130 L785 125 L108 125" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="105" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="127" r="14" fill="#7141a5"/><text x="842" y="133" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">1</text><text x="865" y="131" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">@minValue / @maxValue</text><text x="838" y="170" fill="#302634" font-family="sans-serif" font-size="15">Limit accepted numeric values.</text><path d="M820 255 L785 255 L785 215 L103 215" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="230" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="252" r="14" fill="#7141a5"/><text x="842" y="258" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">2</text><text x="865" y="256" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">@allowed</text><text x="838" y="295" fill="#302634" font-family="sans-serif" font-size="15">Restricts a parameter to named choices.</text><path d="M820 380 L785 380 L785 275 L99 275" stroke="#bb92e5" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="820" y="355" width="350" height="112" rx="6" fill="#f4ead7"/><circle cx="842" cy="377" r="14" fill="#7141a5"/><text x="842" y="383" text-anchor="middle" fill="white" font-family="sans-serif" font-size="18">3</text><text x="865" y="381" fill="#402259" font-family="sans-serif" font-size="16" font-weight="bold">@secure</text><text x="838" y="420" fill="#302634" font-family="sans-serif" font-size="15">Suppresses normal parameter-value</text><text x="838" y="438" fill="#302634" font-family="sans-serif" font-size="15">logging/display in ARM; still obtain</text><text x="838" y="456" fill="#302634" font-family="sans-serif" font-size="15">secrets through an approved secret</text></svg>