<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc"><title id="title">Check your account before you start</title><desc id="desc">Original teaching diagram, not an Azure screenshot.</desc><rect width="1200" height="505" fill="#080808"/><text x="46" y="40" fill="#21c5db" font-family="Arial,sans-serif" font-size="18">SONIC-Academy · ORIGINAL TEACHING DIAGRAM</text><text x="46" y="86" fill="#eaeaea" font-family="Arial,sans-serif" font-size="30">Check your account before you start</text><rect x="45" y="115" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="144" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Create resources</text><text x="65" y="173" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Contributor on the dedicated lab resource group, or approved equivalent</text><rect x="45" y="205" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="234" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Grant data access</text><text x="65" y="263" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Role assignment permission at the lab storage account</text><rect x="45" y="295" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="324" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Read and write files</text><text x="65" y="353" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Storage Blob Data Contributor on this account</text><rect x="45" y="385" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="414" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Windows domain</text><text x="65" y="443" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">lab.example.test stays your lab AD domain; Azure tenant is separate</text></svg>