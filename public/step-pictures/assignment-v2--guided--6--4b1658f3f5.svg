<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="758" viewBox="0 0 1200 758" role="img" aria-labelledby="title desc"><title id="title">Check the result and save your notes — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="758" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Check the result and save your notes</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Windows · PowerShell</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Create a plain-text change record in an approved local folder: purpose; date/time;</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#18334e">tenant/subscription; owner; resource names; region; budget; recovery contact; baseline (VM</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#18334e">does not exist); proposed change; acceptance checks; rollback trigger; evidence.</text><path d="M60 384v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="400" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="430" r="18" fill="#18334e"/><text x="54" y="437" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="434" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Leave unknown facts blank until verified.</text><path d="M60 473v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="489" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="519" r="18" fill="#18334e"/><text x="54" y="526" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="523" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Never record private keys or passphrases.</text><rect x="28" y="578" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="608" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="19" fill="#18334e">PowerShell prints rexuser, rg-rhel9-lab, and rhel9-lab-01. Azure remains unchanged.</text><text x="30" y="735" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>