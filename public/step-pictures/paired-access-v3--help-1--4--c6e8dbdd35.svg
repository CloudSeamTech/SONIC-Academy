<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">Save the current permissions before editing — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1180" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Save the current permissions before editing</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your own Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="328" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">$SonicAclFolder = Join-Path $env:LOCALAPPDATA &quot;SONIC&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">New-Item -ItemType Directory -Path $SonicAclFolder -Force | Out-Null</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">$SonicAclBackup = Join-Path $SonicAclFolder (&quot;key-acl-&quot; + [guid]::NewGuid().ToString() +</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">&quot;.txt&quot;)</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">$SonicKeyName = [System.IO.Path]::GetFileName($SonicKey)</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">Push-Location -LiteralPath $SonicKeyFolder</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">icacls &quot;$SonicKeyName&quot; /save &quot;$SonicAclBackup&quot;</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#292929">$SonicAclSaved = $LASTEXITCODE</text><text x="54" y="552" font-family="monospace" font-size="18" fill="#292929">Pop-Location</text><text x="44" y="605" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="637" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="667" r="18" fill="#292929"/><text x="54" y="674" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="671" font-family="Arial, sans-serif" font-size="20" fill="#292929">This saves permission information, not the private-key contents.</text><path d="M60 710v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="726" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="756" r="18" fill="#292929"/><text x="54" y="763" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="760" font-family="Arial, sans-serif" font-size="20" fill="#292929">Keep the backup path in your local notes. /save saves the file’s access list; it is not a</text><text x="96" y="790" font-family="Arial, sans-serif" font-size="20" fill="#292929">backup of the key and does not save its owner.</text><path d="M60 828v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="844" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="874" r="18" fill="#292929"/><text x="54" y="881" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="878" font-family="Arial, sans-serif" font-size="20" fill="#292929">Push-Location temporarily opens the key’s parent folder so the saved filename can be</text><text x="96" y="908" font-family="Arial, sans-serif" font-size="20" fill="#292929">restored to the same folder later.</text><text x="44" y="962" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="1000" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="1030" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1062" font-family="Arial, sans-serif" font-size="19" fill="#292929">The permission backup was saved successfully and its path is recorded.</text><text x="30" y="1157" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>