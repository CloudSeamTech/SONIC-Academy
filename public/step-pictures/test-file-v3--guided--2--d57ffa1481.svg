<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1003" viewBox="0 0 1200 1003" role="img" aria-labelledby="title desc"><title id="title">Command 1: read, type, then check — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1003" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Command 1: read, type, then check</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Windows · PowerShell</text><rect x="28" y="253" width="1144" height="247" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">$TestFile = &quot;$env:USERPROFILE\rexuser-transfer-v3.txt&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">if (-not (Test-Path -LiteralPath $TestFile)) {</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">Set-Content -LiteralPath $TestFile -Value &quot;Harmless rexuser transfer practice.&quot;</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">-Encoding ascii</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">}</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">Get-FileHash -LiteralPath $TestFile -Algorithm SHA256</text><text x="44" y="524" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="556" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="586" r="18" fill="#292929"/><text x="54" y="593" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="590" font-family="Arial, sans-serif" font-size="20" fill="#292929">This saves a value in the current PowerShell tab.</text><path d="M60 629v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="645" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="675" r="18" fill="#292929"/><text x="54" y="682" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="679" font-family="Arial, sans-serif" font-size="20" fill="#292929">It does not create an Azure resource.</text><path d="M60 718v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="734" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="764" r="18" fill="#292929"/><text x="54" y="771" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="768" font-family="Arial, sans-serif" font-size="20" fill="#292929">Replace any REPLACE_WITH text with the real value from your notes before running it.</text><rect x="28" y="823" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="853" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="885" font-family="Arial, sans-serif" font-size="19" fill="#292929">Usually no output appears. The value is now available in this tab.</text><text x="30" y="980" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>