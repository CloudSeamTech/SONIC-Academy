<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="964" viewBox="0 0 1200 964" role="img" aria-labelledby="title desc"><title id="title">Transfer the test site over the private path — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="964" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Transfer the test site over the private path</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">APP01 and APP02 · private file transfer through Windows File Explorer</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">Get-FileHash C:\inetpub\wwwroot\index.html -Algorithm SHA256</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="421" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="451" r="18" fill="#292929"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#292929">On APP01 create a temporary read-only SMB share for the test site, limited to the</text><text x="96" y="485" font-family="Arial, sans-serif" font-size="20" fill="#292929">authorized transfer identity and private APP02 path.</text><path d="M60 523v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="539" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="569" r="18" fill="#292929"/><text x="54" y="576" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="573" font-family="Arial, sans-serif" font-size="20" fill="#292929">From APP02 open the UNC path using an explicitly authorized source account and copy</text><text x="96" y="603" font-family="Arial, sans-serif" font-size="20" fill="#292929">index.html into C:\inetpub\wwwroot.</text><path d="M60 641v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="657" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="687" r="18" fill="#292929"/><text x="54" y="694" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="691" font-family="Arial, sans-serif" font-size="20" fill="#292929">Remove the temporary share and credential mapping afterward.</text><text x="44" y="746" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="784" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="814" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="846" font-family="Arial, sans-serif" font-size="19" fill="#292929">The site file exists on APP02 and matches the source SHA-256 hash.</text><text x="30" y="941" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>