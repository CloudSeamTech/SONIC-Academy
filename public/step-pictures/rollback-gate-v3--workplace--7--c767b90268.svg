<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1068" viewBox="0 0 1200 1068" role="img" aria-labelledby="title desc"><title id="title">At work: inspect one existing VMware backup job — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1068" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">At work: inspect one existing VMware backup job</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Veeam Backup &amp; Replication · Veeam PowerShell session</text><rect x="28" y="253" width="1144" height="274" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">$SonicJobName = Read-Host &quot;Exact approved VMware backup job name&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">$SonicJobs = @(Get-VBRJob | Where-Object { $_.Name -eq $SonicJobName })</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">if ($SonicJobs.Count -ne 1) { throw &quot;Expected exactly one job: stop&quot; }</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">$SonicJob = $SonicJobs[0]</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#18334e">$SonicJob | Format-List Name, JobType</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#18334e">Get-VBRBackupSession | Sort-Object CreationTime -Descending | Select-Object -First 10</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#18334e">JobName, CreationTime, EndTime, State, Result</text><text x="44" y="551" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="583" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="613" r="18" fill="#18334e"/><text x="54" y="620" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="617" font-family="Arial, sans-serif" font-size="20" fill="#18334e">This example targets an existing VMware VM backup job, not a Veeam Agent policy.</text><path d="M60 656v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="672" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="702" r="18" fill="#18334e"/><text x="54" y="709" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="706" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Verify these cmdlets in your installed version first.</text><path d="M60 745v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="761" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="791" r="18" fill="#18334e"/><text x="54" y="798" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="795" font-family="Arial, sans-serif" font-size="20" fill="#18334e">In the console select Home → Jobs → Backup and copy the exact approved job name.</text><text x="44" y="850" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="888" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="918" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="950" font-family="Arial, sans-serif" font-size="19" fill="#18334e">One reviewed job is selected and its VM membership and recent task results are understood.</text><text x="30" y="1045" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>