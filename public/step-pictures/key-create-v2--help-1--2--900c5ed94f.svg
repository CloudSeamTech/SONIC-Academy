<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1153" viewBox="0 0 1200 1153" role="img" aria-labelledby="title desc"><title id="title">Find your Windows account, computer name and exact key file — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1153" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Find your Windows account, computer name and exact key file</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your own Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="301" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">whoami</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">$env:COMPUTERNAME</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">$SonicUserSid = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">$SonicUserSid</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#18334e">$SonicKey = Read-Host &quot;Full path to your existing private key&quot;</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#18334e">if (-not (Test-Path -LiteralPath $SonicKey -PathType Leaf)) { throw &quot;File not found:</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#18334e">stop&quot; }</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#18334e">$SonicKey = (Resolve-Path -LiteralPath $SonicKey).Path</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="610" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="640" r="18" fill="#18334e"/><text x="54" y="647" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="644" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Run whoami to see the signed-in Windows account. $env:COMPUTERNAME shows the computer’s</text><text x="96" y="674" font-family="Arial, sans-serif" font-size="20" fill="#18334e">name, not the processor model.</text><path d="M60 712v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="728" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="758" r="18" fill="#18334e"/><text x="54" y="765" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="762" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Windows uses a SID, a stable account number, to identify the account even if its display</text><text x="96" y="792" font-family="Arial, sans-serif" font-size="20" fill="#18334e">name changes.</text><path d="M60 830v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="846" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="876" r="18" fill="#18334e"/><text x="54" y="883" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="880" font-family="Arial, sans-serif" font-size="20" fill="#18334e">At the path prompt, enter the full path to the private key you already use.</text><text x="44" y="935" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="973" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="1003" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1035" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The Windows account and key path are correct. No permission has changed.</text><text x="30" y="1130" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>