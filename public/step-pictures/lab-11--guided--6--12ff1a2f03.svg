<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="551" viewBox="0 0 1200 551" role="img" aria-labelledby="title desc"><title id="title">Test the destination name lookup — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="551" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Test the destination name lookup</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">APP01 · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Run nslookup migrate.lab.example.test 10.50.0.40 and the destination AD SRV record check</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#18334e">from Lesson 9.</text><rect x="28" y="371" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="401" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="433" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The new domain and its service records resolve through the destination DNS server.</text><text x="30" y="528" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>