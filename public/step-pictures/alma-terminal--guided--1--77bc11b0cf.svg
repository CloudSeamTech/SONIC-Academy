<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="889" viewBox="0 0 1200 889" role="img" aria-labelledby="title desc"><title id="title">Know where you are — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="889" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Know where you are</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">AlmaLinux VM · GNOME Terminal</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">whoami</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">hostname</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">pwd</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">ls -lah</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="502" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="532" r="18" fill="#292929"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#292929">Open Terminal and check your identity and location.</text><path d="M60 575v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="591" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="621" r="18" fill="#292929"/><text x="54" y="628" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="625" font-family="Arial, sans-serif" font-size="20" fill="#292929">Read each command and output before moving on. ~ means your home directory, not the whole</text><text x="96" y="655" font-family="Arial, sans-serif" font-size="20" fill="#292929">filesystem.</text><rect x="28" y="709" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="739" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="771" font-family="Arial, sans-serif" font-size="19" fill="#292929">You recognize your own username, host and home path.</text><text x="30" y="866" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>