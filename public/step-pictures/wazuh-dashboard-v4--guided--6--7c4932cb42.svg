<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1042" viewBox="0 0 1200 1042" role="img" aria-labelledby="title desc"><title id="title">If required, allow the workstation in the active zone — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1042" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">If required, allow the workstation in the active zone</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">read -r -p &quot;Active zone: &quot; SONIC_ZONE</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">read -r -p &quot;Workstation public IPv4/32: &quot; SONIC_SOURCE</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">SONIC_RULE=&quot;rule family=ipv4 source address=$SONIC_SOURCE port port=443 protocol=tcp</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">accept&quot;</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">sudo firewall-cmd --zone=&quot;$SONIC_ZONE&quot; --add-rich-rule=&quot;$SONIC_RULE&quot;</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="529" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="559" r="18" fill="#292929"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#292929">Only use this card when firewalld is active and the earlier check showed the rule missing.</text><path d="M60 602v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="618" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="648" r="18" fill="#292929"/><text x="54" y="655" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="652" font-family="Arial, sans-serif" font-size="20" fill="#292929">Enter the exact zone and workstation /32 at the prompts.</text><path d="M60 691v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="707" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="737" r="18" fill="#292929"/><text x="54" y="744" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="741" font-family="Arial, sans-serif" font-size="20" fill="#292929">The rich rule accepts IPv4 TCP 443 from that source.</text><text x="44" y="796" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="834" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="864" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="896" font-family="Arial, sans-serif" font-size="19" fill="#292929">The runtime rule is added. Test the browser and save it only at the later persistence</text><text x="52" y="925" font-family="Arial, sans-serif" font-size="19" fill="#292929">checkpoint.</text><text x="30" y="1019" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>