<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="787" viewBox="0 0 1200 787" role="img" aria-labelledby="title desc"><title id="title">Optional: prepare a NEW empty practice disk — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="787" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Optional: prepare a NEW empty practice disk</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">AlmaLinux VM · GNOME Disks</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Skip this step for any drive containing data.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">On a separate practice blank virtual disk, reconfirm identity in Disks, use its menu →</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#292929">Format Disk → GPT if a partition table is needed, then the + button → Create Partition →</text><text x="96" y="436" font-family="Arial, sans-serif" font-size="20" fill="#292929">choose ext4 for Linux-only practice and a label such as PracticeData.</text><path d="M60 473v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="489" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="519" r="18" fill="#292929"/><text x="54" y="526" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="523" font-family="Arial, sans-serif" font-size="20" fill="#292929">Formatting ERASES selected content; review the device and deletion prompts before</text><text x="96" y="553" font-family="Arial, sans-serif" font-size="20" fill="#292929">confirming.</text><rect x="28" y="607" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="637" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="669" font-family="Arial, sans-serif" font-size="19" fill="#292929">Only the explicitly empty practice disk has the new Linux filesystem.</text><text x="30" y="764" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>