<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="987" viewBox="0 0 1200 987" role="img" aria-labelledby="title desc"><title id="title">Create the harmless baseline file — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="987" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Create the harmless baseline file</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">printf &quot;%s\n&quot; &quot;$HOME&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">mkdir -p ~/sonic-fim</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">printf &quot;baseline\n&quot; &gt; ~/sonic-fim/probe.txt</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">cat ~/sonic-fim/probe.txt</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="502" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="532" r="18" fill="#18334e"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#18334e">printf writes only the lab probe file; &gt; replaces its contents.</text><path d="M60 575v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="591" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="621" r="18" fill="#18334e"/><text x="54" y="628" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="625" font-family="Arial, sans-serif" font-size="20" fill="#18334e">If the file already contains evidence you need, save it before this reset.</text><path d="M60 664v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="680" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="710" r="18" fill="#18334e"/><text x="54" y="717" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="714" font-family="Arial, sans-serif" font-size="20" fill="#18334e">The directory must exist before the agent restarts.</text><text x="44" y="769" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="807" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="837" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="869" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The dedicated directory exists and probe.txt contains baseline.</text><text x="30" y="964" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>