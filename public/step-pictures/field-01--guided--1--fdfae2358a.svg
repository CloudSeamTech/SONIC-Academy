<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="579" viewBox="0 0 1200 579" role="img" aria-labelledby="title desc"><title id="title">Identify the project owner — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="579" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Identify the project owner</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows host · lab notes and browser</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Which agency is moving, which Azure tenant/subscription/cloud is the approved target, and</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">what is the target boundary?</text><rect x="28" y="371" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="401" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="433" font-family="Arial, sans-serif" font-size="19" fill="#292929">Your handover notes name the moving organization, destination subscription/tenant and person</text><text x="52" y="462" font-family="Arial, sans-serif" font-size="19" fill="#292929">responsible for the boundary.</text><text x="30" y="556" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>