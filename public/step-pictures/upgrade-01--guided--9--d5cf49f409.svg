<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="837" viewBox="0 0 1200 837" role="img" aria-labelledby="title desc"><title id="title">Start the in-place upgrade — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="837" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 9 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Start the in-place upgrade</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">APP02 · Azure Windows Server · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">.\setup.exe /auto upgrade /dynamicupdate disable</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="421" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="451" r="18" fill="#18334e"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#18334e">From the media folder in Windows PowerShell opened with Run as administrator INSIDE APP02</text><text x="96" y="485" font-family="Arial, sans-serif" font-size="20" fill="#18334e">run the command below.</text><path d="M60 523v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="539" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="569" r="18" fill="#18334e"/><text x="54" y="576" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="573" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Review and accept licensing only if authorized; select the supported Server 2022 edition</text><text x="96" y="603" font-family="Arial, sans-serif" font-size="20" fill="#18334e">matching the installed Desktop Experience configuration when asked.</text><rect x="28" y="657" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="687" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="719" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Windows Setup starts an upgrade that preserves applications/settings and targets Server 2022.</text><text x="30" y="814" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>