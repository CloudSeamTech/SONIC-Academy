<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608" viewBox="0 0 1200 608" role="img" aria-labelledby="title desc"><title id="title">Limit synchronization scope — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="608" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Limit synchronization scope</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">MECM01 · Windows Server desktop</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Use Administration &gt; Site Configuration &gt; Sites &gt; Configure Site Components &gt; Software</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">Update Point to choose narrow products/classifications, for example a limited Windows</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#292929">category, and a safe sync schedule.</text><rect x="28" y="400" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="430" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="462" font-family="Arial, sans-serif" font-size="19" fill="#292929">The update-point settings include only the chosen products, classifications and languages for</text><text x="52" y="491" font-family="Arial, sans-serif" font-size="19" fill="#292929">the pilot.</text><text x="30" y="585" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>