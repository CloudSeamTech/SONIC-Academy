<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="981" viewBox="0 0 1200 981" role="img" aria-labelledby="title desc"><title id="title">Check service state and listeners — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="981" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check service state and listeners</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">sudo systemctl status wazuh-manager wazuh-indexer wazuh-dashboard filebeat --no-pager</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">sudo ss -lntp</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="448" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="478" r="18" fill="#292929"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#292929">status reports runtime state; --no-pager avoids interactive scrolling. ss -lntp lists</text><text x="96" y="512" font-family="Arial, sans-serif" font-size="20" fill="#292929">listening TCP sockets with numeric addresses and owning processes.</text><path d="M60 550v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="566" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="596" r="18" fill="#292929"/><text x="54" y="603" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="600" font-family="Arial, sans-serif" font-size="20" fill="#292929">If a unit fails, run sudo journalctl -u followed by that exact unit name and --since &quot;10</text><text x="96" y="630" font-family="Arial, sans-serif" font-size="20" fill="#292929">minutes ago&quot; --no-pager.</text><path d="M60 668v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="684" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="714" r="18" fill="#292929"/><text x="54" y="721" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="718" font-family="Arial, sans-serif" font-size="20" fill="#292929">Read the earliest relevant error before changing network rules.</text><rect x="28" y="773" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="803" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="835" font-family="Arial, sans-serif" font-size="19" fill="#292929">Expected services are active and the dashboard is listening on its configured HTTPS port,</text><text x="52" y="864" font-family="Arial, sans-serif" font-size="19" fill="#292929">normally 443.</text><text x="30" y="958" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>