<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" role="img" aria-labelledby="title desc"><title id="title">If a permission edit goes wrong, restore the saved access list — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="988" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 8 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">If a permission edit goes wrong, restore the saved access list</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your own Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">icacls &quot;$SonicKeyFolder&quot; /restore &quot;$SonicAclBackup&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">if ($LASTEXITCODE -ne 0) { throw &quot;Restore failed: ask the Windows administrator&quot; }</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">icacls &quot;$SonicKey&quot;</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="505" r="18" fill="#18334e"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#18334e">This is a recovery branch, not a routine step after a successful repair.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="564" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="594" r="18" fill="#18334e"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Use the exact same parent folder and saved ACL file.</text><path d="M60 637v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="653" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="683" r="18" fill="#18334e"/><text x="54" y="690" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="687" font-family="Arial, sans-serif" font-size="20" fill="#18334e">If you reopened PowerShell, enter their recorded paths again first.</text><text x="44" y="742" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="780" width="1144" height="116" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="810" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="842" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The saved access list is restored, or the exact restore error is recorded for the</text><text x="52" y="871" font-family="Arial, sans-serif" font-size="19" fill="#18334e">administrator.</text><text x="30" y="965" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>