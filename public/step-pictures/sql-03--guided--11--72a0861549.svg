<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="669" viewBox="0 0 1200 669" role="img" aria-labelledby="title desc"><title id="title">Scope the Windows firewall rule — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="669" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 11 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Scope the Windows firewall rule</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">SQL01 · Windows Defender Firewall with Advanced Security</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">On SQL01 open Windows Defender Firewall with Advanced Security &gt; Inbound Rules &gt; New Rule &gt;</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">Port &gt; TCP &gt; Specific local ports 1433 &gt; Allow the connection.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="371" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#292929"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#292929">Use the Domain profile, name the rule, then Properties &gt; Scope and limit remote addresses</text><text x="96" y="435" font-family="Arial, sans-serif" font-size="20" fill="#292929">to the recorded MECM01/authorized private admin IPs.</text><rect x="28" y="489" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="519" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="551" font-family="Arial, sans-serif" font-size="19" fill="#292929">The SQL rule is private, scoped, and documented.</text><text x="30" y="646" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>