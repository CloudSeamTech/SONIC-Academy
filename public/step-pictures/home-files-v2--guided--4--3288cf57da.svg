<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="823" viewBox="0 0 1200 823" role="img" aria-labelledby="title desc"><title id="title">Check the result and save your notes — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="823" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check the result and save your notes</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL 9 · Bash · rexuser</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Compare the authorized fingerprint to the public-account-key fingerprint recorded on</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">Windows, not to the server-host fingerprint.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="371" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#292929"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#292929">Confirm the home belongs to rexuser.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="460" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="490" r="18" fill="#292929"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#292929">Record unexpected additional keys for owner review.</text><text x="44" y="549" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="587" width="1144" height="144" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="617" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="649" font-family="Arial, sans-serif" font-size="19" fill="#292929">The current path, a long home-directory listing, and the fingerprint of the public key Azure</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#292929">authorized for rexuser. If multiple keys are intentionally authorized, multiple entries may</text><text x="52" y="707" font-family="Arial, sans-serif" font-size="19" fill="#292929">appear.</text><text x="30" y="800" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>