<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="729" viewBox="0 0 1200 729" role="img" aria-labelledby="title desc"><title id="title">Create the Azure member-server target — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="729" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Create the Azure member-server target</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your Windows host · Azure portal in a browser</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">In Azure portal search Virtual machines &gt; Create &gt; Azure virtual machine.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="342" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="372" r="18" fill="#18334e"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Choose the practice lab resource group/region, name APP02, and explicitly select a Windows</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Server 2019 Datacenter Marketplace image.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="460" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="490" r="18" fill="#18334e"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Do not choose Server 2022 yet.</text><rect x="28" y="549" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="579" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="611" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The review page identifies APP02 and a 2019 image.</text><text x="30" y="706" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>