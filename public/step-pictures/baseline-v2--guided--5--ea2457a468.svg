<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" role="img" aria-labelledby="title desc"><title id="title">Check the result and save your notes — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="786" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check the result and save your notes</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL 9 · Bash · rexuser</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Append actual values with date/time to the change record.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">Record the Azure resource inventory, verified host/account fingerprints, RHEL</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#292929">release/kernel, IP/route, and sudo scope.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="460" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="490" r="18" fill="#292929"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#292929">The future workflow is obtain installer → transfer → inspect → install → identify/verify</text><text x="96" y="524" font-family="Arial, sans-serif" font-size="20" fill="#292929">service → verify network → inspect logs → troubleshoot → confirm centralized check-in.</text><rect x="28" y="578" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="608" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="19" fill="#292929">sshd active, normally SELinux Enforcing, a root-space report, and successful sudo validation if</text><text x="52" y="669" font-family="Arial, sans-serif" font-size="19" fill="#292929">the provisioned policy permits it. Record deviations honestly.</text><text x="30" y="763" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>