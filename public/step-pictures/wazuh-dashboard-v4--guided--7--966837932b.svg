<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1018" viewBox="0 0 1200 1018" role="img" aria-labelledby="title desc"><title id="title">Compare the dashboard certificate — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1018" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Compare the dashboard certificate</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">sudo grep -n &quot;server.ssl.certificate&quot; /etc/wazuh-dashboard/opensearch_dashboards.yml</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">read -r -p &quot;Configured certificate path: &quot; SONIC_CERT</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">sudo openssl x509 -in &quot;$SONIC_CERT&quot; -noout -fingerprint -sha256</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="505" r="18" fill="#292929"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#292929">Read the configured server.ssl.certificate path.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="564" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="594" r="18" fill="#292929"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#292929">At the prompt paste that path without its YAML quote characters. openssl x509 reads that</text><text x="96" y="628" font-family="Arial, sans-serif" font-size="20" fill="#292929">certificate; -noout omits certificate content and -fingerprint -sha256 prints its SHA-256</text><text x="96" y="658" font-family="Arial, sans-serif" font-size="20" fill="#292929">identity.</text><path d="M60 695v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="711" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="741" r="18" fill="#292929"/><text x="54" y="748" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="745" font-family="Arial, sans-serif" font-size="20" fill="#292929">In Windows, open https:// plus the manager public IP.</text><text x="44" y="800" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="838" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="868" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="900" font-family="Arial, sans-serif" font-size="19" fill="#292929">The browser certificate matches the certificate configured on this manager.</text><text x="30" y="995" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>