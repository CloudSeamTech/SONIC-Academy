<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="853" viewBox="0 0 1200 853" role="img" aria-labelledby="title desc"><title id="title">Website step 5 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="853" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 8 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Website step 5</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows computer · browser → https://portal.azure.com</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Plan agent uninstall and manager-side de-registration as distinct actions.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">Package removal may leave config, logs, enrollment keys, repository files, or systemd</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#292929">overrides.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="460" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="490" r="18" fill="#292929"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#292929">Inspect transaction effects, preserve evidence, remove only documented lab-owned residue,</text><text x="96" y="524" font-family="Arial, sans-serif" font-size="20" fill="#292929">and validate SSH, failed units, disk/mount health, networking, and expected application</text><text x="96" y="554" font-family="Arial, sans-serif" font-size="20" fill="#292929">state after rollback.</text><text x="44" y="607" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="645" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="675" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="707" font-family="Arial, sans-serif" font-size="19" fill="#292929">Check the named resource and settings before the next step. If the page shows an error, stop</text><text x="52" y="736" font-family="Arial, sans-serif" font-size="19" fill="#292929">and read it before continuing.</text><text x="30" y="830" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>