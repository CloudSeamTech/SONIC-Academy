<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="997" viewBox="0 0 1200 997" role="img" aria-labelledby="title desc"><title id="title">Check the database objects — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="997" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check the database objects</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">SQL01 · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="301" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">CREATE DATABASE AgencyHelpdesk;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">GO</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">USE AgencyHelpdesk;</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">GO</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">CREATE TABLE dbo.Tickets (</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">TicketID INT PRIMARY KEY,</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">Summary NVARCHAR(100) NOT NULL,</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#292929">Status NVARCHAR(20) NOT NULL</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="610" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="640" r="18" fill="#292929"/><text x="54" y="647" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="644" font-family="Arial, sans-serif" font-size="20" fill="#292929">Use the named shell and machine above.</text><path d="M60 683v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="699" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="729" r="18" fill="#292929"/><text x="54" y="736" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="733" font-family="Arial, sans-serif" font-size="20" fill="#292929">Read each command against the full lesson reference; run these lines only after completing</text><text x="96" y="763" font-family="Arial, sans-serif" font-size="20" fill="#292929">the preceding actions.</text><rect x="28" y="817" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="847" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="879" font-family="Arial, sans-serif" font-size="19" fill="#292929">The practice database and its Tickets table appear on the intended instance.</text><text x="30" y="974" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>