<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="796" viewBox="0 0 1200 796" role="img" aria-labelledby="title desc"><title id="title">Complete the change record — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="796" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Complete the change record</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Windows workstation · lab notes</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Create these headings: Scope; Hosts; Versions and artifact trust; Configuration changes;</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">Successful event evidence; Fault and root cause; Recovery branch; Final state; Exceptions;</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#292929">Retention and costs.</text><path d="M60 384v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="400" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="430" r="18" fill="#292929"/><text x="54" y="437" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="434" font-family="Arial, sans-serif" font-size="20" fill="#292929">Under each heading paste your redacted observations from the earlier lessons.</text><path d="M60 473v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="489" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="519" r="18" fill="#292929"/><text x="54" y="526" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="523" font-family="Arial, sans-serif" font-size="20" fill="#292929">Include actual timestamps and resource/agent IDs.</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="616" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="646" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#292929">Each acceptance result has evidence and the final monitoring state is explicit.</text><text x="30" y="773" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>