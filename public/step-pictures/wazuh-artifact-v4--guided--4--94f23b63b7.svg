<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="889" viewBox="0 0 1200 889" role="img" aria-labelledby="title desc"><title id="title">Prepare the destination directory — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="889" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Prepare the destination directory</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">hostname</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">umask 077</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">mkdir -p ~/sonic-wazuh</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">cd ~/sonic-wazuh</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="502" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="532" r="18" fill="#18334e"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#18334e">In the already verified endpoint SSH session, confirm hostname and create the staging</text><text x="96" y="566" font-family="Arial, sans-serif" font-size="20" fill="#18334e">directory. umask 077 restricts newly created files and directories to your account.</text><path d="M60 604v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="620" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="650" r="18" fill="#18334e"/><text x="54" y="657" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="654" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Do not use the manager session.</text><rect x="28" y="709" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="739" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="771" font-family="Arial, sans-serif" font-size="19" fill="#18334e">/home/rexuser/sonic-wazuh exists on the endpoint.</text><text x="30" y="866" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>