<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1234" viewBox="0 0 1200 1234" role="img" aria-labelledby="title desc"><title id="title">Create the Server 2022 upgrade media disk — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1234" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Create the Server 2022 upgrade media disk</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows host · Windows PowerShell with the Az module</text><rect x="28" y="253" width="1144" height="382" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">$rg = Read-Host &apos;APP02 resource group&apos;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">$vmName = &apos;APP02&apos;</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">$vm = Get-AzVM -ResourceGroupName $rg -Name $vmName -ErrorAction Stop</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">$location = $vm.Location</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">$zone = if ($vm.Zones) { $vm.Zones[0] } else { &apos;&apos; }</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">$images = @(Get-AzVMImage -Location $location -PublisherName MicrosoftWindowsServer</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">-Offer WindowsServerUpgrade -Skus server2022Upgrade | Sort-Object { [version]$_.Version</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#292929">} -Descending)</text><text x="54" y="552" font-family="monospace" font-size="18" fill="#292929">if ($images.Count -eq 0) { throw &apos;No Server 2022 upgrade image available here.&apos; }</text><text x="54" y="580" font-family="monospace" font-size="18" fill="#292929">$image = Get-AzVMImage -Location $location -PublisherName MicrosoftWindowsServer -Offer</text><text x="54" y="608" font-family="monospace" font-size="18" fill="#292929">WindowsServerUpgrade -Skus server2022Upgrade -Version $images[0].Version</text><text x="44" y="659" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="691" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="721" r="18" fill="#292929"/><text x="54" y="728" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="725" font-family="Arial, sans-serif" font-size="20" fill="#292929">In the same Az PowerShell session, use the command below.</text><path d="M60 764v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="780" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="810" r="18" fill="#292929"/><text x="54" y="817" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="814" font-family="Arial, sans-serif" font-size="20" fill="#292929">Enter the ACTUAL existing VM resource group, region and matching zone; leave zone empty for</text><text x="96" y="844" font-family="Arial, sans-serif" font-size="20" fill="#292929">a regional VM.</text><path d="M60 882v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="898" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="928" r="18" fill="#292929"/><text x="54" y="935" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="932" font-family="Arial, sans-serif" font-size="20" fill="#292929">The script creates a billable managed disk from Microsoft’s hidden upgrade-media image and</text><text x="96" y="962" font-family="Arial, sans-serif" font-size="20" fill="#292929">stops if APP02 or its placement does not match.</text><text x="44" y="1016" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="1054" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="1084" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1116" font-family="Arial, sans-serif" font-size="19" fill="#292929">A managed disk named SONIC-Server2022-Upgrade is returned in APP02’s region and zone.</text><text x="30" y="1211" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>