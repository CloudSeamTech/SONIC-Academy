<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="897" viewBox="0 0 1200 897" role="img" aria-labelledby="title desc"><title id="title">Verify the downloaded ISO — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="897" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Verify the downloaded ISO</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows host · Windows PowerShell</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">Get-FileHash -Algorithm SHA256 &quot;C:\Downloads\AlmaLinux-9-latest-x86_64-dvd.iso&quot;</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="421" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="451" r="18" fill="#292929"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#292929">Download the DVD ISO and CHECKSUM from almalinux.org using official mirror links.</text><path d="M60 494v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="510" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="540" r="18" fill="#292929"/><text x="54" y="547" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="544" font-family="Arial, sans-serif" font-size="20" fill="#292929">In Windows PowerShell compute its SHA-256 and compare with the exact filename in CHECKSUM;</text><text x="96" y="574" font-family="Arial, sans-serif" font-size="20" fill="#292929">check official signature guidance when available.</text><path d="M60 612v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="628" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="658" r="18" fill="#292929"/><text x="54" y="665" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="662" font-family="Arial, sans-serif" font-size="20" fill="#292929">Replace the example ISO path in the command with the exact file you downloaded.</text><rect x="28" y="717" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="747" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="779" font-family="Arial, sans-serif" font-size="19" fill="#292929">The complete SHA-256 matches the official checksum for your downloaded ISO.</text><text x="30" y="874" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>