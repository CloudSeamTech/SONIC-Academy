<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="758" viewBox="0 0 1200 758" role="img" aria-labelledby="title desc"><title id="title">Enable private TCP access only when needed — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="758" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 10 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Enable private TCP access only when needed</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">SQL01 · SQL Server Configuration Manager</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Open SQL Server Configuration Manager &gt; SQL Server Network Configuration &gt; Protocols for</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#18334e">MSSQLSERVER.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="371" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="401" r="18" fill="#18334e"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Enable TCP/IP.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="460" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="490" r="18" fill="#18334e"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#18334e">In TCP/IP Properties &gt; IP Addresses &gt; IPAll clear dynamic ports and set TCP Port 1433 for</text><text x="96" y="524" font-family="Arial, sans-serif" font-size="20" fill="#18334e">this lab; restart SQL Server through Configuration Manager.</text><rect x="28" y="578" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="608" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The engine is listening on the planned fixed port after restart.</text><text x="30" y="735" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>