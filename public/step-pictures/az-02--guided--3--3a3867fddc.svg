<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="title desc"><title id="title">Document full-VM prerequisites separately — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="726" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Document full-VM prerequisites separately</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your Windows host · lab notes and browser</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">For a true rehost, record supported source OS/license, disk conversion/boot generation,</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#18334e">guest drivers/agent readiness, replication or VHD import method, private connectivity,</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#18334e">testing, and rollback.</text><path d="M60 384v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="400" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="430" r="18" fill="#18334e"/><text x="54" y="437" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="434" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Use the official Azure Migrate physical/agent-based and VMware support references; exact</text><text x="96" y="464" font-family="Arial, sans-serif" font-size="20" fill="#18334e">support must be checked for your configuration.</text><rect x="28" y="518" width="1144" height="116" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="548" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="580" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Any full-VM move has an approved, documented method before resources or replication are</text><text x="52" y="609" font-family="Arial, sans-serif" font-size="19" fill="#18334e">created.</text><text x="30" y="703" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>