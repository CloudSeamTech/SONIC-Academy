<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1124" viewBox="0 0 1200 1124" role="img" aria-labelledby="title desc"><title id="title">Validate the restored guest against its baseline — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1124" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Validate the restored guest against its baseline</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="301" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">whoami</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">hostname</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">cat /etc/redhat-release</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">rpm -q wazuh-agent</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#18334e">systemctl --failed --no-pager</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#18334e">findmnt</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#18334e">df -h</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#18334e">ip route</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="610" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="640" r="18" fill="#18334e"/><text x="54" y="647" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="644" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Check account/host first.</text><path d="M60 683v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="699" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="729" r="18" fill="#18334e"/><text x="54" y="736" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="733" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Compare failed units, mounts, capacity, routes and SELinux with the saved pre-change</text><text x="96" y="763" font-family="Arial, sans-serif" font-size="20" fill="#18334e">values.</text><path d="M60 801v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="817" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="847" r="18" fill="#18334e"/><text x="54" y="854" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="851" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Missing Wazuh is expected for this pre-agent rollback, not a new fault.</text><text x="44" y="906" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="944" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="974" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1006" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The baseline comparisons and central registration disposition are documented.</text><text x="30" y="1101" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>