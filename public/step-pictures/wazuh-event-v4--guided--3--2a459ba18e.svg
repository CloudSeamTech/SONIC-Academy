<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="864" viewBox="0 0 1200 864" role="img" aria-labelledby="title desc"><title id="title">Back up the configuration — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="864" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Back up the configuration</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">sudo cp -an /var/ossec/etc/ossec.conf /var/ossec/etc/ossec.conf.sonic-before-fim</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">sudo ls -l /var/ossec/etc/ossec.conf.sonic-before-fim</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="448" width="1144" height="125" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="478" r="18" fill="#18334e"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#18334e">cp -a preserves metadata and -n refuses to replace an existing checkpoint. ls -l shows the</text><text x="96" y="512" font-family="Arial, sans-serif" font-size="20" fill="#18334e">checkpoint; if it already existed, compare its date and content with the intended pre-FIM</text><text x="96" y="542" font-family="Arial, sans-serif" font-size="20" fill="#18334e">baseline.</text><path d="M60 579v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="595" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="625" r="18" fill="#18334e"/><text x="54" y="632" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="629" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Stop if stale; preserve it under another reviewed name before taking a new checkpoint.</text><rect x="28" y="684" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="714" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="746" font-family="Arial, sans-serif" font-size="19" fill="#18334e">A known pre-FIM configuration copy is retained with restricted permissions.</text><text x="30" y="841" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>