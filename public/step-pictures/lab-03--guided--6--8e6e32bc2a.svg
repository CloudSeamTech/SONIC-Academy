<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="794" viewBox="0 0 1200 794" role="img" aria-labelledby="title desc"><title id="title">Connect the guests to VMnet2 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="794" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Connect the guests to VMnet2</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows host · VMware Workstation Pro</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">When each guest VM exists and is powered off, select it &gt; VM &gt; Settings &gt; Network Adapter.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">Choose Custom: Specific virtual network &gt; VMnet2 and enable Connect at power on.</text><path d="M60 415v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="431" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="461" r="18" fill="#292929"/><text x="54" y="468" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="465" font-family="Arial, sans-serif" font-size="20" fill="#292929">Keep one network adapter.</text><text x="44" y="520" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="558" width="1144" height="144" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="588" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="620" font-family="Arial, sans-serif" font-size="19" fill="#292929">Both guest adapters use the same VMnet2. After their static-address lessons, their live</text><text x="52" y="649" font-family="Arial, sans-serif" font-size="19" fill="#292929">consoles show DC01 10.50.0.10/24 and DC02 10.50.0.11/24. The DC02 Windows lesson proves replies</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#292929">in both directions before promotion.</text><text x="30" y="771" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>