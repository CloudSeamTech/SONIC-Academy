<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1046" viewBox="0 0 1200 1046" role="img" aria-labelledby="title desc"><title id="title">Reconnect using your existing private key — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1046" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Reconnect using your existing private key</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Windows workstation · PowerShell</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">$SonicKey = Read-Host &quot;Full path to your existing SSH private key&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">$SonicHost = Read-Host &quot;Recorded VM public IP&quot;</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">ssh -i &quot;$SonicKey&quot; &quot;rexuser@$SonicHost&quot;</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="505" r="18" fill="#18334e"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Open Windows Terminal → the dropdown beside + → Windows PowerShell.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="564" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="594" r="18" fill="#18334e"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#18334e">At the first prompt paste the full path of your existing private key, without adding quote</text><text x="96" y="628" font-family="Arial, sans-serif" font-size="20" fill="#18334e">characters; at the second paste the manager public IP you just recorded.</text><path d="M60 666v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="682" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="712" r="18" fill="#18334e"/><text x="54" y="719" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="716" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Read-Host collects your values; $SonicKey and $SonicHost store them for this tab. ssh -i</text><text x="96" y="746" font-family="Arial, sans-serif" font-size="20" fill="#18334e">selects the private key, and rexuser@ identifies the remote account.</text><text x="44" y="800" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="838" width="1144" height="116" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="868" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="900" font-family="Arial, sans-serif" font-size="19" fill="#18334e">A Bash prompt opens on the manager. Keep this tab; open a second PowerShell tab and repeat with</text><text x="52" y="929" font-family="Arial, sans-serif" font-size="19" fill="#18334e">the endpoint public IP.</text><text x="30" y="1023" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>