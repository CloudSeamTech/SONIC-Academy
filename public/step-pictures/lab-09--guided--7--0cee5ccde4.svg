<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="887" viewBox="0 0 1200 887" role="img" aria-labelledby="title desc"><title id="title">Run the reference check 1 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="887" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Run the reference check 1</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AG-DC01 and DEST-DC01 / DNS Manager / authorized administrator in each separate</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">forest.</text><rect x="28" y="277" width="1144" height="139" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">nslookup -type=SRV _ldap._tcp.dc._msdcs.migrate.lab.example.test 192.168.77.10</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">nslookup -type=SRV _ldap._tcp.dc._msdcs.lab.example.test 192.168.77.40</text><text x="44" y="440" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="472" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="502" r="18" fill="#21c5db"/><text x="54" y="509" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="506" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use the named shell and machine above.</text><path d="M60 545v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="561" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="591" r="18" fill="#21c5db"/><text x="54" y="598" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="595" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Read each command against the full lesson reference; run these lines only after completing</text><text x="96" y="625" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the preceding actions.</text><rect x="28" y="679" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="709" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="741" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Each query returns an SRV record for the opposite forest; trust is optional, not a prerequisite</text><text x="52" y="770" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">for the rest of the exercises.</text><text x="30" y="864" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>