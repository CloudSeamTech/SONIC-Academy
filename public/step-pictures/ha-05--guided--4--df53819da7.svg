<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="title desc"><title id="title">Record the quorum experiment — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="668" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Record the quorum experiment</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">SQL01 · Windows Server desktop</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">For quorum experiments, record what happens when the witness loses access versus when one</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">node is unavailable.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="371" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#292929"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#292929">Only simulate a disruptive outage when you have a tested recovery plan.</text><rect x="28" y="460" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="490" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="522" font-family="Arial, sans-serif" font-size="19" fill="#292929">Your notes describe the controlled failure, real cluster response and recovery, including why</text><text x="52" y="551" font-family="Arial, sans-serif" font-size="19" fill="#292929">the result occurred.</text><text x="30" y="645" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>