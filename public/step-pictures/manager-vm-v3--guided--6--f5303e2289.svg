<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="868" viewBox="0 0 1200 868" role="img" aria-labelledby="title desc"><title id="title">Command 1: read, type, then check — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="868" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Command 1: read, type, then check</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Windows · PowerShell · after reading Azure inventory</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">$EndpointPublicIp = &quot;REPLACE_WITH_ENDPOINT_PUBLIC_IPV4&quot;</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="421" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="451" r="18" fill="#18334e"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#18334e">This saves a value in the current PowerShell tab.</text><path d="M60 494v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="510" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="540" r="18" fill="#18334e"/><text x="54" y="547" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="544" font-family="Arial, sans-serif" font-size="20" fill="#18334e">It does not create an Azure resource.</text><path d="M60 583v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="599" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="629" r="18" fill="#18334e"/><text x="54" y="636" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="633" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Replace any REPLACE_WITH text with the real value from your notes before running it.</text><rect x="28" y="688" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="718" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="750" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Usually no output appears. The value is now available in this tab.</text><text x="30" y="845" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>