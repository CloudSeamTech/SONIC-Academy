<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1072" viewBox="0 0 1200 1072" role="img" aria-labelledby="title desc"><title id="title">Optionally enable SSH inside the AlmaLinux guest — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1072" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Optionally enable SSH inside the AlmaLinux guest</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">AlmaLinux VM · GNOME Terminal</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">sudo dnf install openssh-server</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">sudo systemctl enable --now sshd</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">ip -br address</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">sudo firewall-cmd --get-active-zones</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">sudo firewall-cmd --list-all</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="529" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="559" r="18" fill="#292929"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#292929">For VMware access use GNOME Terminal to install/start the SSH server and check its address</text><text x="96" y="593" font-family="Arial, sans-serif" font-size="20" fill="#292929">and firewall.</text><path d="M60 631v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="647" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="677" r="18" fill="#292929"/><text x="54" y="684" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="681" font-family="Arial, sans-serif" font-size="20" fill="#292929">If SSH is not already allowed, add the ssh service only to the active connection’s firewall</text><text x="96" y="711" font-family="Arial, sans-serif" font-size="20" fill="#292929">zone after checking it.</text><path d="M60 749v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="765" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="795" r="18" fill="#292929"/><text x="54" y="802" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="799" font-family="Arial, sans-serif" font-size="20" fill="#292929">This opens private-network SSH access; NAT needs no public port-forward.</text><text x="44" y="854" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="892" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="922" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="954" font-family="Arial, sans-serif" font-size="19" fill="#292929">sshd is active and you know the guest’s actual NAT address.</text><text x="30" y="1049" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>