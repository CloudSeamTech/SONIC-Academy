<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1047" viewBox="0 0 1200 1047" role="img" aria-labelledby="title desc"><title id="title">Establish trust in the signing key — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1047" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Establish trust in the signing key</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">curl --fail --show-error --location --output GPG-KEY-WAZUH</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">https://packages.wazuh.com/key/GPG-KEY-WAZUH</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">gpg --show-keys --with-fingerprint ./GPG-KEY-WAZUH</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="475" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="505" r="18" fill="#18334e"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Download the public vendor key. gpg --show-keys --with-fingerprint prints its identity</text><text x="96" y="539" font-family="Arial, sans-serif" font-size="20" fill="#18334e">without importing it into RPM.</text><path d="M60 577v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="593" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="623" r="18" fill="#18334e"/><text x="54" y="630" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="627" font-family="Arial, sans-serif" font-size="20" fill="#18334e">If gpg is missing, use command -v gpg to confirm and have the lab owner approve installing</text><text x="96" y="657" font-family="Arial, sans-serif" font-size="20" fill="#18334e">the RHEL gnupg2 package before continuing.</text><path d="M60 695v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="711" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="741" r="18" fill="#18334e"/><text x="54" y="748" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="745" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Compare the full fingerprint with the vendor key record independently approved by the lab</text><text x="96" y="775" font-family="Arial, sans-serif" font-size="20" fill="#18334e">owner.</text><text x="44" y="829" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="867" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="897" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="929" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Signature and digests verify successfully. NOKEY, BAD or NOT OK means do not install.</text><text x="30" y="1024" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>