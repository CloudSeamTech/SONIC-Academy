<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1074" viewBox="0 0 1200 1074" role="img" aria-labelledby="title desc"><title id="title">Prove the two private servers can talk — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1074" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 21 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Prove the two private servers can talk</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">DC01 · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">hostname</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">ipconfig</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">ping 10.50.0.10</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="505" r="18" fill="#18334e"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Start both VMs on VMnet2.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="564" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="594" r="18" fill="#18334e"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#18334e">On DC01 and DC02 open Windows PowerShell as administrator.</text><path d="M60 637v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="653" width="1144" height="125" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="683" r="18" fill="#18334e"/><text x="54" y="690" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="687" font-family="Arial, sans-serif" font-size="20" fill="#18334e">On each, run New-NetFirewallRule -DisplayName &apos;CloudSeam lab ping&apos; -Direction Inbound</text><text x="96" y="717" font-family="Arial, sans-serif" font-size="20" fill="#18334e">-Protocol ICMPv4 -IcmpType 8 -RemoteAddress 10.50.0.0/24 -Action Allow -Profile Any once to</text><text x="96" y="747" font-family="Arial, sans-serif" font-size="20" fill="#18334e">permit lab-only echo requests.</text><text x="44" y="800" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="838" width="1144" height="144" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="868" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="900" font-family="Arial, sans-serif" font-size="19" fill="#18334e">DC01&apos;s console shows 10.50.0.10 with mask 255.255.255.0 and replies from 10.50.0.11. DC02 shows</text><text x="52" y="929" font-family="Arial, sans-serif" font-size="19" fill="#18334e">10.50.0.11 with the same mask and replies from 10.50.0.10. Both default gateways are blank.</text><text x="52" y="958" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Ping proves reachability, not AD replication.</text><text x="30" y="1051" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>