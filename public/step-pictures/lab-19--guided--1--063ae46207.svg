<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="title desc"><title id="title">Find the failing part before changing settings — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="795" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Find the failing part before changing settings</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your Windows host · lab notes and browser</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Write the exact symptom and time: for example, the help desk does not open.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="342" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="372" r="18" fill="#18334e"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#18334e">On the affected client, open PowerShell and run Resolve-DnsName with your recorded website</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#18334e">name; compare its address with the lab plan.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="460" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="490" r="18" fill="#18334e"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#18334e">If the name is wrong, check the client DNS setting and the private DNS record first.</text><text x="44" y="549" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="587" width="1144" height="116" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="617" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="649" font-family="Arial, sans-serif" font-size="19" fill="#18334e">You have identified whether the failure is name lookup, network access or the application, and</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#18334e">have saved the real error before making a fix.</text><text x="30" y="772" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>