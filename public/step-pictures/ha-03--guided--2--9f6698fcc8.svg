<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="668" viewBox="0 0 1200 668" role="img" aria-labelledby="title desc"><title id="title">Choose a unique witness account name — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="668" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Choose a unique witness account name</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows host · Azure portal in a browser</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Basics: choose your LAB resource group and preferred Azure region.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">Enter a globally unique lowercase account name, for example labwitness12345 (your actual</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#292929">name will differ).</text><rect x="28" y="460" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="490" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="522" font-family="Arial, sans-serif" font-size="19" fill="#292929">Basics shows your practice resource group, region and an available lowercase account name, not</text><text x="52" y="551" font-family="Arial, sans-serif" font-size="19" fill="#292929">the literal placeholder.</text><text x="30" y="645" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>