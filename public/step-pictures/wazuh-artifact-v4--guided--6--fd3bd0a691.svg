<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1043" viewBox="0 0 1200 1043" role="img" aria-labelledby="title desc"><title id="title">Compare the vendor digest and inspect the package — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1043" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Compare the vendor digest and inspect the package</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">cd ~/sonic-wazuh</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">file wazuh-agent.rpm</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">sha512sum wazuh-agent.rpm</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">rpm -qip wazuh-agent.rpm</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#18334e">rpm -qlp wazuh-agent.rpm</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="529" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="559" r="18" fill="#18334e"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Run cd first because a new SSH session may start in your home directory.</text><path d="M60 602v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="618" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="648" r="18" fill="#18334e"/><text x="54" y="655" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="652" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Compare the entire sha512sum value with BOTH the Windows $SonicActual value and the vendor</text><text x="96" y="682" font-family="Arial, sans-serif" font-size="20" fill="#18334e">SHA-512 tab.</text><path d="M60 720v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="736" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="766" r="18" fill="#18334e"/><text x="54" y="773" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="770" font-family="Arial, sans-serif" font-size="20" fill="#18334e">All three must match.</text><text x="44" y="825" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="863" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="893" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="925" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Digest, version, architecture and expected payload agree with your record.</text><text x="30" y="1020" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>