<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="806" viewBox="0 0 1200 806" role="img" aria-labelledby="title desc"><title id="title">Check domain DNS before joining — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="806" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 22 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check domain DNS before joining</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">APP01 · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">Resolve-DnsName lab.example.test</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">Resolve-DnsName -Type SRV _ldap._tcp.dc._msdcs.lab.example.test</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="448" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="478" r="18" fill="#292929"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#292929">In APP01, open Windows PowerShell and run the checks below.</text><path d="M60 521v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="537" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="567" r="18" fill="#292929"/><text x="54" y="574" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="571" font-family="Arial, sans-serif" font-size="20" fill="#292929">Preferred DNS must be a reachable DC for lab.example.test.</text><rect x="28" y="626" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="656" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="688" font-family="Arial, sans-serif" font-size="19" fill="#292929">The domain resolves and the DC’s LDAP SRV records are returned.</text><text x="30" y="783" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>