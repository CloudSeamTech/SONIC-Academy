<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="951" viewBox="0 0 1200 951" role="img" aria-labelledby="title desc"><title id="title">Connect and establish the 2019 baseline — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="951" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Connect and establish the 2019 baseline</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">APP02 · Azure Windows Server · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">hostname</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">DISM /online /Get-CurrentEdition</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="505" r="18" fill="#18334e"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Use your approved VPN/private RDP or budgeted Bastion path to APP02.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="564" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="594" r="18" fill="#18334e"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#18334e">In the guest open Windows PowerShell opened with Run as administrator and confirm the</text><text x="96" y="628" font-family="Arial, sans-serif" font-size="20" fill="#18334e">actual OS.</text><path d="M60 666v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="682" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="712" r="18" fill="#18334e"/><text x="54" y="719" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="716" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Leave Azure guest NIC IP assignment automatic.</text><rect x="28" y="771" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="801" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="833" font-family="Arial, sans-serif" font-size="19" fill="#18334e">APP02 reports Windows Server 2019.</text><text x="30" y="928" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>