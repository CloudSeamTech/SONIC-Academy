<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="611" viewBox="0 0 1200 611" role="img" aria-labelledby="title desc"><title id="title">Test your local recovery sign-in — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="611" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Test your local recovery sign-in</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">APP01 · Windows Server desktop</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Create/verify a local Administrator login on APP01 and test that you know its credentials.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">Keep a working VMware console session.</text><rect x="28" y="431" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="461" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="493" font-family="Arial, sans-serif" font-size="19" fill="#292929">You can sign in with the local APP01 administrator through VMware.</text><text x="30" y="588" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>