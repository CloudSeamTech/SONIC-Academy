<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1154" viewBox="0 0 1200 1154" role="img" aria-labelledby="title desc"><title id="title">Check operating system, capacity and time — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1154" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check operating system, capacity and time</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="274" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">cat /etc/redhat-release</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">uname -m</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">nproc</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">free -h</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">df -h / /var</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">timedatectl</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">systemctl --failed --no-pager</text><text x="44" y="551" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="583" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="613" r="18" fill="#292929"/><text x="54" y="620" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="617" font-family="Arial, sans-serif" font-size="20" fill="#292929">cat reads the release file; uname -m prints architecture; nproc prints available CPU units.</text><path d="M60 656v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="672" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="702" r="18" fill="#292929"/><text x="54" y="709" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="706" font-family="Arial, sans-serif" font-size="20" fill="#292929">Confirm the selected stable release supports this OS and architecture.</text><path d="M60 745v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="761" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="791" r="18" fill="#292929"/><text x="54" y="798" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="795" font-family="Arial, sans-serif" font-size="20" fill="#292929">free -h shows memory in readable units. df -h / /var shows available filesystem space;</text><text x="96" y="825" font-family="Arial, sans-serif" font-size="20" fill="#292929">shared filesystems may appear twice. timedatectl shows clock synchronization. systemctl</text><text x="96" y="855" font-family="Arial, sans-serif" font-size="20" fill="#292929">--failed --no-pager lists failures without opening a pager.</text><text x="44" y="908" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="946" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="976" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1008" font-family="Arial, sans-serif" font-size="19" fill="#292929">RHEL 9, a supported architecture, sufficient resources and synchronized time match the change</text><text x="52" y="1037" font-family="Arial, sans-serif" font-size="19" fill="#292929">record; pre-existing failures are explained.</text><text x="30" y="1131" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>