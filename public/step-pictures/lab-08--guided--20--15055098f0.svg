<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="959" viewBox="0 0 1200 959" role="img" aria-labelledby="title desc"><title id="title">Enter the lab address — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="959" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 20 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Enter the lab address</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Physical host Workstation Pro, then DEST-DC01 Server 2019 guest / local Administrator</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">for a new migrate.lab.example.test forest.</text><rect x="28" y="277" width="1144" height="112" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">ipconfig /all</text><text x="44" y="413" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="445" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="475" r="18" fill="#21c5db"/><text x="54" y="482" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="479" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">For the example LAB 03 network only, choose Use the following IP address: 192.168.77.30;</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">subnet mask 255.255.255.0; gateway = the NAT gateway you recorded in LAB 03.</text><path d="M60 547v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="563" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="593" r="18" fill="#21c5db"/><text x="54" y="600" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="597" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Set preferred DNS to 192.168.77.30.</text><path d="M60 636v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="652" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="682" r="18" fill="#21c5db"/><text x="54" y="689" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="686" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Click OK and Close.</text><text x="44" y="741" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="779" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="809" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="841" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">ipconfig /all shows the chosen private address, gateway, and DNS on the connected adapter.</text><text x="30" y="936" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>