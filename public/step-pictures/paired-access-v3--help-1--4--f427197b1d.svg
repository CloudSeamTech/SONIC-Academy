<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc"><title id="title">Save the current permissions before editing — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1180" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Save the current permissions before editing</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your own Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="328" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">$SonicAclFolder = Join-Path $env:LOCALAPPDATA &quot;SONIC&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">New-Item -ItemType Directory -Path $SonicAclFolder -Force | Out-Null</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">$SonicAclBackup = Join-Path $SonicAclFolder (&quot;key-acl-&quot; + [guid]::NewGuid().ToString() +</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">&quot;.txt&quot;)</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#18334e">$SonicKeyName = [System.IO.Path]::GetFileName($SonicKey)</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#18334e">Push-Location -LiteralPath $SonicKeyFolder</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#18334e">icacls &quot;$SonicKeyName&quot; /save &quot;$SonicAclBackup&quot;</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#18334e">$SonicAclSaved = $LASTEXITCODE</text><text x="54" y="552" font-family="monospace" font-size="18" fill="#18334e">Pop-Location</text><text x="44" y="605" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="637" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="667" r="18" fill="#18334e"/><text x="54" y="674" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="671" font-family="Arial, sans-serif" font-size="20" fill="#18334e">This saves permission information, not the private-key contents.</text><path d="M60 710v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="726" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="756" r="18" fill="#18334e"/><text x="54" y="763" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="760" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Keep the backup path in your local notes. /save saves the file’s access list; it is not a</text><text x="96" y="790" font-family="Arial, sans-serif" font-size="20" fill="#18334e">backup of the key and does not save its owner.</text><path d="M60 828v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="844" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="874" r="18" fill="#18334e"/><text x="54" y="881" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="878" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Push-Location temporarily opens the key’s parent folder so the saved filename can be</text><text x="96" y="908" font-family="Arial, sans-serif" font-size="20" fill="#18334e">restored to the same folder later.</text><text x="44" y="962" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="1000" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="1030" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1062" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The permission backup was saved successfully and its path is recorded.</text><text x="30" y="1157" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>