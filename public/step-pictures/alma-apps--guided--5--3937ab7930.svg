<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="916" viewBox="0 0 1200 916" role="img" aria-labelledby="title desc"><title id="title">Install an app and review permissions — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="916" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Install an app and review permissions</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">AlmaLinux VM · GNOME Terminal</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">flatpak search VLC</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">flatpak remote-info --user flathub org.videolan.VLC</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">flatpak install --user flathub org.videolan.VLC</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#18334e">flatpak info --user --show-permissions org.videolan.VLC</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#18334e">flatpak run org.videolan.VLC</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="529" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="559" r="18" fill="#18334e"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Search for VLC, check the exact Flathub app ID and source, then install the user-scoped</text><text x="96" y="593" font-family="Arial, sans-serif" font-size="20" fill="#18334e">example only if you accept its publisher and permissions.</text><path d="M60 631v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="647" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="677" r="18" fill="#18334e"/><text x="54" y="684" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="681" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Launch from Activities or Terminal.</text><rect x="28" y="736" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="766" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="798" font-family="Arial, sans-serif" font-size="19" fill="#18334e">VLC starts and opens a non-sensitive local media sample.</text><text x="30" y="893" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>