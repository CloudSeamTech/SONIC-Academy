<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1123" viewBox="0 0 1200 1123" role="img" aria-labelledby="title desc"><title id="title">If missing: add endpoint-only guest-firewall rules — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1123" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">If missing: add endpoint-only guest-firewall rules</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="301" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">read -r -p &quot;Manager active zone: &quot; SONIC_ZONE</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">read -r -p &quot;Endpoint private IPv4/32: &quot; SONIC_ENDPOINT_SOURCE</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">SONIC_EVENT_RULE=&quot;rule family=ipv4 source address=$SONIC_ENDPOINT_SOURCE port port=1514</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">protocol=tcp accept&quot;</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">SONIC_ENROLL_RULE=&quot;rule family=ipv4 source address=$SONIC_ENDPOINT_SOURCE port port=1515</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">protocol=tcp accept&quot;</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">sudo firewall-cmd --zone=&quot;$SONIC_ZONE&quot; --add-rich-rule=&quot;$SONIC_EVENT_RULE&quot;</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#292929">sudo firewall-cmd --zone=&quot;$SONIC_ZONE&quot; --add-rich-rule=&quot;$SONIC_ENROLL_RULE&quot;</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="610" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="640" r="18" fill="#292929"/><text x="54" y="647" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="644" font-family="Arial, sans-serif" font-size="20" fill="#292929">Skip if firewalld is inactive or the intended rules already exist.</text><path d="M60 683v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="699" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="729" r="18" fill="#292929"/><text x="54" y="736" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="733" font-family="Arial, sans-serif" font-size="20" fill="#292929">Enter the manager NIC active zone and the recorded endpoint private IPv4 followed by /32.</text><path d="M60 772v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="788" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="818" r="18" fill="#292929"/><text x="54" y="825" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="822" font-family="Arial, sans-serif" font-size="20" fill="#292929">Do not enter the manager address as the source.</text><text x="44" y="877" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="915" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="945" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="977" font-family="Arial, sans-serif" font-size="19" fill="#292929">Runtime rules permit the endpoint to reach default event/enrollment ports without an</text><text x="52" y="1006" font-family="Arial, sans-serif" font-size="19" fill="#292929">Internet-wide allowance.</text><text x="30" y="1100" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>