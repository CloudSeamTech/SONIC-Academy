<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="608" viewBox="0 0 1200 608" role="img" aria-labelledby="title desc"><title id="title">Explain what each migration method moves — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="608" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Explain what each migration method moves</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your Windows host · lab notes and browser</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="283" r="18" fill="#18334e"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Explain data vs server: Azure Migrate can move a VM in a supported environment; .bak moves</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#18334e">a database; AD replication shares a forest; ConfigMgr migration jobs move supported site</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#18334e">data.</text><rect x="28" y="400" width="1144" height="116" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="430" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="462" font-family="Arial, sans-serif" font-size="19" fill="#18334e">You can distinguish copying a database, moving a VM, sharing AD data and moving supported MECM</text><text x="52" y="491" font-family="Arial, sans-serif" font-size="19" fill="#18334e">objects.</text><text x="30" y="585" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>