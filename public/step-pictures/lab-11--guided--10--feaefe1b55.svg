<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="995" viewBox="0 0 1200 995" role="img" aria-labelledby="title desc"><title id="title">Run the reference check 1 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="995" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 10 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Run the reference check 1</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">APP01 guest / System Properties and PowerShell / known local Administrator plus</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">authorized destination domain join credentials.</text><rect x="28" y="277" width="1144" height="247" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">hostname</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">(Get-CimInstance Win32_ComputerSystem).Domain</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">Get-Service W3SVC</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">Test-NetConnection 192.168.77.40 -Port 53</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">gpupdate /force</text><text x="54" y="492" font-family="monospace" font-size="18" fill="#eaeaea">gpresult /r /scope computer</text><text x="44" y="548" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="580" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="610" r="18" fill="#21c5db"/><text x="54" y="617" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="614" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use the named shell and machine above.</text><path d="M60 653v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="669" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="699" r="18" fill="#21c5db"/><text x="54" y="706" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="703" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Read each command against the full lesson reference; run these lines only after completing</text><text x="96" y="733" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the preceding actions.</text><rect x="28" y="787" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="817" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="849" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">APP01 now belongs to migrate.lab.example.test; the website works; destination GPO is applied; old</text><text x="52" y="878" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">DCs remain intact.</text><text x="30" y="972" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>