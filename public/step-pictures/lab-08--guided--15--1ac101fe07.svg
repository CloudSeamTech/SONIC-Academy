<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="551" viewBox="0 0 1200 551" role="img" aria-labelledby="title desc"><title id="title">Sign into the guest — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="551" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 15 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Sign into the guest</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">DEST-DC01 · Windows Server desktop</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Use Workstation VM &gt; Send Ctrl+Alt+Del (or Ctrl+Alt+Insert), then sign in as the guest’s</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">local Administrator.</text><rect x="28" y="371" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="401" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="433" font-family="Arial, sans-serif" font-size="19" fill="#292929">You see a Windows desktop and Server Manager.</text><text x="30" y="528" font-family="Arial, sans-serif" font-size="17" fill="