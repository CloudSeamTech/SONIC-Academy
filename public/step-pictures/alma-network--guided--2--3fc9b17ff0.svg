<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="862" viewBox="0 0 1200 862" role="img" aria-labelledby="title desc"><title id="title">Separate DNS from connectivity — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="862" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Separate DNS from connectivity</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">AlmaLinux VM · GNOME Terminal</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">getent hosts almalinux.org</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">curl -I https://almalinux.org</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">nmcli device show</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="505" r="18" fill="#292929"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#292929">Resolve a known official site, then test HTTPS.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="564" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="594" r="18" fill="#292929"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#292929">If name lookup fails but your network route exists, check the connection’s DNS details</text><text x="96" y="628" font-family="Arial, sans-serif" font-size="20" fill="#292929">before changing anything.</text><rect x="28" y="682" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="712" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="744" font-family="Arial, sans-serif" font-size="19" fill="#292929">You can tell a name-resolution error from an HTTPS or connection error.</text><text x="30" y="839" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>