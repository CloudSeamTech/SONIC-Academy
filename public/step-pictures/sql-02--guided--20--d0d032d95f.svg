<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="963" viewBox="0 0 1200 963" role="img" aria-labelledby="title desc"><title id="title">Enter the lab address — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="963" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 20 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Enter the lab address</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">SQL01 · Windows Server desktop</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">ipconfig /all</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="421" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="451" r="18" fill="#292929"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#292929">For the example LAB 03 network only, choose Use the following IP address: 10.50.0.60;</text><text x="96" y="485" font-family="Arial, sans-serif" font-size="20" fill="#292929">subnet mask 255.255.255.0; leave Default gateway blank (VMnet2 is host-only).</text><path d="M60 523v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="539" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="569" r="18" fill="#292929"/><text x="54" y="576" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="573" font-family="Arial, sans-serif" font-size="20" fill="#292929">Set preferred DNS to 10.50.0.10.</text><path d="M60 612v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="628" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="658" r="18" fill="#292929"/><text x="54" y="665" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="662" font-family="Arial, sans-serif" font-size="20" fill="#292929">Click OK and Close.</text><text x="44" y="717" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="755" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="785" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="817" font-family="Arial, sans-serif" font-size="19" fill="#292929">ipconfig /all shows the planned 10.50.0.x address, blank default gateway, and the lab DNS</text><text x="52" y="846" font-family="Arial, sans-serif" font-size="19" fill="#292929">address on VMnet2.</text><text x="30" y="940" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>