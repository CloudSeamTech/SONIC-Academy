<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="989" viewBox="0 0 1200 989" role="img" aria-labelledby="title desc"><title id="title">Choose the local folder for your key — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="989" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Choose the local folder for your key</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Your Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">$SshDirectory = Join-Path $env:USERPROFILE &quot;.ssh&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">$KeyPath = Join-Path $SshDirectory &quot;rexuser_ed25519&quot;</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#18334e">$PublicKeyPath = &quot;$KeyPath.pub&quot;</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="505" r="18" fill="#18334e"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Use your own Windows computer.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="564" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="594" r="18" fill="#18334e"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#18334e">The folder is under your Windows user profile, not inside Documents, OneDrive or the GitHub</text><text x="96" y="628" font-family="Arial, sans-serif" font-size="20" fill="#18334e">project.</text><path d="M60 666v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="682" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="712" r="18" fill="#18334e"/><text x="54" y="719" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="716" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Run the three lines one at a time.</text><text x="44" y="771" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="809" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="839" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="871" font-family="Arial, sans-serif" font-size="19" fill="#18334e">The paths are stored in this PowerShell tab. No key has been created yet.</text><text x="30" y="966" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>