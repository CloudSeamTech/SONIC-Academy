<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1122" viewBox="0 0 1200 1122" role="img" aria-labelledby="title desc"><title id="title">Download and validate on Windows before transfer — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1122" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Download and validate on Windows before transfer</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Windows workstation · PowerShell</text><rect x="28" y="253" width="1144" height="328" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">$SonicStage = Join-Path $env:USERPROFILE &quot;sonic-artifacts&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">New-Item -ItemType Directory -Force -Path $SonicStage | Out-Null</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">$SonicRpm = Join-Path $SonicStage &quot;wazuh-agent.rpm&quot;</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">$SonicUrl = Read-Host &quot;Exact official HTTPS RPM URL&quot;</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">$SonicExpected = (Read-Host &quot;Vendor SHA-512 digest only&quot;).Trim()</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">if ($SonicUrl -notmatch &quot;^https://packages\.wazuh\.com/&quot;) { throw &quot;Use the official</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">package URL&quot; }</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#292929">if ($SonicExpected -notmatch &quot;^[0-9a-fA-F]{128}$&quot;) { throw &quot;Invalid SHA-512 value&quot; }</text><text x="54" y="552" font-family="monospace" font-size="18" fill="#292929">Invoke-WebRequest -Uri $SonicUrl -OutFile $SonicRpm</text><text x="44" y="605" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="637" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="667" r="18" fill="#292929"/><text x="54" y="674" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="671" font-family="Arial, sans-serif" font-size="20" fill="#292929">Open Windows Terminal → PowerShell.</text><path d="M60 710v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="726" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="756" r="18" fill="#292929"/><text x="54" y="763" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="760" font-family="Arial, sans-serif" font-size="20" fill="#292929">Create a staging folder under your local profile.</text><path d="M60 799v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="815" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="845" r="18" fill="#292929"/><text x="54" y="852" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="849" font-family="Arial, sans-serif" font-size="20" fill="#292929">Paste the exact official RPM URL and the separate vendor SHA-512 value at the prompts.</text><text x="44" y="904" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="942" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="972" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1004" font-family="Arial, sans-serif" font-size="19" fill="#292929">VENDOR SHA-512 MATCH appears before you transfer anything.</text><text x="30" y="1099" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>