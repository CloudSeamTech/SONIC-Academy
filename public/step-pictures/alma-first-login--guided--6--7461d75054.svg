<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="835" viewBox="0 0 1200 835" role="img" aria-labelledby="title desc"><title id="title">Record a clean baseline — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="835" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Record a clean baseline</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">AlmaLinux VM · GNOME Settings; then VMware Workstation Pro on your host</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">hostnamectl</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">df -h /</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="448" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="478" r="18" fill="#18334e"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Open About and note release, memory and disk.</text><path d="M60 521v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="537" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="567" r="18" fill="#18334e"/><text x="54" y="574" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="571" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Shut down the VM, then take a named Workstation snapshot if your edition supports it;</text><text x="96" y="601" font-family="Arial, sans-serif" font-size="20" fill="#18334e">separately keep backups of important files.</text><rect x="28" y="655" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="685" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="717" font-family="Arial, sans-serif" font-size="19" fill="#18334e">You have a starting point note and a VM recovery checkpoint.</text><text x="30" y="812" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>