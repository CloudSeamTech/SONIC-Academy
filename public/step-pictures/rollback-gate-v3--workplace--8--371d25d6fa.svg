<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="934" viewBox="0 0 1200 934" role="img" aria-labelledby="title desc"><title id="title">At work: run the approved backup and verify recovery evidence — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="934" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 8 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">At work: run the approved backup and verify recovery evidence</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Veeam Backup &amp; Replication · same PowerShell session and console</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">Start-VBRJob -Job $SonicJob</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="421" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="451" r="18" fill="#292929"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#292929">Run this separate command only after the previous selection and maintenance-window checks.</text><path d="M60 494v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="510" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="540" r="18" fill="#292929"/><text x="54" y="547" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="544" font-family="Arial, sans-serif" font-size="20" fill="#292929">Start-VBRJob starts the whole selected job, potentially including other VMs.</text><path d="M60 583v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="599" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="629" r="18" fill="#292929"/><text x="54" y="636" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="633" font-family="Arial, sans-serif" font-size="20" fill="#292929">Do not run it if the job is already running or its full scope is not approved.</text><text x="44" y="688" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="726" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="756" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="788" font-family="Arial, sans-serif" font-size="19" fill="#292929">The intended VM has a verified new restore point and a documented, tested recovery path. No</text><text x="52" y="817" font-family="Arial, sans-serif" font-size="19" fill="#292929">infrastructure command is executed by the course itself.</text><text x="30" y="911" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>