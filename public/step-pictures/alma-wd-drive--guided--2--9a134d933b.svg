<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Match model, serial and capacity — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="960" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Match model, serial and capacity</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">AlmaLinux VM · GNOME Disks</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">lsblk -o NAME,SIZE,MODEL,SERIAL,FSTYPE,MOUNTPOINTS</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">findmnt /</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">df -h</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="505" r="18" fill="#292929"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#292929">Open Activities → Disks.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="564" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="594" r="18" fill="#292929"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#292929">Select the candidate drive and record its model, serial, size and partitions.</text><path d="M60 637v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="653" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="683" r="18" fill="#292929"/><text x="54" y="690" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="687" font-family="Arial, sans-serif" font-size="20" fill="#292929">Compare with the physical device label.</text><text x="44" y="742" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="780" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="810" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="842" font-family="Arial, sans-serif" font-size="19" fill="#292929">You positively distinguish the data drive from the system disk mounted at /.</text><text x="30" y="937" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>