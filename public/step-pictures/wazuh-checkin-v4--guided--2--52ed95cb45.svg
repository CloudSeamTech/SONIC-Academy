<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="918" viewBox="0 0 1200 918" role="img" aria-labelledby="title desc"><title id="title">Record current endpoint evidence — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="918" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Record current endpoint evidence</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">date -Is</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">rpm -q wazuh-agent</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">sudo systemctl is-active wazuh-agent</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">sudo tail -n 50 /var/ossec/logs/ossec.log</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="502" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="532" r="18" fill="#292929"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#292929">date -Is records a timezone-bearing timestamp. rpm -q records the installed version;</text><text x="96" y="566" font-family="Arial, sans-serif" font-size="20" fill="#292929">is-active reports the service state. tail shows recent application messages, which must be</text><text x="96" y="596" font-family="Arial, sans-serif" font-size="20" fill="#292929">correlated with that time.</text><path d="M60 633v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="649" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="679" r="18" fill="#292929"/><text x="54" y="686" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="683" font-family="Arial, sans-serif" font-size="20" fill="#292929">Write down the actual hostname and timestamp before switching tabs.</text><rect x="28" y="738" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="768" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="800" font-family="Arial, sans-serif" font-size="19" fill="#292929">You have current endpoint identity and connection evidence.</text><text x="30" y="895" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>