<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="916" viewBox="0 0 1200 916" role="img" aria-labelledby="title desc"><title id="title">Create, copy and rename — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="916" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Create, copy and rename</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">AlmaLinux VM · GNOME Terminal</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">cd ~/DesktopPractice</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">printf &quot;first line\nsecond line\n&quot; &gt; notes.txt</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">cp -i notes.txt copy.txt</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">mv -i copy.txt renamed.txt</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">cat renamed.txt</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="529" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="559" r="18" fill="#292929"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#292929">Write two lines to a practice text file. &gt; replaces that named file; do not aim it at</text><text x="96" y="593" font-family="Arial, sans-serif" font-size="20" fill="#292929">valuable files.</text><path d="M60 631v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="647" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="677" r="18" fill="#292929"/><text x="54" y="684" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="681" font-family="Arial, sans-serif" font-size="20" fill="#292929">Copy first, then rename the copy.</text><rect x="28" y="736" width="1144" height="88" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="766" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="798" font-family="Arial, sans-serif" font-size="19" fill="#292929">You have notes.txt and renamed.txt with the same two lines.</text><text x="30" y="893" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>