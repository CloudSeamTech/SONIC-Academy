<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="title desc"><title id="title">Website step 1 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="726" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Website step 1</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Your Windows computer · browser → https://portal.azure.com</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Before any installer, write: change scope; exact selected release/artifact; hosts; expected</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#292929">effects; required access; pre-change evidence; recovery owner; time limit; rollback</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#292929">trigger; restore steps; validation; retention.</text><path d="M60 384v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="400" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="430" r="18" fill="#292929"/><text x="54" y="437" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="434" font-family="Arial, sans-serif" font-size="20" fill="#292929">The actual selected Wazuh release and vendor removal procedure must be filled in at the</text><text x="96" y="464" font-family="Arial, sans-serif" font-size="20" fill="#292929">next milestone before execution, not invented here.</text><rect x="28" y="518" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="548" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="580" font-family="Arial, sans-serif" font-size="19" fill="#292929">Check the named resource and settings before the next step. If the page shows an error, stop</text><text x="52" y="609" font-family="Arial, sans-serif" font-size="19" fill="#292929">and read it before continuing.</text><text x="30" y="703" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>