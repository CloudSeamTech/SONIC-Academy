<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="962" viewBox="0 0 1200 962" role="img" aria-labelledby="title desc"><title id="title">Add one monitored directory in the editor — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="962" fill="#e7edf4"/><rect width="1200" height="7" fill="#ee0000"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Add one monitored directory in the editor</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">sudo env SUDO_EDITOR=vi sudoedit /var/ossec/etc/ossec.conf</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">sudo grep -n &quot;sonic-fim&quot; /var/ossec/etc/ossec.conf</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="448" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="478" r="18" fill="#18334e"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Use vi explicitly so the keystrokes match: press Esc, type / followed by the search text,</text><text x="96" y="512" font-family="Arial, sans-serif" font-size="20" fill="#18334e">then Enter.</text><path d="M60 550v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="566" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="596" r="18" fill="#18334e"/><text x="54" y="603" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="600" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Press n for the next match.</text><path d="M60 639v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="655" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="685" r="18" fill="#18334e"/><text x="54" y="692" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="689" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Move with arrow keys.</text><text x="44" y="744" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="782" width="1144" height="88" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="812" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="844" font-family="Arial, sans-serif" font-size="19" fill="#18334e">Exactly one lab-directory entry appears inside the existing enabled syscheck configuration.</text><text x="30" y="939" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>