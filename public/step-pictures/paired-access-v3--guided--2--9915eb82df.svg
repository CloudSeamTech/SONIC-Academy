<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1019" viewBox="0 0 1200 1019" role="img" aria-labelledby="title desc"><title id="title">Command 1: read, type, then check — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1019" fill="#e7edf4"/><rect width="1200" height="7" fill="#0078d4"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#18334e">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#18334e">Command 1: read, type, then check</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#ffffff" stroke="#18334e"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#18334e" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#18334e">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#18334e">Windows · PowerShell</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#f7f9fc" stroke="#cbd6e3"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#ffffff"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#18334e">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#18334e">Test-NetConnection -ComputerName $ManagerPublicIp -Port 22</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#18334e">ssh -i &quot;$KeyPath&quot; -o IdentitiesOnly=yes &quot;rexuser@$ManagerPublicIp&quot;</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#53677e">Type the complete input in the written step below, then check your result.</text><rect x="28" y="448" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="478" r="18" fill="#18334e"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Test-NetConnection -ComputerName targets the manager’s actual public IP. -Port 22 tests TCP</text><text x="96" y="512" font-family="Arial, sans-serif" font-size="20" fill="#18334e">SSH reachability, not authentication.</text><path d="M60 550v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="566" width="1144" height="96" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="596" r="18" fill="#18334e"/><text x="54" y="603" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="600" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Before ssh, repeat the earlier Azure Run Command host-fingerprint procedure on the manager</text><text x="96" y="630" font-family="Arial, sans-serif" font-size="20" fill="#18334e">VM.</text><path d="M60 668v15m-6-6 6 6 6-6" fill="none" stroke="#53677e" stroke-width="2"/><rect x="28" y="684" width="1144" height="67" rx="10" fill="#ffffff" stroke="#cbd6e3"/><circle cx="60" cy="714" r="18" fill="#18334e"/><text x="54" y="721" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="718" font-family="Arial, sans-serif" font-size="20" fill="#18334e">Its fingerprint is different from the endpoint’s; compare like algorithm to like algorithm.</text><text x="44" y="773" font-family="Arial, sans-serif" font-size="18" fill="#53677e">Continue with the remaining small actions in the written step.</text><rect x="28" y="811" width="1144" height="116" rx="10" fill="#ffffff" stroke="#18334e"/><text x="52" y="841" font-family="Arial, sans-serif" font-size="17" fill="#18334e">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="873" font-family="Arial, sans-serif" font-size="19" fill="#18334e">A verified rexuser shell on the manager, with a different host identity/private address from</text><text x="52" y="902" font-family="Arial, sans-serif" font-size="19" fill="#18334e">the endpoint.</text><text x="30" y="996" font-family="Arial, sans-serif" font-size="17" fill="#18334e">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>