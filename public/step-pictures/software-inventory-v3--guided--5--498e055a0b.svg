<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1042" viewBox="0 0 1200 1042" role="img" aria-labelledby="title desc"><title id="title">Switch to the next app before continuing — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1042" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Switch to the next app before continuing</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">Post-install discovery recipe · commented placeholders only</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929"># Compare the recorded inventories after installation.</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929"># rpm -ql ACTUAL_PACKAGE</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929"># systemctl status ACTUAL_UNIT --no-pager</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929"># journalctl -u ACTUAL_UNIT -n 50 --no-pager</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929"># sudo dnf history info ACTUAL_TRANSACTION_ID</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="529" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="559" r="18" fill="#292929"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#292929">These examples are intentionally comments until a later installation provides actual names.</text><path d="M60 602v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="618" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="648" r="18" fill="#292929"/><text x="54" y="655" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="652" font-family="Arial, sans-serif" font-size="20" fill="#292929">No Wazuh unit name is supplied here.</text><path d="M60 691v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="707" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="737" r="18" fill="#292929"/><text x="54" y="744" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="741" font-family="Arial, sans-serif" font-size="20" fill="#292929">rpm -ql queries (-q) the file list (-l) of a discovered package.</text><text x="44" y="796" font-family="Arial, sans-serif" font-size="18" fill="#595247">Continue with the remaining small actions in the written step.</text><rect x="28" y="834" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="864" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="896" font-family="Arial, sans-serif" font-size="19" fill="#292929">A labeled pre-change inventory for both hosts and a discovery plan based on package/unit</text><text x="52" y="925" font-family="Arial, sans-serif" font-size="19" fill="#292929">differences.</text><text x="30" y="1019" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>