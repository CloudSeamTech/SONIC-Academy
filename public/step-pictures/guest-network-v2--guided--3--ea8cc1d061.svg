<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="757" viewBox="0 0 1200 757" role="img" aria-labelledby="title desc"><title id="title">Check the result and save your notes — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="757" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Check the result and save your notes</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">RHEL 9 · Bash · rexuser</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#292929"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#292929">Compare the private IP and prefix with Azure NIC → IP configurations and your subnet plan.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="342" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#292929"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#292929">Record the interface and default next hop.</text><path d="M60 415v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="431" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="461" r="18" fill="#292929"/><text x="54" y="468" font-family="Arial, sans-serif" font-size="20" fill="#fff">3</text><text x="96" y="465" font-family="Arial, sans-serif" font-size="20" fill="#292929">A route alone does not prove DNS or successful outbound communication; those will receive</text><text x="96" y="495" font-family="Arial, sans-serif" font-size="20" fill="#292929">dedicated labs.</text><rect x="28" y="549" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="579" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="611" font-family="Arial, sans-serif" font-size="19" fill="#292929">A private IPv4 inside the chosen subnet and an appropriate Azure gateway/default route. The</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="19" fill="#292929">public IPv4 normally does not appear on the guest NIC because Azure maps it outside the guest.</text><text x="30" y="734" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>