<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="998" viewBox="0 0 1200 998" role="img" aria-labelledby="title desc"><title id="title">Record the guest baseline and eligibility — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="998" fill="#e3d8c4"/><rect width="1200" height="7" fill="#292929"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#292929">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#292929">Record the guest baseline and eligibility</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#d7c8b2" stroke="#292929"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#292929" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#292929">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#292929">APP02 · Azure Windows Server · Windows PowerShell as administrator</text><rect x="28" y="253" width="1144" height="274" rx="10" fill="#f6f0e6" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#d7c8b2"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#292929">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#292929">Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#292929">DISM /online /Get-CurrentEdition</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#292929">DISM /online /Get-Intl</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#292929">Get-Volume -DriveLetter C</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#292929">Get-Service W3SVC</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#292929">Invoke-WebRequest http://localhost/index.html -UseBasicParsing | Select-Object</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#292929">StatusCode</text><text x="44" y="551" font-family="Arial, sans-serif" font-size="19" fill="#595247">Read and copy the complete command block in the written step below.</text><rect x="28" y="583" width="1144" height="67" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="613" r="18" fill="#292929"/><text x="54" y="620" font-family="Arial, sans-serif" font-size="20" fill="#fff">1</text><text x="96" y="617" font-family="Arial, sans-serif" font-size="20" fill="#292929">Inside APP02 open Windows PowerShell as administrator and run the read-only checks.</text><path d="M60 656v15m-6-6 6 6 6-6" fill="none" stroke="#595247" stroke-width="2"/><rect x="28" y="672" width="1144" height="96" rx="10" fill="#d7c8b2" stroke="#343434"/><circle cx="60" cy="702" r="18" fill="#292929"/><text x="54" y="709" font-family="Arial, sans-serif" font-size="20" fill="#fff">2</text><text x="96" y="706" font-family="Arial, sans-serif" font-size="20" fill="#292929">Confirm Server 2019, the installed edition, English (United States) for the documented</text><text x="96" y="736" font-family="Arial, sans-serif" font-size="20" fill="#292929">Azure media route, and sufficient OS disk free space.</text><rect x="28" y="790" width="1144" height="116" rx="10" fill="#d7c8b2" stroke="#292929"/><text x="52" y="820" font-family="Arial, sans-serif" font-size="17" fill="#292929">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="852" font-family="Arial, sans-serif" font-size="19" fill="#292929">The starting point records actual OS/build, edition, language, free space, IIS service, and</text><text x="52" y="881" font-family="Arial, sans-serif" font-size="19" fill="#292929">site response.</text><text x="30" y="975" font-family="Arial, sans-serif" font-size="17" fill="#292929">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>