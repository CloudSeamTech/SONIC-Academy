<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468"><rect width="1100" height="468" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Meet the machines</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">VMware Workstation Pro on your host</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Open the APP01 console. Keep the VMware network private; do not add router port forwarding.</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18">Write down APP01’s actual IPv4 address, subnet and the two domain DNS addresses. The existing</text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">course example is 10.50.0.30 for APP01; use it only if it matches your lab.</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">Our AD domain is lab.example.test. Our application address is helpdesk.lab.example.test. These are</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">names, not IP addresses.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: You have a short machine and address list.</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>