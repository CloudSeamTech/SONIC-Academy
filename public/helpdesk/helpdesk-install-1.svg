<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468"><rect width="1100" height="468" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Check the web installer</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">Private client · https://helpdesk.lab.example.test/setup/</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Open the installer over HTTPS. Read its prerequisite checks before continuing.</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18">Fix missing PHP extensions, URL Rewrite or config permissions on APP01. Recycle only the</text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">PracticeHelpdesk application pool after php.ini changes, then check again.</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">If a required component is missing, stop here rather than bypassing the check. Use current</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">osTicket requirements for your downloaded release.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The installer’s required checks pass.</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>