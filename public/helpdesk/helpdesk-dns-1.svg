<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="492" viewBox="0 0 1100 492"><rect width="1100" height="492" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Create the private DNS record</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">DC01 · Server Manager → Tools → DNS</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Expand your DC → Forward Lookup Zones → lab.example.test. This should already be your AD-</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">integrated zone from the domain build.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">Right-click the zone → New Host (A or AAAA). Name: helpdesk. IP address: APP01’s recorded</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">private IPv4 address. Choose Add Host.</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">Do not change the root lab.example.test record, registrar nameservers, MX records, or public DNS.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">Internal AD DNS must separately resolve any public services your clients need.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: Private DNS maps helpdesk.lab.example.test to APP01, without changing public records.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>