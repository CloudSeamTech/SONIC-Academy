<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="492" viewBox="0 0 1100 492"><rect width="1100" height="492" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Check APP01 before installing</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · Windows PowerShell as administrator</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Open Start, type Windows PowerShell, right-click it and choose Run as administrator.</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18">Run the read-only checks below. Confirm APP01, Windows Server 2019, lab.example.test and a</text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">healthy domain trust.</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">If the domain is still an older practice domain, stop. Do not rename a working AD forest or</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">simply edit DNS to pretend it was renamed; use the updated fresh-build classes or a separately</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">planned migration.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: APP01 is running the intended source OS and domain; the secure-channel test is True.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>