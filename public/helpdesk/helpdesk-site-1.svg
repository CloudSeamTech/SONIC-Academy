<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468"><rect width="1100" height="468" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Copy the application files</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · File Explorer</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Create C:\Sites\PracticeHelpdesk. Extract the osTicket download into a temporary folder.</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18">Copy the CONTENTS of its upload folder into C:\Sites\PracticeHelpdesk. The destination should</text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">contain index.php, include, scp and setup directly.</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">Inside include, copy ost-sampleconfig.php to ost-config.php. Keep the ZIP and SQL backup</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">outside the public website folder.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The website root contains index.php and include\ost-config.php.</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>