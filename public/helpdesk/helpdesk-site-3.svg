<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="588" viewBox="0 0 1100 588"><rect width="1100" height="588" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Grant limited file access</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · elevated Windows PowerShell</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Grant the pool Read and Execute on the website folder. Grant Modify on ost-config.php only for</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">the installer. Run the commands below.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">In IIS Manager select PracticeHelpdesk → Authentication → Anonymous Authentication → Edit →</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">Application pool identity. This makes anonymous requests use the named pool’s file rights.</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">In Default Document ensure index.php is present, adding it if necessary. Do not grant Everyone</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">Full Control or make the whole site writable.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Create the private runtime folders in the command below and grant Modify only there to this</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18">pool. These folders stay outside the website root; they hold temporary uploads, sessions and</text><text x="36" y="468" fill="#eaeaea" font-family="sans-serif" font-size="18">the PHP error log.</text><text x="36" y="492" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="516" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The pool can read the app and temporarily write its configuration file.</text><text x="36" y="540" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>