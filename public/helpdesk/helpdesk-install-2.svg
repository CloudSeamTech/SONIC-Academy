<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect width="1100" height="540" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Create the help desk and administrator</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">Private client · osTicket installer</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Helpdesk Name: Practice IT Help Desk. Helpdesk URL: https://helpdesk.lab.example.test/. Use a</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">real mailbox you control for required email fields; do not assume support@lab.example.test</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18">already exists.</text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">Create a unique osTicket administrator username and password. This is an application account;</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">do not reuse your Windows domain Administrator password.</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">Database: osticket. Username: osticket_app. Password: your stored app secret. Host: localhost.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Complete installation and record the result. Entering an email address does not configure SMTP</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">or IMAP.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="468" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: osTicket installs and its staff login at /scp/ opens.</text><text x="36" y="492" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>