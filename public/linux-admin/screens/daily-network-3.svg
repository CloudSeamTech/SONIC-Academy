<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="530" viewBox="0 0 1100 530" role="img" aria-labelledby="title desc"><title id="title">Check a client connection with a timeout</title><desc id="desc">Instructional mockup. Not a live terminal capture. An HTTP status and headers, or a specific DNS/TCP/TLS error. Public site behavior can change.</desc><rect width="1100" height="530" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Check a client connection with a timeout</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">curl -I --connect-timeout 5 --max-time 10 https://example.com</text><text x="32" y="202" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="227" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="252" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">An HTTP status and headers, or a specific DNS/TCP/TLS error. Public site behavior </text><text x="32" y="277" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">can change.</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Connection refused, timeout, DNS failure and certificate failure point to different </text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">next checks.</text><text x="32" y="402" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="427" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Record the exact error category. A 403 still means the server answered HTTP, not </text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">that the application allows you.</text></svg>
