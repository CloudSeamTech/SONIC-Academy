<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">Read status and this unit’s journal</title><desc id="desc">Instructional mockup. Not a live terminal capture. Status includes failed and commonly 203/EXEC; the journal names an execution failure.</desc><rect width="1100" height="630" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Read status and this unit’s journal</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">systemctl status sonic-practice.service --no-pager -l</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo journalctl -u sonic-practice.service -b -n 30 --no-pager</text><text x="32" y="227" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="252" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="277" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">× sonic-practice.service - SONIC disposable practice service</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">  Active: failed (Result: exit-code)</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> Process: 3120 ExecStart=/usr/bin/sonic-missing-command</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">          (code=exited, status=203/EXEC)</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Failed at step EXEC spawning /usr/bin/sonic-missing-command:</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">No such file or directory</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Formatting, PID and wording vary.]</text><text x="32" y="452" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="477" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">status is the short summary. journalctl is the detailed event notebook.</text><text x="32" y="527" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="552" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Find the missing executable and the time of your failed start.</text></svg>
