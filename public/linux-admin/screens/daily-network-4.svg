<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">See listeners without changing the firewall</title><desc id="desc">Instructional mockup. Not a live terminal capture. TCP listeners and the active firewalld zone settings, or a clear not-running message.</desc><rect width="1100" height="630" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">See listeners without changing the firewall</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo ss -lntp</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo firewall-cmd --state</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo firewall-cmd --list-all</text><text x="32" y="252" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="277" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">State  Recv-Q Send-Q Local Address:Port Peer Address:Port Process</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">LISTEN 0      128    0.0.0.0:22         0.0.0.0:*       </text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">users:((&quot;sshd&quot;,pid=900,fd=3))</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Example only: port 22 belongs to the SSH server here.]</text><text x="32" y="402" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="427" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A listening service, allowed firewall path and working application are separate </text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">conditions.</text><text x="32" y="502" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="527" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Match the desired port to the process and zone. Localhost-only listeners cannot </text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">accept remote traffic.</text></svg>
