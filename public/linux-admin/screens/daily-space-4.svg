<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">Remove only the known sample and verify</title><desc id="desc">Instructional mockup. Not a live terminal capture. rm asks for confirmation. Folder usage drops; df may round the small difference.</desc><rect width="1100" height="630" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Remove only the known sample and verify</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">rm -i &quot;$HOME/sonic-admin/practice/space/sample.bin&quot;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">du -sh &quot;$HOME/sonic-admin/practice/space&quot;</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">df -h &quot;$HOME/sonic-admin&quot;</text><text x="32" y="252" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="277" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">rm: remove regular file &#x27;.../practice/space/sample.bin&#x27;? y</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ du -sh /home/learner/sonic-admin/practice/space</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">4.0K  /home/learner/sonic-admin/practice/space</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Small changes may be rounded in df output.]</text><text x="32" y="402" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="427" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">The owner must approve what can be removed. Logs, databases and open files need </text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">their own handling.</text><text x="32" y="502" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="527" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Answer y only for this exact sample. Confirm it is gone and no application data was </text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">touched.</text></svg>
