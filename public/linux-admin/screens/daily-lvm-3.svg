<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="805" viewBox="0 0 1100 805" role="img" aria-labelledby="title desc"><title id="title">Build only the new practice storage</title><desc id="desc">Instructional mockup. Not a live terminal capture. A 512 MiB-class XFS filesystem mounted at /mnt/sonic-lvm; usable size is slightly smaller.</desc><rect width="1100" height="805" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Build only the new practice storage</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo pvcreate &quot;$LAB_DISK&quot;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo vgcreate sonic_lab_vg &quot;$LAB_DISK&quot;</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo lvcreate -L 512M -n practice sonic_lab_vg</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo mkfs.xfs /dev/sonic_lab_vg/practice</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo mkdir -p /mnt/sonic-lvm</text><text x="32" y="302" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo mount /dev/sonic_lab_vg/practice /mnt/sonic-lvm</text><text x="32" y="327" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">df -hT /mnt/sonic-lvm</text><text x="32" y="352" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="377" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Physical volume &quot;/dev/sdb&quot; successfully created.</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Volume group &quot;sonic_lab_vg&quot; successfully created</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Logical volume &quot;practice&quot; created.</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ df -hT /mnt/sonic-lvm</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Filesystem                       Type Size Used Avail Use% Mounted on</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/sonic_lab_vg-practice xfs  507M  30M  477M   6% /mnt/sonic-lvm</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Usable capacity varies with filesystem metadata.]</text><text x="32" y="577" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="602" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="627" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">pvcreate marks the new disk for LVM, vgcreate makes a pool, lvcreate takes a slice, </text><text x="32" y="652" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">and mkfs creates the filesystem.</text><text x="32" y="677" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="702" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="727" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">The filesystem is XFS, the source is sonic_lab_vg/practice and the mount is </text><text x="32" y="752" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/mnt/sonic-lvm.</text></svg>
