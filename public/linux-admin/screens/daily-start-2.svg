<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="505" viewBox="0 0 1100 505" role="img" aria-labelledby="title desc"><title id="title">Check your administrator key</title><desc id="desc">Instructional mockup. Not a live terminal capture. sudo may ask for your own password. A permitted account has an allowed command list.</desc><rect width="1100" height="505" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Check your administrator key</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo -v</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo -l</text><text x="32" y="227" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="252" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="277" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">sudo may ask for your own password. A permitted account has an allowed command list.</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">sudo temporarily lets an approved account do an administrator job; it does not mean </text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">every command is safe.</text><text x="32" y="402" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="427" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">No “not in the sudoers file” error appears. Your policy allows the exercises.</text></svg>
