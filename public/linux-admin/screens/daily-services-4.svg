<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Fix one line, reload, and retest</title><desc id="desc">Instructional mockup. Not a live terminal capture. active (exited), because this is a oneshot with RemainAfterExit, not a network daemon.</desc><rect width="1100" height="680" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Fix one line, reload, and retest</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo sed -i &#x27;s|ExecStart=/usr/bin/sonic-missing-command|ExecStart=/usr/bin/true|&#x27; </text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">/etc/systemd/system/sonic-practice.service</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl daemon-reload</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl start sonic-practice.service</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">systemctl status sonic-practice.service --no-pager</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">● sonic-practice.service - SONIC disposable practice service</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">  Active: active (exited)</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> Process: 3150 ExecStart=/usr/bin/true (code=exited, status=0/SUCCESS)</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Expected oneshot state, not a running web daemon.]</text><text x="32" y="452" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="477" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">One verified change ties the symptom to its cause. Active means different things for</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> different unit types.</text><text x="32" y="552" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="577" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Confirm ExecStart now names /usr/bin/true and status is active (exited). Save </text><text x="32" y="627" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">before/after evidence.</text></svg>
