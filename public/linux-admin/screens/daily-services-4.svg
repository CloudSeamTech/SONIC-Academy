<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="title desc"><title id="title">Fix one line, reload, and retest</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. active (exited), because this is a oneshot with RemainAfterExit, not a network daemon.</desc><rect width="1200" height="617" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Fix one line, reload, and retest</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo sed -i 's|ExecStart=/usr/bin/sonic-missing-command|ExecStart=/</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">usr/bin/true|' /etc/systemd/system/sonic-practice.service</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo systemctl daemon-reload</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo systemctl start sonic-practice.service</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ systemctl status sonic-practice.service --no-pager</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="464" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">● sonic-practice.service - SONIC disposable practice service</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">  Active: active (exited)</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"> Process: 3150 ExecStart=/usr/bin/true (code=exited, status=0/SUCCESS)</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Expected oneshot state, not a running web daemon.]</text></svg>
