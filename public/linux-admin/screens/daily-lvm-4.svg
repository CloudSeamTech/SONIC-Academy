<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="737" viewBox="0 0 1200 737" role="img" aria-labelledby="title desc"><title id="title">Grow the logical volume and XFS in order</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. VFree exceeds 256 MiB first. The LV becomes 768 MiB; df shows a larger XFS filesystem.</desc><rect width="1200" height="737" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Grow the logical volume and XFS in order</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo vgs sonic_lab_vg</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo lvextend -L +256M /dev/sonic_lab_vg/practice</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo xfs_growfs /mnt/sonic-lvm</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo lvs /dev/sonic_lab_vg/practice</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ df -hT /mnt/sonic-lvm</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="464" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Size of logical volume sonic_lab_vg/practice changed</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">from 512.00 MiB to 768.00 MiB.</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Logical volume sonic_lab_vg/practice successfully resized.</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo lvs /dev/sonic_lab_vg/practice</text><text x="32" y="584" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">LV       VG           Attr       LSize</text><text x="32" y="608" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">practice sonic_lab_vg -wi-ao---- 768.00m</text><text x="32" y="632" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ df -hT /mnt/sonic-lvm</text><text x="32" y="656" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Filesystem                       Type Size Used Avail Use% Mounted on</text><text x="32" y="680" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/sonic_lab_vg-practice xfs  763M  31M  732M   5% /mnt/sonic-lvm</text></svg>
