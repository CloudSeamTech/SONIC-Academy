<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc"><title id="title">Grow the logical volume and XFS in order</title><desc id="desc">Instructional mockup. Not a live terminal capture. VFree exceeds 256 MiB first. The LV becomes 768 MiB; df shows a larger XFS filesystem.</desc><rect width="1100" height="780" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Grow the logical volume and XFS in order</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo vgs sonic_lab_vg</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo lvextend -L +256M /dev/sonic_lab_vg/practice</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo xfs_growfs /mnt/sonic-lvm</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo lvs /dev/sonic_lab_vg/practice</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">df -hT /mnt/sonic-lvm</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Size of logical volume sonic_lab_vg/practice changed</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">from 512.00 MiB to 768.00 MiB.</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Logical volume sonic_lab_vg/practice successfully resized.</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ sudo lvs /dev/sonic_lab_vg/practice</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">LV       VG           Attr       LSize</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">practice sonic_lab_vg -wi-ao---- 768.00m</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ df -hT /mnt/sonic-lvm</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Filesystem                       Type Size Used Avail Use% Mounted on</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/sonic_lab_vg-practice xfs  763M  31M  732M   5% /mnt/sonic-lvm</text><text x="32" y="577" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="602" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="627" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Extending the LV gives XFS room; growing XFS makes that room usable. The + means </text><text x="32" y="652" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">add, not set the final size.</text><text x="32" y="677" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="702" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="727" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Compare lvs and df before/after. Both layers must show growth.</text></svg>
