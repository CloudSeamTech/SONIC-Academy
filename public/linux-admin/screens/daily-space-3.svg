<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="655" viewBox="0 0 1100 655" role="img" aria-labelledby="title desc"><title id="title">Find the large folder one level at a time</title><desc id="desc">Instructional mockup. Not a live terminal capture. The practice folder is larger; find lists sample.bin with its byte size.</desc><rect width="1100" height="655" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Find the large folder one level at a time</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">du -xhd1 &quot;$HOME/sonic-admin&quot; | sort -h</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">find &quot;$HOME/sonic-admin/practice&quot; -xdev -type f -size +5M -printf &quot;%s %p\n&quot;</text><text x="32" y="227" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="252" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="277" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ du -xhd1 /home/learner/sonic-admin | sort -h</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">4.0K  /home/learner/sonic-admin/evidence</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">8.1M  /home/learner/sonic-admin/practice</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">8.1M  /home/learner/sonic-admin</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ find ... -size +5M -printf &quot;%s %p\n&quot;</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">8388608 /home/learner/sonic-admin/practice/space/sample.bin</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[The command above the image is complete; ... here abbreviates it.]</text><text x="32" y="452" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="477" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Start broad, then narrow. Avoid a slow scan of every disk when only one mount is </text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">affected.</text><text x="32" y="552" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="577" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Locate sample.bin and explain why it belongs to this filesystem.</text></svg>
