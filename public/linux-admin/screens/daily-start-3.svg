<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="655" viewBox="0 0 1100 655" role="img" aria-labelledby="title desc"><title id="title">Make a small practice area</title><desc id="desc">Instructional mockup. Not a live terminal capture. /home/your-user/sonic-admin
Practice only</desc><rect width="1100" height="655" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Make a small practice area</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">mkdir -p &quot;$HOME/sonic-admin/practice&quot; &quot;$HOME/sonic-admin/evidence&quot;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">cd &quot;$HOME/sonic-admin&quot;</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">pwd</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">printf &quot;Practice only\n&quot; &gt; practice/readme.txt</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">cat practice/readme.txt</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ pwd</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/home/learner/sonic-admin</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ cat practice/readme.txt</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Practice only</text><text x="32" y="452" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="477" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A named practice folder keeps training files away from application and operating-</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">system files.</text><text x="32" y="552" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="577" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">pwd ends in /sonic-admin and the file prints Practice only.</text></svg>
