<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="617" viewBox="0 0 1200 617" role="img" aria-labelledby="title desc"><title id="title">Check time, uptime and failed services</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. An ISO timestamp, uptime/load figures, and a failed-unit list (possibly 0 loaded units listed).</desc><rect width="1200" height="617" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Check time, uptime and failed services</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ date -Is</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ uptime</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ systemctl --failed --no-pager</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="416" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ uptime</text><text x="32" y="464" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"> 09:15:00 up 1 day,  2:10,  1 user, load average: 0.04, 0.08, 0.03</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ systemctl --failed --no-pager</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">  UNIT LOAD ACTIVE SUB DESCRIPTION</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">0 loaded units listed.</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Illustrative healthy sample, not your measured state.]</text></svg>
