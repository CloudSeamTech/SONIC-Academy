<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="705" viewBox="0 0 1100 705" role="img" aria-labelledby="title desc"><title id="title">Check address and route from the console</title><desc id="desc">Instructional mockup. Not a live terminal capture. An active interface, its address and usually a default route on NAT.</desc><rect width="1100" height="705" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Check address and route from the console</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ip -br address</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ip route</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">nmcli device status</text><text x="32" y="252" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="277" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ ip -br address</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">lo       UNKNOWN 127.0.0.1/8 ::1/128</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">ens160   UP      192.168.211.128/24</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ ip route</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">default via 192.168.211.2 dev ens160</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">192.168.211.0/24 dev ens160 scope link src 192.168.211.128</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Illustrative VMware NAT values; record YOUR actual network.]</text><text x="32" y="477" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="502" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">An address identifies the VM; a route tells it where to send traffic. NAT uses a </text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">private gateway.</text><text x="32" y="577" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="602" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="627" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Record your actual interface and gateway. Do not replace them with another student’s</text><text x="32" y="652" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> values.</text></svg>
