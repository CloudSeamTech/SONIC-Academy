<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="545" viewBox="0 0 1200 545" role="img" aria-labelledby="title desc"><title id="title">Connect from the physical Windows computer</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. On first connection, a fingerprint prompt; after verified acceptance and successful authentication, a Linux shell prompt.</desc><rect width="1200" height="545" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Connect from the physical Windows computer</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Windows PowerShell</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: C:\Users\Administrator — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">PS C:\Users\Administrator&gt; Set-Location $HOME</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">PS C:\Users\Administrator&gt; Get-Location</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">C:\Users\Administrator</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">PS C:\Users\Administrator&gt; ssh your-linux-user@YOUR_VM_IP</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="368" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">PS C:\Users\Student&gt; ssh learner@192.168.211.128</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">The authenticity of host cannot be established.</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">ED25519 key fingerprint is SHA256:&lt;compare-with-VM-console&gt;.</text><text x="32" y="464" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Are you sure you want to continue connecting?</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Accept ONLY after matching the actual fingerprint. No key is supplied here.]</text></svg>
