<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="630" viewBox="0 0 1100 630" role="img" aria-labelledby="title desc"><title id="title">Connect from the physical Windows computer</title><desc id="desc">Instructional mockup. Not a live terminal capture. On first connection, a fingerprint prompt; after verified acceptance and successful authentication, a Linux shell prompt.</desc><rect width="1100" height="630" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Connect from the physical Windows computer</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ssh your-linux-user@YOUR_VM_IP</text><text x="32" y="202" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="227" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="252" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">PS C:\Users\Student&gt; ssh learner@192.168.211.128</text><text x="32" y="277" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">The authenticity of host cannot be established.</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">ED25519 key fingerprint is SHA256:&lt;compare-with-VM-console&gt;.</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Are you sure you want to continue connecting?</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Accept ONLY after matching the actual fingerprint. No key is supplied here.]</text><text x="32" y="377" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="402" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">SSH encrypts the connection. The username and address tell the client which account </text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">on which machine to request.</text><text x="32" y="477" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="502" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Replace your-linux-user with whoami from the VM and YOUR_VM_IP with its actual </text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">address. Compare the fingerprint with the console, then accept only a match. After </text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">login run whoami and hostname.</text></svg>
