<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="855" viewBox="0 0 1100 855" role="img" aria-labelledby="title desc"><title id="title">Create a harmless scheduled health marker</title><desc id="desc">Instructional mockup. Not a live terminal capture. Two new practice unit files; daemon-reload normally prints nothing.</desc><rect width="1100" height="855" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Create a harmless scheduled health marker</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo tee /etc/systemd/system/sonic-daily-check.service &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Unit]</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">Description=SONIC practice health marker</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Service]</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">Type=oneshot</text><text x="32" y="302" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ExecStart=/usr/bin/logger -t sonic-daily-check Practice-health-check-ran</text><text x="32" y="327" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">EOF</text><text x="32" y="352" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo tee /etc/systemd/system/sonic-daily-check.timer &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="32" y="377" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Unit]</text><text x="32" y="402" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">Description=SONIC practice daily timer</text><text x="32" y="427" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Timer]</text><text x="32" y="452" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">OnCalendar=daily</text><text x="32" y="477" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">Persistent=true</text><text x="32" y="502" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Install]</text><text x="32" y="527" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">WantedBy=timers.target</text><text x="32" y="552" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">EOF</text><text x="32" y="577" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl daemon-reload</text><text x="32" y="602" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="627" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="652" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Two new practice unit files; daemon-reload normally prints nothing.</text><text x="32" y="677" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="702" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="727" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A timer is an alarm clock; its service is the job it wakes up.</text><text x="32" y="752" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="777" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="802" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Use systemctl cat on each new unit and verify the exact text.</text></svg>
