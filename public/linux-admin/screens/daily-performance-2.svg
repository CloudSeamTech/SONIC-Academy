<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="755" viewBox="0 0 1100 755" role="img" aria-labelledby="title desc"><title id="title">Separate cache from memory pressure</title><desc id="desc">Instructional mockup. Not a live terminal capture. Five reports. vmstat’s first is since-boot average; later rows are interval samples.</desc><rect width="1100" height="755" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Separate cache from memory pressure</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">free -h</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">vmstat 1 5</text><text x="32" y="227" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="252" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="277" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ free -h</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">               total  used  free shared buff/cache available</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Mem:           1.7Gi 700Mi 300Mi   10Mi      700Mi     850Mi</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Swap:          2.0Gi    0B 2.0Gi</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Illustrative rounded figures; available matters more than free alone.]</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ vmstat 1 5</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">procs --------memory-------- ---swap-- -----io---- -system-- ------cpu-----</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> r b   swpd  free buff cache  si so    bi bo     in cs      us sy id wa st</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> 0 0      0 ...  ...  ...     0  0     0  0    ... ...      1  1 98  0  0</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Read later interval rows, not only the since-boot first report.]</text><text x="32" y="527" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="552" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Low free memory can be normal cache. Sustained swapping plus symptoms is stronger </text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">evidence.</text><text x="32" y="627" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="652" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="677" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Inspect available memory and later si/so rows. Record repeated activity, not one </text><text x="32" y="702" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">number.</text></svg>
