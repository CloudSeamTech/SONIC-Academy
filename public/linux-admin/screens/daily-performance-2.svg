<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="689" viewBox="0 0 1200 689" role="img" aria-labelledby="title desc"><title id="title">Separate cache from memory pressure</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. Five reports. vmstat’s first is since-boot average; later rows are interval samples.</desc><rect width="1200" height="689" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Separate cache from memory pressure</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ free -h</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ vmstat 1 5</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="392" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ free -h</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">               total  used  free shared buff/cache available</text><text x="32" y="464" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Mem:           1.7Gi 700Mi 300Mi   10Mi      700Mi     850Mi</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Swap:          2.0Gi    0B 2.0Gi</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Illustrative rounded figures; available matters more than free alone.]</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ vmstat 1 5</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">procs --------memory-------- ---swap-- -----io---- -system-- ------cpu-----</text><text x="32" y="584" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"> r b   swpd  free buff cache  si so    bi bo     in cs      us sy id wa st</text><text x="32" y="608" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"> 0 0      0 ...  ...  ...     0  0     0  0    ... ...      1  1 98  0  0</text><text x="32" y="632" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Read later interval rows, not only the since-boot first report.]</text></svg>
