<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="755" viewBox="0 0 1100 755" role="img" aria-labelledby="title desc"><title id="title">Find the affected filesystem</title><desc id="desc">Instructional mockup. Not a live terminal capture. The mount containing your practice folder, its filesystem type, byte use and inode use.</desc><rect width="1100" height="755" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Find the affected filesystem</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">df -hT &quot;$HOME/sonic-admin&quot;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">findmnt -T &quot;$HOME/sonic-admin&quot;</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">df -i &quot;$HOME/sonic-admin&quot;</text><text x="32" y="252" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="277" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ df -hT /home/learner/sonic-admin</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Filesystem          Type Size Used Avail Use% Mounted on</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/al-root xfs   28G  8.0G   20G  29% /</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ findmnt -T /home/learner/sonic-admin</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">TARGET SOURCE              FSTYPE OPTIONS</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/      /dev/mapper/al-root  xfs    rw,relatime,...</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ df -i /home/learner/sonic-admin</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Filesystem          Inodes  IUsed    IFree IUse% Mounted on</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/al-root 14680064 60000 14620064    1% /</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Sample healthy capacity; never fill / for practice.]</text><text x="32" y="552" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="577" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">df asks how full a filesystem is. findmnt tells us which storage area owns the path.</text><text x="32" y="627" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="652" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="677" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Match TARGET from findmnt to Mounted on from df. Record whether bytes or inodes are </text><text x="32" y="702" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">actually scarce.</text></svg>
