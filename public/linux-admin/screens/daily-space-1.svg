<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="713" viewBox="0 0 1200 713" role="img" aria-labelledby="title desc"><title id="title">Find the affected filesystem</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. The mount containing your practice folder, its filesystem type, byte use and inode use.</desc><rect width="1200" height="713" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Find the affected filesystem</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ df -hT &quot;$HOME/sonic-admin&quot;</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ findmnt -T &quot;$HOME/sonic-admin&quot;</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ df -i &quot;$HOME/sonic-admin&quot;</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="416" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ df -hT /home/learner/sonic-admin</text><text x="32" y="464" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Filesystem          Type Size Used Avail Use% Mounted on</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/al-root xfs   28G  8.0G   20G  29% /</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ findmnt -T /home/learner/sonic-admin</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">TARGET SOURCE              FSTYPE OPTIONS</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/      /dev/mapper/al-root  xfs    rw,relatime,...</text><text x="32" y="584" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ df -i /home/learner/sonic-admin</text><text x="32" y="608" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Filesystem          Inodes  IUsed    IFree IUse% Mounted on</text><text x="32" y="632" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/dev/mapper/al-root 14680064 60000 14620064    1% /</text><text x="32" y="656" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Sample healthy capacity; never fill / for practice.]</text></svg>
