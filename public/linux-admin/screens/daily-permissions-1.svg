<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="605" viewBox="0 0 1100 605" role="img" aria-labelledby="title desc"><title id="title">Inspect your identity and a private practice file</title><desc id="desc">Instructional mockup. Not a live terminal capture. The file begins -rw------- and belongs to your account; namei lists parent directories.</desc><rect width="1100" height="605" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Inspect your identity and a private practice file</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">id</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">printf &quot;Practice note\n&quot; &gt; &quot;$HOME/sonic-admin/practice/private.txt&quot;</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">chmod 600 &quot;$HOME/sonic-admin/practice/private.txt&quot;</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ls -l &quot;$HOME/sonic-admin/practice/private.txt&quot;</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">namei -l &quot;$HOME/sonic-admin/practice/private.txt&quot;</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">uid=1000(learner) gid=1000(learner) groups=1000(learner),10(wheel)</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">-rw-------. 1 learner learner 14 Oct 30 09:30 private.txt</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Sample identity/date. Parent directory permissions matter too.]</text><text x="32" y="427" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="452" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A user needs directory traversal as well as access to the file itself.</text><text x="32" y="502" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="527" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Explain owner/group/other and each parent’s execute/search permission.</text></svg>
