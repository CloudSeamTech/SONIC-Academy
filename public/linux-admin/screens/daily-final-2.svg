<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="655" viewBox="0 0 1100 655" role="img" aria-labelledby="title desc"><title id="title">Remove the two practice systemd jobs</title><desc id="desc">Instructional mockup. Not a live terminal capture. Only your named practice units are removed. Already-absent units can produce not-found messages.</desc><rect width="1100" height="655" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Remove the two practice systemd jobs</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl disable --now sonic-daily-check.timer</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl stop sonic-practice.service</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo rm -i /etc/systemd/system/sonic-daily-check.timer /etc/systemd/system/sonic-</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">daily-check.service /etc/systemd/system/sonic-practice.service</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl daemon-reload</text><text x="32" y="302" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl reset-failed sonic-practice.service</text><text x="32" y="327" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="352" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Only your named practice units are removed. Already-absent units can produce not-</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">found messages.</text><text x="32" y="427" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="452" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Cleanup must remove only what we created. Resetting a failed flag is housekeeping, </text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">not a repair.</text><text x="32" y="527" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="552" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">systemctl list-timers --all no longer lists sonic-daily-check; systemctl cat cannot </text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">find the deleted practice units.</text></svg>
