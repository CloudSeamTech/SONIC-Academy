<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">Create a small disposable growth example</title><desc id="desc">Instructional mockup. Not a live terminal capture. About 8.0M for sample.bin. The system disk is not intentionally filled.</desc><rect width="1100" height="555" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Create a small disposable growth example</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">mkdir -p &quot;$HOME/sonic-admin/practice/space&quot;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">dd if=/dev/zero of=&quot;$HOME/sonic-admin/practice/space/sample.bin&quot; bs=1M count=8 </text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">status=none</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">du -h &quot;$HOME/sonic-admin/practice/space/sample.bin&quot;</text><text x="32" y="277" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="302" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">$ du -h /home/learner/sonic-admin/practice/space/sample.bin</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">8.0M  /home/learner/sonic-admin/practice/space/sample.bin</text><text x="32" y="377" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="402" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A tiny known file lets you see how usage measurement works safely.</text><text x="32" y="452" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="477" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">The exact file is about 8 MiB and is inside your practice/space folder.</text></svg>
