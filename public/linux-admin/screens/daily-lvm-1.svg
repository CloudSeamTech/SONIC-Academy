<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="780" viewBox="0 0 1100 780" role="img" aria-labelledby="title desc"><title id="title">Add a separate practice disk in VMware</title><desc id="desc">Instructional mockup. Not a live terminal capture. A map of disks, existing physical volumes, groups and logical volumes. Record it before adding anything.</desc><rect width="1100" height="780" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Add a separate practice disk in VMware</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS,MODEL</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo pvs</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo vgs</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo lvs</text><text x="32" y="277" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="302" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="327" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">NAME          SIZE TYPE FSTYPE      MOUNTPOINTS</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">sda            30G disk</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">├─sda1          1G part xfs         /boot</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">└─sda2         29G part LVM2_member</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">  ├─al-root    27G lvm  xfs         /</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">  └─al-swap     2G lvm  swap        [SWAP]</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">sdb             2G disk</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Before/after example only. Do NOT assume your new disk is sdb.]</text><text x="32" y="527" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="552" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="577" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Disk → physical volume → volume group → logical volume → filesystem is the storage </text><text x="32" y="602" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">stack. We will not alter the OS stack.</text><text x="32" y="627" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="652" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="677" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Power off the VM normally, open VM → Settings → Add → Hard Disk, create a NEW 2 GB </text><text x="32" y="702" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">virtual disk, then boot. Run the commands again and identify the new blank 2 GB </text><text x="32" y="727" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">disk.</text></svg>
