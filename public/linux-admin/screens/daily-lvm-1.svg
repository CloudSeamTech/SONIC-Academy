<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="689" viewBox="0 0 1200 689" role="img" aria-labelledby="title desc"><title id="title">Add a separate practice disk in VMware</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. A map of disks, existing physical volumes, groups and logical volumes. Record it before adding anything.</desc><rect width="1200" height="689" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Add a separate practice disk in VMware</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ lsblk -o NAME,SIZE,TYPE,FSTYPE,MOUNTPOINTS,MODEL</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo pvs</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo vgs</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo lvs</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="440" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="464" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">NAME          SIZE TYPE FSTYPE      MOUNTPOINTS</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">sda            30G disk</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">├─sda1          1G part xfs         /boot</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">└─sda2         29G part LVM2_member</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">  ├─al-root    27G lvm  xfs         /</text><text x="32" y="584" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">  └─al-swap     2G lvm  swap        [SWAP]</text><text x="32" y="608" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">sdb             2G disk</text><text x="32" y="632" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Before/after example only. Do NOT assume your new disk is sdb.]</text></svg>
