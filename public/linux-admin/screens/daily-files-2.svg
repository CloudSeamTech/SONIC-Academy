<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc"><title id="title">Copy a file before editing it</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. A line beginning +Second line shows the new text. diff exits 1 when files differ.</desc><rect width="1200" height="665" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Copy a file before editing it</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cp -a &quot;$HOME/sonic-admin/practice/readme.txt&quot; &quot;$HOME/sonic-admin/pr</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">actice/readme.txt.before&quot;</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ printf &quot;Second line\n&quot; &gt;&gt; &quot;$HOME/sonic-admin/practice/readme.txt&quot;</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ diff -u &quot;$HOME/sonic-admin/practice/readme.txt.before&quot; &quot;$HOME/sonic</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">-admin/practice/readme.txt&quot;</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="464" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">--- readme.txt.before</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">+++ readme.txt</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">@@ -1 +1,2 @@</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"> Practice only</text><text x="32" y="584" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">+Second line</text><text x="32" y="608" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[diff exit status 1 means differences were found.]</text></svg>
