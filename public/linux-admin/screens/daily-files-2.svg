<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc"><title id="title">Copy a file before editing it</title><desc id="desc">Instructional mockup. Not a live terminal capture. A line beginning +Second line shows the new text. diff exits 1 when files differ.</desc><rect width="1100" height="680" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Copy a file before editing it</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">cp -a &quot;$HOME/sonic-admin/practice/readme.txt&quot; &quot;$HOME/sonic-</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">admin/practice/readme.txt.before&quot;</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">printf &quot;Second line\n&quot; &gt;&gt; &quot;$HOME/sonic-admin/practice/readme.txt&quot;</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">diff -u &quot;$HOME/sonic-admin/practice/readme.txt.before&quot; &quot;$HOME/sonic-</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">admin/practice/readme.txt&quot;</text><text x="32" y="302" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="327" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="352" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">--- readme.txt.before</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">+++ readme.txt</text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">@@ -1 +1,2 @@</text><text x="32" y="427" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve"> Practice only</text><text x="32" y="452" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">+Second line</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[diff exit status 1 means differences were found.]</text><text x="32" y="502" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="527" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A before-copy lets us compare and undo a small edit. &gt;&gt; adds text; &gt; replaces text.</text><text x="32" y="577" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="602" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="627" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">The comparison shows only the intended extra line.</text></svg>
