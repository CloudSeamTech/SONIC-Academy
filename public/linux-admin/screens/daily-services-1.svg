<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="805" viewBox="0 0 1100 805" role="img" aria-labelledby="title desc"><title id="title">Create a deliberately broken practice unit</title><desc id="desc">Instructional mockup. Not a live terminal capture. The start fails. This is intentional; no real service is stopped.</desc><rect width="1100" height="805" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Create a deliberately broken practice unit</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo tee /etc/systemd/system/sonic-practice.service &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Unit]</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">Description=SONIC disposable practice service</text><text x="32" y="252" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">[Service]</text><text x="32" y="277" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">Type=oneshot</text><text x="32" y="302" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ExecStart=/usr/bin/sonic-missing-command</text><text x="32" y="327" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">RemainAfterExit=yes</text><text x="32" y="352" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">EOF</text><text x="32" y="377" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl daemon-reload</text><text x="32" y="402" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">sudo systemctl start sonic-practice.service</text><text x="32" y="427" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="452" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Job for sonic-practice.service failed because the control process</text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">exited with error code.</text><text x="32" y="527" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">See &quot;systemctl status sonic-practice.service&quot; and &quot;journalctl&quot; for details.</text><text x="32" y="552" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">[Intentional failure on the disposable practice unit.]</text><text x="32" y="577" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="602" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="627" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">A named disposable unit lets you practice failure without breaking SSH or the </text><text x="32" y="652" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">website.</text><text x="32" y="677" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="702" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="727" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Only sonic-practice fails. Continue to diagnosis instead of restarting it </text><text x="32" y="752" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">repeatedly.</text></svg>
