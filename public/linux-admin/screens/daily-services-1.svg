<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="761" viewBox="0 0 1200 761" role="img" aria-labelledby="title desc"><title id="title">Create a deliberately broken practice unit</title><desc id="desc">Instructional mockup, not a live capture. Full sample prompt with working directory. The start fails. This is intentional; no real service is stopped.</desc><rect width="1200" height="761" rx="16" fill="#20182d"/><rect x="20" y="20" width="1160" height="48" rx="8" fill="#352843"/><text x="38" y="50" fill="#fff" font-family="monospace" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#fff" font-family="sans-serif" font-size="24">Create a deliberately broken practice unit</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  START HERE: Bash in your Linux VM</text><text x="32" y="176" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Required starting folder: ~ — sample user/host; yours may differ.</text><text x="32" y="200" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ cd &quot;$HOME&quot;</text><text x="32" y="224" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ pwd</text><text x="32" y="248" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">/home/learner</text><text x="32" y="272" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="296" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">02  TYPE THESE COMMANDS — COPY USING THE WEBSITE BUTTON</text><text x="32" y="320" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo tee /etc/systemd/system/sonic-practice.service &gt; /dev/null &lt;&lt;'</text><text x="32" y="344" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">EOF'</text><text x="32" y="368" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; [Unit]</text><text x="32" y="392" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; Description=SONIC disposable practice service</text><text x="32" y="416" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; [Service]</text><text x="32" y="440" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; Type=oneshot</text><text x="32" y="464" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; ExecStart=/usr/bin/sonic-missing-command</text><text x="32" y="488" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; RemainAfterExit=yes</text><text x="32" y="512" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">&gt; EOF</text><text x="32" y="536" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo systemctl daemon-reload</text><text x="32" y="560" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[learner@alma-lab01 ~]$ sudo systemctl start sonic-practice.service</text><text x="32" y="584" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="608" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">03  EXPECTED OBSERVATION — NOT A MEASURED RESULT</text><text x="32" y="632" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">Job for sonic-practice.service failed because the control process</text><text x="32" y="656" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">exited with error code.</text><text x="32" y="680" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">See &quot;systemctl status sonic-practice.service&quot; and &quot;journalctl&quot; for details.</text><text x="32" y="704" fill="#ede6f4" font-family="monospace" font-size="19" xml:space="preserve">[Intentional failure on the disposable practice unit.]</text></svg>
