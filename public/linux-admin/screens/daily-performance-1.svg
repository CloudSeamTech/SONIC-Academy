<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">Ask what is slow, then inspect processes</title><desc id="desc">Instructional mockup. Not a live terminal capture. Load and CPU count followed by top CPU consumers. Percentages vary.</desc><rect width="1100" height="555" rx="18" fill="#20182d"/><rect x="20" y="20" width="1060" height="52" rx="9" fill="#352843"/><circle cx="44" cy="46" r="6" fill="#ffad55"/><circle cx="66" cy="46" r="6" fill="#bda3e4"/><text x="86" y="51" fill="#ffffff" font-family="monospace" font-size="17">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE</text><text x="32" y="108" fill="#ffffff" font-family="sans-serif" font-weight="700" font-size="23">Ask what is slow, then inspect processes</text><text x="32" y="152" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">01  TYPE IN YOUR VM — COPY FROM THE COMMAND BOX, NOT THIS IMAGE</text><text x="32" y="177" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">uptime</text><text x="32" y="202" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">nproc</text><text x="32" y="227" fill="#f5f0ff" font-family="monospace" font-size="19" xml:space="preserve">ps -eo pid,user,comm,%cpu,%mem --sort=-%cpu | head -n 12</text><text x="32" y="252" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="277" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">02  EXPECTED OBSERVATION — YOUR VALUES MAY DIFFER</text><text x="32" y="302" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Load and CPU count followed by top CPU consumers. Percentages vary.</text><text x="32" y="327" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="352" fill="#ffb45b" font-family="monospace" font-size="19" xml:space="preserve">03  WHY THIS CHECK MATTERS</text><text x="32" y="377" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Ask which task, when it started, whether all users are affected, and what changed </text><text x="32" y="402" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">before blaming hardware.</text><text x="32" y="427" fill="#fff" font-family="monospace" font-size="19" xml:space="preserve"></text><text x="32" y="452" fill="#bfa3ff" font-family="monospace" font-size="19" xml:space="preserve">04  VERIFY BEFORE CONTINUING</text><text x="32" y="477" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">Record the slow action and the top processes. Compare load with available CPUs over </text><text x="32" y="502" fill="#e8e3ee" font-family="monospace" font-size="19" xml:space="preserve">time.</text></svg>
