<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="791" viewBox="0 0 1200 791" role="img" aria-labelledby="title desc"><title id="title">Test first, then reload gracefully — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="791" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Test first, then reload gracefully</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="171" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo nginx -t &amp;&amp; sudo systemctl reload nginx</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl is-active nginx</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">sudo journalctl -u nginx -n 20 --no-pager</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="373" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="404" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="398" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="404" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="443" fill="#292929" font-family="Arial, sans-serif" font-size="19">NGINX reports configuration syntax is ok and configuration test is successful; the service </text><text x="56" y="472" fill="#292929" font-family="Arial, sans-serif" font-size="19">remains active.</text><text x="32" y="545" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="580" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Run sudo nginx -t first. Both syntax is ok and test is successful must appear.</text><text x="32" y="607" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The &amp;&amp; ensures reload runs only if the test succeeded. A running old configuration is preferable to </text><text x="32" y="634" fill="#292929" font-family="Arial, sans-serif" font-size="17">forcing a broken change.</text><text x="32" y="661" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. After reload, check active state and the journal. A successful service reload is still not proof of </text><text x="32" y="688" fill="#292929" font-family="Arial, sans-serif" font-size="17">the browser-facing certificate.</text><text x="32" y="753" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>