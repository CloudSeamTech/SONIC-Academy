<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="708" viewBox="0 0 1200 708" role="img" aria-labelledby="title desc"><title id="title">Send only the checked CSR — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="708" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Send only the checked CSR</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="117" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">scp ~/tls-work/app-v1.csr learner@10.90.0.20:~/tls-ca/incoming/app-v1.csr</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="319" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="350" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="344" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="350" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="389" fill="#292929" font-family="Arial, sans-serif" font-size="19">The transfer completes for app-v1.csr; no .key file is transferred.</text><text x="32" y="462" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="497" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Switch back to the application SSH window and confirm hostname.</text><text x="32" y="524" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Paste the SCP command. For the first application-to-CA connection, compare the CA host fingerprint </text><text x="32" y="551" fill="#292929" font-family="Arial, sans-serif" font-size="17">with the one recorded from its console before accepting it.</text><text x="32" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Enter the CA learner password. This copies the .csr file into the incoming folder already created on </text><text x="32" y="605" fill="#292929" font-family="Arial, sans-serif" font-size="17">TLS-CA01.</text><text x="32" y="670" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>