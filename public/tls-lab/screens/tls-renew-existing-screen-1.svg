<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="990" viewBox="0 0 1200 990" role="img" aria-labelledby="title desc"><title id="title">Check whether key reuse is allowed — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="990" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Check whether key reuse is allowed</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Your Windows host · Notepad lab notes</text><rect x="28" y="167" width="1144" height="350" rx="8" fill="#f6f0e6" stroke="#ad987a"/><rect x="80" y="201" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="230" fill="#292929" font-family="Arial, sans-serif" font-size="21">Website leaf · public identity</text><rect x="80" y="260" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="289" fill="#292929" font-family="Arial, sans-serif" font-size="21">Intermediate CA · signs the leaf</text><rect x="80" y="319" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="348" fill="#292929" font-family="Arial, sans-serif" font-size="21">Root CA · client trust anchor</text><rect x="80" y="378" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="407" fill="#292929" font-family="Arial, sans-serif" font-size="21">Private key · secret, never shared</text><rect x="80" y="437" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="466" fill="#292929" font-family="Arial, sans-serif" font-size="21">CSR · public request, not certificate</text><circle cx="48" cy="222" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="42" y="228" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="547" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="572" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="578" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="617" fill="#292929" font-family="Arial, sans-serif" font-size="19">Your renewal note records why key reuse is permitted and the planned pairing.</text><text x="32" y="690" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="725" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Confirm the current site passes the live TLS test and record the current certificate serial and </text><text x="32" y="752" fill="#292929" font-family="Arial, sans-serif" font-size="17">notAfter.</text><text x="32" y="779" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. For this isolated exercise, assume policy permits reuse and app-v1.key has not been exposed. If a key</text><text x="32" y="806" fill="#292929" font-family="Arial, sans-serif" font-size="17"> may be compromised or policy requires rotation, skip to the new-key lab instead.</text><text x="32" y="833" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Write: new certificate app-r1.crt, existing key app-v1.key. The website SAN stays app.example.mil, </text><text x="32" y="860" fill="#292929" font-family="Arial, sans-serif" font-size="17">but serial and validity should change.</text><text x="32" y="887" fill="#292929" font-family="Arial, sans-serif" font-size="17">4. Do not expect a new notAfter inside the old file. The CA issues a different certificate file.</text><text x="32" y="952" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>