<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="title desc"><title id="title">Create a fresh version 3 request and key — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="924" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Create a fresh version 3 request and key</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="333" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo sh -c &#x27;umask 077; test ! -e /etc/pki/tls/private/app-v3.key &amp;&amp; openssl req -new -newkey </text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">rsa:3072 -noenc -sha256 -keyout /etc/pki/tls/private/app-v3.key -out /home/learner/tls-</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">work/app-v3.csr -config /home/learner/tls-work/req.cnf&#x27;</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">sudo chown root:root /etc/pki/tls/private/app-v3.key</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">sudo chmod 600 /etc/pki/tls/private/app-v3.key</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">sudo chmod 644 /home/learner/tls-work/app-v3.csr</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">sudo restorecon -v /etc/pki/tls/private/app-v3.key</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">openssl req -in ~/tls-work/app-v3.csr -noout -verify -subject -text</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">scp ~/tls-work/app-v3.csr learner@10.90.0.20:~/tls-ca/incoming/app-v3.csr</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="535" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="566" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="560" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="566" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="605" fill="#292929" font-family="Arial, sans-serif" font-size="19">A verified v3 CSR reaches the CA while app-v3.key stays root-owned on the application server.</text><text x="32" y="678" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="713" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Check the site still works, then paste the guarded block below. It creates app-v3.key and app-v3.csr </text><text x="32" y="740" fill="#292929" font-family="Arial, sans-serif" font-size="17">together.</text><text x="32" y="767" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Version 2 was only a CSR demonstration. This lab deliberately creates fresh version 3 key material </text><text x="32" y="794" fill="#292929" font-family="Arial, sans-serif" font-size="17">now.</text><text x="32" y="821" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Inspect the CSR signature and SAN before transferring it to the CA.</text><text x="32" y="886" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>