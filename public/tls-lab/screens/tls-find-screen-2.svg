<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="654" viewBox="0 0 1200 654" role="img" aria-labelledby="title desc"><title id="title">Confirm the operating system — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="654" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Confirm the operating system</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="117" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">cat /etc/redhat-release</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="319" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="350" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="344" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="350" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="389" fill="#292929" font-family="Arial, sans-serif" font-size="19">A line similar to Red Hat Enterprise Linux release 9.x appears; your minor version may differ.</text><text x="32" y="462" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="497" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. At the application’s Linux prompt, paste the command below and press Enter.</text><text x="32" y="524" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Read the release number before copying any NGINX configuration. Keep letter case exactly as the </text><text x="32" y="551" fill="#292929" font-family="Arial, sans-serif" font-size="17">command shows.</text><text x="32" y="616" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>