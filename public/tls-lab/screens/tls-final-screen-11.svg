<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="816" viewBox="0 0 1200 816" role="img" aria-labelledby="title desc"><title id="title">Resume monitoring and finish the change record — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="816" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Resume monitoring and finish the change record</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="225" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo /usr/local/sbin/check-app-tls</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl enable --now check-app-tls.timer</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl start check-app-tls.service</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl show check-app-tls.service -p Result</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl list-timers check-app-tls.timer --no-pager</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="427" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="458" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="452" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="458" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="497" fill="#292929" font-family="Arial, sans-serif" font-size="19">The monitor succeeds, Result=success appears and the timer has a next run.</text><text x="32" y="570" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="605" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Run the monitor manually and read its result before enabling the timer again.</text><text x="32" y="632" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Update your private inventory and change record with the new serial, expiry, v4 paths, owner, renewal</text><text x="32" y="659" fill="#292929" font-family="Arial, sans-serif" font-size="17"> date and safe recovery reference.</text><text x="32" y="686" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Complete the final assessment below. The completion indicator records your own lab verification and </text><text x="32" y="713" fill="#292929" font-family="Arial, sans-serif" font-size="17">quiz result; it is not a professional certification.</text><text x="32" y="778" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>