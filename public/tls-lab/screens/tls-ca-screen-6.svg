<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1059" viewBox="0 0 1200 1059" role="img" aria-labelledby="title desc"><title id="title">Make and sign the intermediate CA — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1059" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Make and sign the intermediate CA</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Practice CA server (TLS-CA01) · RHEL 9 Bash terminal · learner@10.90.0.20</text><rect x="28" y="167" width="1144" height="468" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-ca01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">cd ~/tls-ca</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">test ! -e intermediate.key &amp;&amp; openssl genpkey -algorithm RSA -aes-256-cbc -pkeyopt </text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">rsa_keygen_bits:3072 -out intermediate.key</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">openssl req -new -sha256 -key intermediate.key -out intermediate.csr -subj &#x27;/CN=SONIC Practice </text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">Issuing CA&#x27;</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">cat &gt; intermediate.ext &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">basicConstraints = critical,CA:TRUE,pathlen:0</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">keyUsage = critical,keyCertSign,cRLSign</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">subjectKeyIdentifier = hash</text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">authorityKeyIdentifier = keyid,issuer</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -req -in intermediate.csr -CA root.crt -CAkey root.key -CAserial root.srl </text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">-CAcreateserial -days 1825 -sha256 -extfile intermediate.ext -out intermediate.crt</text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">openssl verify -CAfile root.crt intermediate.crt</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="670" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="701" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="695" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="701" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="740" fill="#292929" font-family="Arial, sans-serif" font-size="19">intermediate.crt: OK appears.</text><text x="32" y="813" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="848" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Paste the block. For intermediate.key, choose a different strong passphrase. The signing command </text><text x="32" y="875" fill="#292929" font-family="Arial, sans-serif" font-size="17">later asks for the root key passphrase.</text><text x="32" y="902" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Paste the entire intermediate.ext text between the EOF markers. pathlen:0 prevents this intermediate </text><text x="32" y="929" fill="#292929" font-family="Arial, sans-serif" font-size="17">from authorizing another subordinate CA.</text><text x="32" y="956" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. The final verify command must succeed before this CA signs a website request.</text><text x="32" y="1021" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>