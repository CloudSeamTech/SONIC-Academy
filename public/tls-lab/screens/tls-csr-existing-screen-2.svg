<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1059" viewBox="0 0 1200 1059" role="img" aria-labelledby="title desc"><title id="title">Save the CSR settings file — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1059" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Save the CSR settings file</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="468" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01 · file content / shell here-document</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">mkdir -p ~/tls-work</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">cat &gt; ~/tls-work/req.cnf &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">[req]</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">prompt = no</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">distinguished_name = dn</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">req_extensions = req_ext</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">[dn]</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">CN = app.example.mil</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">[req_ext]</text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">subjectAltName = @alt_names</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">[alt_names]</text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">DNS.1 = app.example.mil</text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">cat ~/tls-work/req.cnf</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="670" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="701" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="695" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="701" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="740" fill="#292929" font-family="Arial, sans-serif" font-size="19">The file contains [req], [dn], [req_ext] and [alt_names] with DNS.1 = app.example.mil.</text><text x="32" y="813" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="848" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. In the application SSH terminal, paste this entire block, including the final EOF line. Do not add a </text><text x="32" y="875" fill="#292929" font-family="Arial, sans-serif" font-size="17">dollar-sign prompt.</text><text x="32" y="902" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The shell saves the lines between the markers into /home/learner/tls-work/req.cnf. This is a text </text><text x="32" y="929" fill="#292929" font-family="Arial, sans-serif" font-size="17">file, not a list of separate Linux commands.</text><text x="32" y="956" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Run cat to check this public settings file. It must show DNS.1 = app.example.mil.</text><text x="32" y="1021" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>