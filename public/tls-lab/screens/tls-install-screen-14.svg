<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="791" viewBox="0 0 1200 791" role="img" aria-labelledby="title desc"><title id="title">Check HTTPS from Windows without a bypass — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="791" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Check HTTPS from Windows without a bypass</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Your Windows 10 host · Windows PowerShell</text><rect x="28" y="167" width="1144" height="144" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">Windows PowerShell — Windows host</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">curl.exe --cacert &quot;$env:USERPROFILE\Documents\SONIC-TLS\root.crt&quot; --resolve </text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">app.example.mil:443:10.90.0.10 --fail --silent --show-error --max-time 10 https://app.example.mil/</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="346" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="377" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="371" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="377" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="416" fill="#292929" font-family="Arial, sans-serif" font-size="19">The response contains TLS practice application and Hosted on TLS-APP01. No certificate warning </text><text x="56" y="445" fill="#292929" font-family="Arial, sans-serif" font-size="19">is suppressed.</text><text x="32" y="518" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="553" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Open normal Windows PowerShell and paste the block below. Use curl.exe, not PowerShell’s older curl </text><text x="32" y="580" fill="#292929" font-family="Arial, sans-serif" font-size="17">alias.</text><text x="32" y="607" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The --resolve option targets only this private address. --cacert trusts the one practice root for </text><text x="32" y="634" fill="#292929" font-family="Arial, sans-serif" font-size="17">this command; it does not trust every certificate.</text><text x="32" y="661" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Look for our TLS practice application page. Do not add -k or --insecure to silence a certificate </text><text x="32" y="688" fill="#292929" font-family="Arial, sans-serif" font-size="17">error.</text><text x="32" y="753" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>