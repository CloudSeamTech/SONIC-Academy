<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1046" viewBox="0 0 1200 1046" role="img" aria-labelledby="title desc"><title id="title">Record the result and retain a safe recovery pair — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1046" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Record the result and retain a safe recovery pair</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Your Windows host · Notepad lab notes</text><rect x="28" y="167" width="1144" height="350" rx="8" fill="#f6f0e6" stroke="#ad987a"/><rect x="80" y="201" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="230" fill="#292929" font-family="Arial, sans-serif" font-size="21">External practice user</text><rect x="80" y="260" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="289" fill="#292929" font-family="Arial, sans-serif" font-size="21">Firewall / private lab boundary</text><rect x="80" y="319" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="348" fill="#292929" font-family="Arial, sans-serif" font-size="21">RHEL 9 DMZ application server</text><rect x="80" y="378" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="407" fill="#292929" font-family="Arial, sans-serif" font-size="21">NGINX · TLS ends here</text><rect x="80" y="437" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="466" fill="#292929" font-family="Arial, sans-serif" font-size="21">Hosted practice application</text><circle cx="48" cy="222" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="42" y="228" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="547" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="572" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="578" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="617" fill="#292929" font-family="Arial, sans-serif" font-size="19">Your notes identify v3 as the active certificate/key pair and document a security-valid rollback</text><text x="56" y="646" fill="#292929" font-family="Arial, sans-serif" font-size="19"> decision.</text><text x="32" y="719" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="754" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Record the application name, private IP, active chain path, active key path, issuer, serial, SAN, UTC</text><text x="32" y="781" fill="#292929" font-family="Arial, sans-serif" font-size="17"> expiry, change owner and client-test result.</text><text x="32" y="808" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Record the rollback file and the time limit for retaining the older pair. Do not copy private key </text><text x="32" y="835" fill="#292929" font-family="Arial, sans-serif" font-size="17">contents into your evidence.</text><text x="32" y="862" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. If rotation was due to exposure, the old key is not a usable rollback. Follow the real CA’s </text><text x="32" y="889" fill="#292929" font-family="Arial, sans-serif" font-size="17">revocation and incident process.</text><text x="32" y="916" fill="#292929" font-family="Arial, sans-serif" font-size="17">4. Update monitoring and inventory after every renewal. A saved screenshot alone does not schedule the </text><text x="32" y="943" fill="#292929" font-family="Arial, sans-serif" font-size="17">next renewal.</text><text x="32" y="1008" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>