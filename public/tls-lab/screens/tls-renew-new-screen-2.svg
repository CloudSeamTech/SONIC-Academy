<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc"><title id="title">Issue the version 3 certificate — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="870" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Issue the version 3 certificate</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Practice CA server (TLS-CA01) · RHEL 9 Bash terminal · learner@10.90.0.20</text><rect x="28" y="167" width="1144" height="279" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-ca01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">cd ~/tls-ca</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">openssl req -in incoming/app-v3.csr -noout -verify -subject</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -req -in incoming/app-v3.csr -CA intermediate.crt -CAkey intermediate.key -CAserial </text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">intermediate.srl -CAcreateserial -days 90 -sha256 -extfile server.ext -out issued/app-v3.crt</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -in issued/app-v3.crt -noout -dates -serial -ext subjectAltName</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">cp issued/app-v3.crt public/</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">chmod 644 public/app-v3.crt</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="481" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="512" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="506" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="512" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="551" fill="#292929" font-family="Arial, sans-serif" font-size="19">A new app-v3.crt names app.example.mil and has a new serial.</text><text x="32" y="624" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="659" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Check the CSR signature and intended subject at the CA. Use the previously approved fixed server.ext </text><text x="32" y="686" fill="#292929" font-family="Arial, sans-serif" font-size="17">SAN.</text><text x="32" y="713" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Sign with the existing intermediate, enter its passphrase privately, and make only the new public </text><text x="32" y="740" fill="#292929" font-family="Arial, sans-serif" font-size="17">response available.</text><text x="32" y="767" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Inspect the new certificate’s names and dates before returning it.</text><text x="32" y="832" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>