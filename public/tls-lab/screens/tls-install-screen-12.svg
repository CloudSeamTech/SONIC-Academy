<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="789" viewBox="0 0 1200 789" role="img" aria-labelledby="title desc"><title id="title">Copy the public root to Windows — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="789" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Copy the public root to Windows</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Your Windows 10 host · Windows PowerShell</text><rect x="28" y="167" width="1144" height="171" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">Windows PowerShell — Windows host</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">New-Item -ItemType Directory -Force &quot;$env:USERPROFILE\Documents\SONIC-TLS&quot;</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">scp learner@10.90.0.20:~/tls-ca/public/root.crt &quot;$env:USERPROFILE\Documents\SONIC-TLS\root.crt&quot;</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">certutil -dump &quot;$env:USERPROFILE\Documents\SONIC-TLS\root.crt&quot;</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="373" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="404" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="398" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="404" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="443" fill="#292929" font-family="Arial, sans-serif" font-size="19">root.crt is in Windows Documents\SONIC-TLS, and certutil can read the public certificate.</text><text x="32" y="516" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="551" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Open a normal Windows PowerShell window, not either SSH window. Type exit first if the prompt is </text><text x="32" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">still a Linux prompt.</text><text x="32" y="605" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Paste the block. This creates a folder under your Windows Documents and copies only the public root </text><text x="32" y="632" fill="#292929" font-family="Arial, sans-serif" font-size="17">certificate.</text><text x="32" y="659" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Inspect its public subject and issuer with certutil -dump. In the Firefox trust step, compare the </text><text x="32" y="686" fill="#292929" font-family="Arial, sans-serif" font-size="17">SHA-256 certificate fingerprint directly with the CA console; a whole-file hash is a different value.</text><text x="32" y="751" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>