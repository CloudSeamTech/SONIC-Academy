<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1194" viewBox="0 0 1200 1194" role="img" aria-labelledby="title desc"><title id="title">Create the HTTPS server block — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1194" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Create the HTTPS server block</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="522" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01 · file content / shell here-document</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo tee /etc/nginx/conf.d/app-tls.conf &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">server {</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">    listen 443 ssl;</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">    server_name app.example.mil;</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">    ssl_protocols TLSv1.2 TLSv1.3;</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">    ssl_certificate /etc/pki/tls/certs/app-v1-fullchain.pem;</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">    ssl_certificate_key /etc/pki/tls/private/app-v1.key;</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">    root /usr/share/nginx/html/tls-lab;</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">    index index.html;</text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">    location / {</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">        try_files $uri $uri/ =404;</text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">    }</text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">}</text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="652" fill="#f2f2f2" font-family="monospace" font-size="17">sudo restorecon -v /etc/nginx/conf.d/app-tls.conf</text><text x="64" y="679" fill="#f2f2f2" font-family="monospace" font-size="17">sudo sed -n &#x27;1,30p&#x27; /etc/nginx/conf.d/app-tls.conf</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="724" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="755" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="749" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="755" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="794" fill="#292929" font-family="Arial, sans-serif" font-size="19">The file shows listen 443 ssl, server_name app.example.mil and the intended v1 chain/key paths.</text><text x="32" y="867" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="902" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Use the loaded /etc/nginx/conf.d directory confirmed in Module 2. This is a fresh lab; do not create </text><text x="32" y="929" fill="#292929" font-family="Arial, sans-serif" font-size="17">a duplicate HTTPS site on an existing production server.</text><text x="32" y="956" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Paste the entire here-document block below. The final EOF must be on its own line. sudo tee writes </text><text x="32" y="983" fill="#292929" font-family="Arial, sans-serif" font-size="17">the file; &gt; /dev/null only hides the repeated text.</text><text x="32" y="1010" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. The server_name is the application address. ssl_certificate names the public full chain; </text><text x="32" y="1037" fill="#292929" font-family="Arial, sans-serif" font-size="17">ssl_certificate_key names the separate matching private key.</text><text x="32" y="1064" fill="#292929" font-family="Arial, sans-serif" font-size="17">4. Run the final sed command to read back the file. It does not change it. No reload happens until the </text><text x="32" y="1091" fill="#292929" font-family="Arial, sans-serif" font-size="17">next step.</text><text x="32" y="1156" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>