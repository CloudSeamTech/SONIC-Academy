<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1331" viewBox="0 0 1200 1331" role="img" aria-labelledby="title desc"><title id="title">Schedule the check and inspect its result — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1331" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Schedule the check and inspect its result</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="711" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo tee /etc/systemd/system/check-app-tls.service &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">[Unit]</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">Description=Check private practice HTTPS certificate and page</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">After=network-online.target nginx.service</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">Wants=network-online.target</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">[Service]</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">Type=oneshot</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">ExecStart=/usr/local/sbin/check-app-tls</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">sudo tee /etc/systemd/system/check-app-tls.timer &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">[Unit]</text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">Description=Daily private practice TLS check</text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">[Timer]</text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">OnCalendar=daily</text><text x="64" y="652" fill="#f2f2f2" font-family="monospace" font-size="17">Persistent=true</text><text x="64" y="679" fill="#f2f2f2" font-family="monospace" font-size="17">[Install]</text><text x="64" y="706" fill="#f2f2f2" font-family="monospace" font-size="17">WantedBy=timers.target</text><text x="64" y="733" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="760" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl daemon-reload</text><text x="64" y="787" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl enable --now check-app-tls.timer</text><text x="64" y="814" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl start check-app-tls.service</text><text x="64" y="841" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl list-timers check-app-tls.timer --no-pager</text><text x="64" y="868" fill="#f2f2f2" font-family="monospace" font-size="17">sudo journalctl -u check-app-tls.service -n 30 --no-pager</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="913" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="944" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="938" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="944" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="983" fill="#292929" font-family="Arial, sans-serif" font-size="19">The timer has a next run, and the one-shot service journal shows a successful check. A </text><text x="56" y="1012" fill="#292929" font-family="Arial, sans-serif" font-size="19">successful one-shot service may be inactive afterwards.</text><text x="32" y="1085" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="1120" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Paste both unit files and the final commands. The timer uses the VM’s configured time; note that time</text><text x="32" y="1147" fill="#292929" font-family="Arial, sans-serif" font-size="17"> zone in your inventory.</text><text x="32" y="1174" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Run the service once now, then list timers and read its journal.</text><text x="32" y="1201" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. This local timer records results on the VM only. It does not send email, page an operator or renew a </text><text x="32" y="1228" fill="#292929" font-family="Arial, sans-serif" font-size="17">certificate. A real team must connect failures to its approved monitoring and response system.</text><text x="32" y="1293" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>