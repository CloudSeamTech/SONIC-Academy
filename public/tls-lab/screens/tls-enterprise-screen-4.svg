<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1167" viewBox="0 0 1200 1167" role="img" aria-labelledby="title desc"><title id="title">Monitor the actual endpoint, not a stale filename — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1167" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Monitor the actual endpoint, not a stale filename</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="576" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01 · file content / shell here-document</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo tee /usr/local/sbin/check-app-tls &gt; /dev/null &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">#!/bin/bash</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">set -euo pipefail</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">sample=$(mktemp)</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">trap &#x27;rm -f &quot;$sample&quot;&#x27; EXIT</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">timeout 10 openssl s_client -connect 10.90.0.10:443 -servername app.example.mil \</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">  -CAfile /etc/pki/tls/certs/sonic-lab-root.crt -verify_return_error \</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">  -verify_hostname app.example.mil -showcerts &lt; /dev/null | \</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">  awk &#x27;/-----BEGIN CERTIFICATE-----/{in_cert=1} in_cert{print} /-----END </text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">CERTIFICATE-----/{in_cert=0}&#x27; &gt; &quot;$sample&quot;</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -in &quot;$sample&quot; -noout -checkend 2592000</text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">curl --cacert /etc/pki/tls/certs/sonic-lab-root.crt \</text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">  --resolve app.example.mil:443:10.90.0.10 --fail --silent --show-error \</text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">  --max-time 10 https://app.example.mil/ &gt; /dev/null</text><text x="64" y="652" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="679" fill="#f2f2f2" font-family="monospace" font-size="17">sudo chmod 755 /usr/local/sbin/check-app-tls</text><text x="64" y="706" fill="#f2f2f2" font-family="monospace" font-size="17">sudo restorecon -v /usr/local/sbin/check-app-tls</text><text x="64" y="733" fill="#f2f2f2" font-family="monospace" font-size="17">sudo /usr/local/sbin/check-app-tls</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="778" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="809" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="803" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="809" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="848" fill="#292929" font-family="Arial, sans-serif" font-size="19">The live endpoint verifies and Certificate will not expire appears. No private key is printed.</text><text x="32" y="921" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="956" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Paste the complete script below into the application terminal. It verifies the served endpoint with </text><text x="32" y="983" fill="#292929" font-family="Arial, sans-serif" font-size="17">SNI, checks the served leaf’s 30-day threshold, then requests the page.</text><text x="32" y="1010" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The temporary file contains only the public served chain. A trap removes it when the script exits. It</text><text x="32" y="1037" fill="#292929" font-family="Arial, sans-serif" font-size="17"> never reads or exports a private key.</text><text x="32" y="1064" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Run the final command. All checks must succeed; a connection or certificate failure returns nonzero.</text><text x="32" y="1129" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>