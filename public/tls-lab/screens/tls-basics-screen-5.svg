<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1046" viewBox="0 0 1200 1046" role="img" aria-labelledby="title desc"><title id="title">Build the trust chain — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1046" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Build the trust chain</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Your Windows host · Notepad lab notes</text><rect x="28" y="167" width="1144" height="350" rx="8" fill="#f6f0e6" stroke="#ad987a"/><rect x="80" y="201" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="230" fill="#292929" font-family="Arial, sans-serif" font-size="21">Website leaf · public identity</text><rect x="80" y="260" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="289" fill="#292929" font-family="Arial, sans-serif" font-size="21">Intermediate CA · signs the leaf</text><rect x="80" y="319" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="348" fill="#292929" font-family="Arial, sans-serif" font-size="21">Root CA · client trust anchor</text><rect x="80" y="378" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="407" fill="#292929" font-family="Arial, sans-serif" font-size="21">Private key · secret, never shared</text><rect x="80" y="437" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="466" fill="#292929" font-family="Arial, sans-serif" font-size="21">CSR · public request, not certificate</text><circle cx="48" cy="222" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="42" y="228" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="547" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="572" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="578" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="617" fill="#292929" font-family="Arial, sans-serif" font-size="19">Your drawn chain is leaf → intermediate → trusted root. Your server bundle is leaf + </text><text x="56" y="646" fill="#292929" font-family="Arial, sans-serif" font-size="19">intermediate, not key + root.</text><text x="32" y="719" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="754" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. The website leaf certificate is like your ID. An intermediate CA is the office allowed to issue it. A</text><text x="32" y="781" fill="#292929" font-family="Arial, sans-serif" font-size="17"> root CA is the top trust anchor.</text><text x="32" y="808" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The root signs the intermediate; the intermediate signs the website certificate. The root private key</text><text x="32" y="835" fill="#292929" font-family="Arial, sans-serif" font-size="17"> is especially sensitive and normally kept offline in a real PKI.</text><text x="32" y="862" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. NGINX sends the website certificate first, then the intermediate certificates in order. It normally </text><text x="32" y="889" fill="#292929" font-family="Arial, sans-serif" font-size="17">does not send the root.</text><text x="32" y="916" fill="#292929" font-family="Arial, sans-serif" font-size="17">4. The client separately decides which roots to trust. Receiving a root from a random website does not </text><text x="32" y="943" fill="#292929" font-family="Arial, sans-serif" font-size="17">make it trusted.</text><text x="32" y="1008" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>