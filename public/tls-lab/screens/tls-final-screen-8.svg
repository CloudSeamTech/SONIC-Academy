<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1059" viewBox="0 0 1200 1059" role="img" aria-labelledby="title desc"><title id="title">Validate and stage the replacement — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1059" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Validate and stage the replacement</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="495" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">scp learner@10.90.0.20:~/tls-ca/public/app-v4.crt ~/tls-work/app-v4.crt</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -in ~/tls-work/app-v4.crt -noout -dates -serial -ext subjectAltName</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">openssl verify -CAfile ~/tls-work/root.crt -untrusted ~/tls-work/intermediate.crt -purpose sslserver</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17"> -verify_hostname app.example.mil ~/tls-work/app-v4.crt</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">set -o pipefail</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -in ~/tls-work/app-v4.crt -pubkey -noout | openssl pkey -pubin -outform DER | openssl </text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">dgst -sha256</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">sudo openssl pkey -in /etc/pki/tls/private/app-v4.key -pubout -outform DER | openssl dgst -sha256</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">cat ~/tls-work/app-v4.crt ~/tls-work/intermediate.crt &gt; ~/tls-work/app-v4-fullchain.pem</text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">sudo install -o root -g root -m 0644 ~/tls-work/app-v4.crt /etc/pki/tls/certs/app-v4.crt</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">sudo install -o root -g root -m 0644 ~/tls-work/app-v4-fullchain.pem </text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">/etc/pki/tls/certs/app-v4-fullchain.pem</text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">sudo restorecon -v /etc/pki/tls/certs/app-v4.crt /etc/pki/tls/certs/app-v4-fullchain.pem </text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">/etc/pki/tls/private/app-v4.key</text><text x="64" y="652" fill="#f2f2f2" font-family="monospace" font-size="17">sudo matchpathcon -V /etc/pki/tls/certs/app-v4-fullchain.pem /etc/pki/tls/private/app-v4.key</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="697" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="728" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="722" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="728" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="767" fill="#292929" font-family="Arial, sans-serif" font-size="19">Trust, DNS name, dates, key match and file-context checks pass for v4.</text><text x="32" y="840" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="875" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Receive the new leaf and verify the approved chain and hostname.</text><text x="32" y="902" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Compare public-key fingerprints against app-v4.key, then build the leaf-first full chain.</text><text x="32" y="929" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Install the public files and verify SELinux contexts. Leave the protected v3 baseline available until</text><text x="32" y="956" fill="#292929" font-family="Arial, sans-serif" font-size="17"> the final check is complete.</text><text x="32" y="1021" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>