<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1140" viewBox="0 0 1200 1140" role="img" aria-labelledby="title desc"><title id="title">Approve the request and issue the leaf — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1140" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Approve the request and issue the leaf</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Practice CA server (TLS-CA01) · RHEL 9 Bash terminal · learner@10.90.0.20</text><rect x="28" y="167" width="1144" height="468" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-ca01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">cd ~/tls-ca</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">openssl req -in incoming/app-v1.csr -noout -verify -subject -text</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">cat &gt; server.ext &lt;&lt;&#x27;EOF&#x27;</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">basicConstraints = critical,CA:FALSE</text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">keyUsage = critical,digitalSignature,keyEncipherment</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">extendedKeyUsage = serverAuth</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">subjectAltName = DNS:app.example.mil</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">subjectKeyIdentifier = hash</text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">authorityKeyIdentifier = keyid,issuer</text><text x="64" y="517" fill="#f2f2f2" font-family="monospace" font-size="17">EOF</text><text x="64" y="544" fill="#f2f2f2" font-family="monospace" font-size="17">openssl x509 -req -in incoming/app-v1.csr -CA intermediate.crt -CAkey intermediate.key -CAserial </text><text x="64" y="571" fill="#f2f2f2" font-family="monospace" font-size="17">intermediate.srl -CAcreateserial -days 90 -sha256 -extfile server.ext -out issued/app-v1.crt</text><text x="64" y="598" fill="#f2f2f2" font-family="monospace" font-size="17">openssl verify -CAfile root.crt -untrusted intermediate.crt -purpose sslserver -verify_hostname </text><text x="64" y="625" fill="#f2f2f2" font-family="monospace" font-size="17">app.example.mil issued/app-v1.crt</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="670" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="701" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="695" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="701" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="740" fill="#292929" font-family="Arial, sans-serif" font-size="19">issued/app-v1.crt: OK appears. The certificate is valid for a 90-day practice period.</text><text x="32" y="813" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="848" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. In the CA window, run the first inspection command and check the CSR signature and </text><text x="32" y="875" fill="#292929" font-family="Arial, sans-serif" font-size="17">DNS:app.example.mil.</text><text x="32" y="902" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. Only for your isolated lab, record your pretend approval. If the request asks for any other name, </text><text x="32" y="929" fill="#292929" font-family="Arial, sans-serif" font-size="17">stop rather than sign it.</text><text x="32" y="956" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Paste server.ext exactly. It permits server authentication and the one approved DNS name; it does not</text><text x="32" y="983" fill="#292929" font-family="Arial, sans-serif" font-size="17"> authorize CA signing.</text><text x="32" y="1010" fill="#292929" font-family="Arial, sans-serif" font-size="17">4. Run the issuance command, entering the intermediate key passphrase privately. The root key is not </text><text x="32" y="1037" fill="#292929" font-family="Arial, sans-serif" font-size="17">used to sign this leaf.</text><text x="32" y="1102" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>