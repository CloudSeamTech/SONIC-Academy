<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1017" viewBox="0 0 1200 1017" role="img" aria-labelledby="title desc"><title id="title">Check names, dates and matching keys — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="1017" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Check names, dates and matching keys</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Your Windows host · Notepad lab notes</text><rect x="28" y="167" width="1144" height="350" rx="8" fill="#f6f0e6" stroke="#ad987a"/><rect x="80" y="201" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="230" fill="#292929" font-family="Arial, sans-serif" font-size="21">Website leaf · public identity</text><rect x="80" y="260" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="289" fill="#292929" font-family="Arial, sans-serif" font-size="21">Intermediate CA · signs the leaf</text><rect x="80" y="319" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="348" fill="#292929" font-family="Arial, sans-serif" font-size="21">Root CA · client trust anchor</text><rect x="80" y="378" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="407" fill="#292929" font-family="Arial, sans-serif" font-size="21">Private key · secret, never shared</text><rect x="80" y="437" width="1032" height="44" rx="8" fill="#d7c8b2" stroke="none"/><text x="105" y="466" fill="#292929" font-family="Arial, sans-serif" font-size="21">CSR · public request, not certificate</text><circle cx="48" cy="222" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="42" y="228" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="547" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="572" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="578" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="617" fill="#292929" font-family="Arial, sans-serif" font-size="19">Your checklist includes name, time, trusted chain, permitted purpose and matching private key.</text><text x="32" y="690" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="725" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. The Subject Alternative Name, or SAN, must include app.example.mil. Modern clients check SANs; the </text><text x="32" y="752" fill="#292929" font-family="Arial, sans-serif" font-size="17">Common Name alone is not enough.</text><text x="32" y="779" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The current time must be within notBefore and notAfter. Expired certificates cause clients to reject </text><text x="32" y="806" fill="#292929" font-family="Arial, sans-serif" font-size="17">the connection, even if NGINX still runs.</text><text x="32" y="833" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. The certificate’s public key must match the private key used by NGINX. We compare public-key </text><text x="32" y="860" fill="#292929" font-family="Arial, sans-serif" font-size="17">fingerprints without displaying secret key data.</text><text x="32" y="887" fill="#292929" font-family="Arial, sans-serif" font-size="17">4. We also check issuer chain, server-auth purpose and local policy. A good date alone is not a complete</text><text x="32" y="914" fill="#292929" font-family="Arial, sans-serif" font-size="17"> check.</text><text x="32" y="979" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>