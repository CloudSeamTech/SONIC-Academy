<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Check NGINX without changing it — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="710" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Check NGINX without changing it</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="117" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo systemctl status nginx --no-pager --full</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="319" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="350" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="344" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="350" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="389" fill="#292929" font-family="Arial, sans-serif" font-size="19">Active: active (running) appears after setup. A fresh unprepared server may show inactive or </text><text x="56" y="418" fill="#292929" font-family="Arial, sans-serif" font-size="19">Unit nginx.service could not be found.</text><text x="32" y="491" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="526" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Paste the command below. Find the Active line.</text><text x="32" y="553" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. If your screen says active (running), the process is running; this does not yet prove HTTPS works.</text><text x="32" y="580" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. If you run systemctl without --no-pager and see a full-screen status view, press q to return to the </text><text x="32" y="607" fill="#292929" font-family="Arial, sans-serif" font-size="17">prompt.</text><text x="32" y="672" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>