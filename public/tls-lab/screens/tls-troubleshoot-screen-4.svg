<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="764" viewBox="0 0 1200 764" role="img" aria-labelledby="title desc"><title id="title">The certificate chain is invalid — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="764" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">The certificate chain is invalid</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="144" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">openssl verify -CAfile ~/tls-work/root.crt -untrusted ~/tls-work/intermediate.crt -purpose sslserver</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17"> -verify_hostname app.example.mil ~/tls-work/app-v3.crt</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="346" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="377" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="371" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="377" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="416" fill="#292929" font-family="Arial, sans-serif" font-size="19">SIMULATED FAILURE CLUE — Verification fails if the issuer is wrong, signatures do not link, a CA</text><text x="56" y="445" fill="#292929" font-family="Arial, sans-serif" font-size="19"> is expired, or purpose constraints fail.</text><text x="32" y="518" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="553" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Use the troubleshooting simulation below to select this scenario and read its simulated evidence.</text><text x="32" y="580" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. On your own VM, run only the read-only diagnostic commands shown here. A healthy completed lab will </text><text x="32" y="607" fill="#292929" font-family="Arial, sans-serif" font-size="17">not reproduce the simulated error.</text><text x="32" y="634" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Compare the evidence with the verification note. Do not intentionally damage a key or certificate to </text><text x="32" y="661" fill="#292929" font-family="Arial, sans-serif" font-size="17">create the failure.</text><text x="32" y="726" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>