<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="816" viewBox="0 0 1200 816" role="img" aria-labelledby="title desc"><title id="title">Back up configuration before the first edit — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="816" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Back up configuration before the first edit</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="198" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo install -d -m 0700 /root/tls-rollbacks</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">sudo sh -c &#x27;test ! -e /root/tls-rollbacks/nginx-before-tls &amp;&amp; cp -a /etc/nginx /root/tls-</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">rollbacks/nginx-before-tls&#x27;</text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">sudo ls -ld /root/tls-rollbacks/nginx-before-tls</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="400" width="1144" height="111" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="431" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="425" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="431" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="470" fill="#292929" font-family="Arial, sans-serif" font-size="19">A root-only rollback folder contains the original NGINX configuration tree.</text><text x="32" y="543" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="578" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Paste the block below on this new application VM. The guard keeps you from overwriting an earlier </text><text x="32" y="605" fill="#292929" font-family="Arial, sans-serif" font-size="17">baseline.</text><text x="32" y="632" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The backup contains configuration only. The versioned private keys already remain in the protected </text><text x="32" y="659" fill="#292929" font-family="Arial, sans-serif" font-size="17">private directory; do not make extra unencrypted exports.</text><text x="32" y="686" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. In a real environment, follow the approved encrypted backup and retention policy. Keep the backup and</text><text x="32" y="713" fill="#292929" font-family="Arial, sans-serif" font-size="17"> its contents off GitHub.</text><text x="32" y="778" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>