<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Activate the certificate and key together — instructional mockup</title><desc id="desc">Step-specific guided recreation. Not a genuine screenshot or live result.</desc><rect x="0" y="0" width="1200" height="980" rx="0" fill="#e3d8c4" stroke="none"/><rect x="0" y="0" width="1200" height="48" rx="0" fill="#292929" stroke="none"/><text x="25" y="31" fill="white" font-family="Arial, sans-serif" font-size="18">INSTRUCTIONAL MOCKUP — NOT A LIVE CAPTURE OR RESULT</text><text x="32" y="87" fill="#292929" font-family="Arial, sans-serif" font-size="25">Activate the certificate and key together</text><text x="32" y="124" fill="#292929" font-family="Arial, sans-serif" font-size="17">Application server (TLS-APP01) · RHEL 9 Bash terminal · learner@10.90.0.10</text><rect x="28" y="167" width="1144" height="333" rx="8" fill="#202124" stroke="none"/><rect x="28" y="167" width="1144" height="42" rx="8" fill="#343438" stroke="none"/><text x="52" y="195" fill="#f5f5f5" font-family="Arial, sans-serif" font-size="17">RHEL 9 — learner@tls-app01</text><text x="64" y="240" fill="#e7975f" font-family="Arial, sans-serif" font-size="16">COMMAND / FILE CONTENT TO ENTER — PRESERVE CASE</text><text x="64" y="274" fill="#f2f2f2" font-family="monospace" font-size="17">sudo sh -c &#x27;test ! -e /root/tls-rollbacks/before-key-rotation.conf &amp;&amp; cp -a /etc/nginx/conf.d/app-</text><text x="64" y="301" fill="#f2f2f2" font-family="monospace" font-size="17">tls.conf /root/tls-rollbacks/before-key-rotation.conf&#x27;</text><text x="64" y="328" fill="#f2f2f2" font-family="monospace" font-size="17">sudo sed -i -E &#x27;s@ssl_certificate .*;@ssl_certificate /etc/pki/tls/certs/app-v3-fullchain.pem;@; </text><text x="64" y="355" fill="#f2f2f2" font-family="monospace" font-size="17">s@ssl_certificate_key .*;@ssl_certificate_key /etc/pki/tls/private/app-v3.key;@&#x27; </text><text x="64" y="382" fill="#f2f2f2" font-family="monospace" font-size="17">/etc/nginx/conf.d/app-tls.conf</text><text x="64" y="409" fill="#f2f2f2" font-family="monospace" font-size="17">sudo grep -E &#x27;ssl_certificate|ssl_certificate_key&#x27; /etc/nginx/conf.d/app-tls.conf</text><text x="64" y="436" fill="#f2f2f2" font-family="monospace" font-size="17">sudo nginx -t &amp;&amp; sudo systemctl reload nginx</text><text x="64" y="463" fill="#f2f2f2" font-family="monospace" font-size="17">openssl s_client -connect 10.90.0.10:443 -servername app.example.mil -CAfile ~/tls-work/root.crt </text><text x="64" y="490" fill="#f2f2f2" font-family="monospace" font-size="17">-verify_return_error -verify_hostname app.example.mil &lt; /dev/null</text><circle cx="47" cy="236" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="242" fill="white" font-family="Arial, sans-serif" font-size="18">1</text><rect x="28" y="535" width="1144" height="140" rx="8" fill="#d7c8b2" stroke="none"/><text x="67" y="566" fill="#292929" font-family="Arial, sans-serif" font-size="17">EXPECTED RESULT / SIMULATED CLUE — CHECK YOUR OWN MACHINE</text><circle cx="47" cy="560" r="18" fill="#7040a8" stroke="white" stroke-width="2"/><text x="41" y="566" fill="white" font-family="Arial, sans-serif" font-size="18">2</text><text x="56" y="605" fill="#292929" font-family="Arial, sans-serif" font-size="19">The two directives both reference v3; the live endpoint verifies and presents the v3 certificate</text><text x="56" y="634" fill="#292929" font-family="Arial, sans-serif" font-size="19"> serial.</text><text x="32" y="707" fill="#292929" font-family="Arial, sans-serif" font-size="18">FOLLOW THE NUMBERED INSTRUCTIONS IN THE LESSON</text><text x="32" y="742" fill="#292929" font-family="Arial, sans-serif" font-size="17">1. Back up the current working app-tls.conf once. The command supports either v1 or r1 as your current </text><text x="32" y="769" fill="#292929" font-family="Arial, sans-serif" font-size="17">successful state.</text><text x="32" y="796" fill="#292929" font-family="Arial, sans-serif" font-size="17">2. The two sed expressions replace the certificate and key directives with the staged v3 paths. Read the</text><text x="32" y="823" fill="#292929" font-family="Arial, sans-serif" font-size="17"> file back before testing.</text><text x="32" y="850" fill="#292929" font-family="Arial, sans-serif" font-size="17">3. Only if nginx -t succeeds should reload run. Then repeat the actual TLS test and browser certificate </text><text x="32" y="877" fill="#292929" font-family="Arial, sans-serif" font-size="17">view; record the new serial.</text><text x="32" y="942" fill="#292929" font-family="Arial, sans-serif" font-size="17">No real private key, real certificate result, production access or DoD endorsement is shown.</text></svg>